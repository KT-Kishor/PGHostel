# --- Card 1: Manage Vendors ---
topic_manageVendors_title=Manage Vendors
topic_manageVendors_desc=Vendors can register through the “Vendor Registration” button and submit required company and contact details. The Super Admin can review and verify complete vendor information submitted through the system. The Super Admin can approve or reject vendors based on the provided details and verification requirements. Vendors can upload supporting documents for registration and verification, while the Super Admin can view and manage them. The Super Admin can edit and update vendor information whenever required to maintain accurate records.

# --- Card 2: Branch Management ---
topic_branchManagement_title=Branch Management
topic_branchManagement_desc=The Admin can manage multiple branches by creating different branch types, such as Hostels, PGs, and Hotels. While creating a branch, the Admin can enter all required branch details, including applicable GST information. The system provides an option to specify whether GST is applicable to the respective branch. The Admin can download complete branch data in Excel format for reporting and record-keeping. The Admin can also edit, update, or delete existing branch details whenever required to maintain accurate branch records as needed.

# --- Card 3: Bed Management ---
topic_bedManagement_title=Bed Management
topic_bedManagement_desc=The Admin can create and manage bed types, such as Single Bed, Double Bed, and customized bed configurations. While creating a bed type, the Admin can provide required details and upload relevant images for identification. The Admin can define the number of rooms available for each bed type and specify the maximum number of occupants per room. All bed-related information can be downloaded in Excel format for reporting and record-keeping. The Admin can also manage existing bed types by editing or deleting their details whenever required.

# --- Card 4: Room Management ---
topic_roomManagement_title=Room Management
topic_roomManagement_desc=The Admin can create and manage rooms by assigning room numbers and defining the required number of rooms for each property. The Admin can set and manage room prices based on the selected room or room type. Room details, including room numbers, availability, and pricing, can be updated whenever required. The Admin can download room data in Excel format for reporting and record-keeping. The Admin can also edit room details, change room numbers or prices, and manage room information as needed. This helps maintain accurate room records.

# --- Card 5: Facility Management ---
topic_facilityManagement_title=Facility Management
topic_facilityManagement_desc=The Admin can create and manage various facilities and define the applicable pricing for each facility. The Admin can add facility images along with relevant details to provide an overview of the available services. Facility pricing can be configured based on different durations, such as daily, monthly, or yearly rates. The Admin can download facility data in Excel format for reporting and record-keeping purposes. The Admin can easily edit facility details, update prices, change images, and manage facility details whenever required.

# --- Card 6: Amenities Management ---
topic_amenitiesManagement_title=Amenities Management
topic_amenitiesManagement_desc=The Admin can create and manage various amenities available within each property. The Admin can add relevant images and provide detailed information for each amenity. The system allows the Admin to specify the number of amenities available at a particular property. Amenity data can be downloaded in Excel format for reporting and record-keeping purposes. The Admin can easily edit, update, or delete amenity details whenever required. This helps maintain accurate amenity records and provides clear information about available facilities across different properties for effective management and reference.

# --- Card 7: Coupon Management ---
topic_couponManagement_title=Coupon Management
topic_couponManagement_desc=The Admin can create and manage coupons by defining the coupon name, discount value, maximum discount limit, and usage limit. The Admin can configure the minimum order value and set an expiration date for each coupon. Coupons can be managed efficiently by updating their details and monitoring their validity and usage limits. The Admin can share coupons with customers through WhatsApp and email for promotional purposes. The complete coupon data can be downloaded in Excel format for reporting, tracking, and record-keeping as required.

# --- Card 8: Staff Management ---
topic_staffManagement_title=Staff Management
topic_staffManagement_desc=The Admin can create and manage staff members by assigning roles and responsibilities based on property requirements. Each staff member can be assigned to a branch to ensure access. Staff members can log in using their credentials and access only the applications and features authorized for their assigned role. The Admin can update staff information, including role assignments, branch information, and access permissions whenever required. Staff data can be downloaded in Excel format for reporting, tracking, and record-keeping purposes.

# --- Card 9: Admin Room Booking ---
topic_adminRoomBooking_title=Admin Room Booking
topic_adminRoomBooking_desc=The Admin Room Booking feature allows the Admin to create and manage bookings for customers and for self-booking when required. The Admin can book rooms for new customers by entering the necessary booking details and selecting available rooms. Existing customer bookings can also be created or managed using their existing customer information. The Admin can select room types, booking dates, members, facilities, coupons, and applicable GST or tax. Booking details can be reviewed and managed to ensure accurate reservations efficiently.

# --- Card 10: Admin Manage Bookings ---
topic_adminManageBookings_title=Admin Manage Bookings
topic_adminManageBookings_desc=The Admin can view and manage all bookings made by customers across different properties. The Admin can review and update booking details and manage booking status as required. Bookings can be confirmed, rejected, or cancelled based on availability and operational requirements. The Admin can assign available rooms to customers and manage room assignments throughout the booking process. Complete booking data can be downloaded in Excel format for reporting, tracking, verification, and record-keeping purposes, ensuring accurate and organized booking information is maintained across all properties.

# --- Card 11: Invoice Management ---
topic_invoiceManagement_title=Invoice Management
topic_invoiceManagement_desc=The Admin can generate and manage invoices based on customer requirements and booking details. Invoices can be generated for monthly, yearly, or complete booking periods. The Admin can apply GST details while generating invoices. Complete invoices can be downloaded in PDF format for sharing and record-keeping. The Admin can review invoice details, including billing amounts, GST, and applicable charges. The Admin can filter invoices based on criteria and download filtered invoice data in Excel format for reporting and record-keeping.

# --- Card 12: Deposit Details ---
topic_depositDetails_title=Deposit Details
topic_depositDetails_desc=The Admin can view and manage all deposit details collected from customers during room assignment. The system records the deposit amount along with customer and booking details for easy tracking. The Admin can review and edit deposit information whenever required to maintain accurate records. The Admin can process and record the return or refund of the deposit amount to the customer when applicable. Complete deposit data can be filtered and downloaded in Excel format for reporting, reconciliation, and record-keeping purposes.

# --- Card 13: Damage Details ---
topic_damageDetails_title=Damage Details
topic_damageDetails_desc=The Admin can record and manage damage details when a customer or student damages any property or facility. The Admin can create a damage record by adding item details, damage description, and applicable cost. The system can calculate and generate a PDF report showing the damaged item and the total associated cost. The Admin can review and edit damage records whenever required to maintain accurate information. Complete damage data can also be filtered and downloaded in Excel format for reporting, tracking, reconciliation, and record-keeping purposes across the property.

# --- Card 14: Complaint Details ---
topic_complaintDetails_title=Complaint Details
topic_complaintDetails_desc=The Admin can view and manage all complaints raised by customers or students, including complaint details. The Admin can review images and supporting attachments submitted with each complaint to understand the issue. Complaints can be assigned to the appropriate staff member for investigation and resolution. Once the issue is resolved, the Admin can update the complaint status and resolution details. Complaint information and key statistics can also be monitored through the dashboard for effective tracking and management as required.

# --- Card 15: Vendor Registration ---
topic_vendorRegistration_title=Vendor Registration
topic_vendorRegistration_desc=The Vendor can submit and manage registration details through the system. The Vendor can provide required business information, contact details, and verification documents during registration. After approval, login credentials will be sent to the registered email address. The Vendor can use these credentials to log in to the system. After the first login, the Vendor can change the provided password for security. Vendor details and documents can be managed whenever required to maintain accurate records for verification and reference.

# --- Card 16: Customer SignUp ---
topic_customerSignUp_title=Customer SignUp
topic_customerSignUp_desc=The Customer Signup Form allows customers to provide basic personal details, such as their name and mobile number. Users can enter contact information, including email address, country, city, and other relevant details. The form collects accurate information to create and maintain the customer profile. In the final step, customers can set a secure password for their account. Once all required details are completed, the customer can review the entered information, submit the form, and successfully create an account for accessing the system and managing their profile.

# --- Card 17: Set/Forgot Password ---
topic_setForgotPassword_title=Set/Forgot Password
topic_setForgotPassword_desc=The Set/Forgot Password feature allows customers to securely create or reset their account password. Customers need to enter their registered email address to receive a One-Time Password (OTP). After receiving the OTP, they must enter and verify it to confirm their identity. Once the OTP is successfully verified, the customer can enter and confirm a new password. After successfully setting the new password, the customer can use it to securely log in to their account and access the system without any issues for secure account access.

# --- Card 18: Create Booking ---
topic_createBooking_title=Create Booking
topic_createBooking_desc=The Create Booking feature allows customers to select a property and choose their preferred bed type before proceeding to the booking page. Customers can specify the booking date and the number of members staying. Additional facilities or services can be selected based on their requirements. Customers can also apply an available coupon and add applicable GST or tax to the booking. After reviewing all booking details and the final amount, the customer can confirm and book the room, ensuring all required information is complete.

# --- Card 19: Manage Booking ---
topic_manageBooking_title=Manage Booking
topic_manageBooking_desc=The Manage Booking feature allows customers to view and manage their existing bookings in one place. Customers can edit previously entered booking details, such as booking date, number of members, selected facilities, applied coupons, and applicable GST. If required, customers can cancel their booking directly from the Manage Booking section. The updated booking details and booking status are reflected immediately, helping customers keep track of their reservation and stay informed about the latest changes to their booking promptly.

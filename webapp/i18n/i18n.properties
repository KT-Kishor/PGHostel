policyGrievance2Title=Acknowledgement
policyGrievance2Html=<p>Complaints are acknowledged within the timelines required by applicable law.</p>
policyGrievance3Title=Resolution
policyGrievance3Html=<p>We will work with you and the Vendor to reach a fair resolution. If you are not satisfied, you may escalate to the Grievance Officer.</p>

# ─── Tour Guide - Tile Descriptions (default / full access) ─────────────────
tour_desc_branch=Manage hostel identity: setup address, tax profiles, check-in/out policies, and official logos.
tour_desc_bed=Manage bed inventory including room types, Image, occupancy limits, extra bed options, and currency-specific deposit details.
tour_desc_room=Configure room inventory by assigning branch codes, bed types, and defining tiered pricing (daily, monthly, yearly) in local currency
tour_desc_facilities=Manage branch-specific facilities by defining types, uploading photos, and setting flexible pricing from hourly to yearly tiers
tour_desc_hostelFeatures=Showcase branch-specific amenities by defining feature types, detailed descriptions, and high-quality images for residents.
tour_desc_coupon=Create and manage discount coupons. Set validity periods, discount values, usage limits and share coupons
tour_desc_staff=Register staff profiles with specific branch roles, contact details, and role-based access permissions.
tour_desc_vendor=Register and manage vendor profiles, including contact details, location info, and mandatory business verification documents
tour_desc_support=Review customer support requests, track issue types and status, and resolve resident-reported problems from one place.
tour_desc_bug=Raise and track application bugs or issues reported across hostel modules, with status tracking from Open to Resolved and supporting screenshots.
tour_desc_ads=Create and manage promotional advertisements shown to residents and visitors across hostel touchpoints, with scheduling and visibility control.
tour_desc_book=Quickly create bookings on behalf of walk-in or direct customers by selecting branch, room type, stay dates and guest details in one flow.
tour_desc_customer=Manage end-to-end guest lifecycles: handle bookings, assign or change rooms, and maintain customer profiles with stay details and verification documents.
tour_desc_invoice=Create tax-compliant invoices with GST details, SAC codes, and itemized price breakdowns for bookings
tour_desc_deposit=Track security deposit collections and process refunds with detailed transaction logs and return modes
tour_desc_payment=Monitor and export all customer payment histories, including transaction IDs, payment modes, and bank details
tour_desc_damage=Report property damages, calculate repair costs, and track recoveries from residents with detailed item logs
tour_desc_complaint=Monitor resident grievances, assign staff for resolution, and track status from 'Open' to 'Resolved' with visual evidence
tour_desc_customerReview=Analyze resident feedback with detailed ratings for cleanliness, staff service, and amenities to improve hostel quality
tour_desc_bookingDashboard=Visual overview of all bookings — occupancy trends, check-in/out analytics and room availability.
tour_desc_paymentDashboard=Graphical summary of payment history, revenue trends and outstanding dues.
tour_desc_complainDashboard=Dashboard view of all complaints — status breakdown, resolution trends and open cases.
tour_desc_damageDashboard=Dashboard view of damage reports — severity breakdown and resolution tracking.


# ─── Tour Guide - FrontOfficeEmployee View-Only descriptions (per tile) ──────
tour_desc_branch_view=View all branch details such as branch name, location, contact info and assigned administrators. You cannot add, edit or delete branches.
tour_desc_bed_view=Browse all configured bed types and their pricing. You cannot create new bed types or modify existing ones.
tour_desc_room_view=View room listings, their assigned bed types, floor details and occupancy status across the branch. You cannot add or edit room records.
tour_desc_facilities_view=View the extra facilities offered to residents such as laundry, meals and gym. You cannot add or modify facility records.
tour_desc_hostelFeatures_view=View the hostel amenities configured and displayed to residents. You cannot add, edit or remove any hostel amenities.
tour_desc_coupon_view=View all discount coupons, their validity dates and discount values and you can share coupon too.

# ─── Tour Guide - HouseKeeping View-Only descriptions ────────────────────────
tour_desc_complaint_view=View complaints raised by residents — complaint type, description, date and current status. You cannot raise, update or resolve complaints.

# Policies - Terms & Conditions
policyTermsTitle=Terms & Conditions
policyTermsSubtitle=The rules for using StayVriksha, for guests and property partners.
policyTermsKp1=StayVriksha is an intermediary marketplace; the accommodation contract is between the Customer and the Vendor.
policyTermsKp2=A Booking is confirmed only when the Platform issues a confirmation after successful payment.
policyTermsKp3=Each Vendor sets its own cancellation, refund, rescheduling and no-show policy for every Listing.
policyTerms1Title=Introduction and Acceptance
policyTerms1Html=<p>These Terms and Conditions (“Terms”) govern access to and use of the website, mobile application, and related services (collectively, the “Platform”) operated by StayVriksha (“StayVriksha”, “we”, “us”, or “our”), a company/proprietorship organised under the laws of India, having its registered office at 111, Kalpavriksha Karekal Layout, Near Railway Bridge, Kalaburagi, Karnataka – 585102.</p><p>The Platform enables (a) owners, managers, or operators of hotels, paying-guest (PG) accommodations, hostels, service apartments, and rental properties (“Vendors”) to list their properties for booking, and (b) members of the public (“Customers”, “Users”, or “you”) to search, book, and pay for stays at such properties.</p><p>By registering as a Vendor, creating a Customer account, browsing the Platform, or making a booking, you agree to be bound by these Terms, our Privacy Policy, and any additional policies referenced herein. If you do not agree, you must not use the Platform.</p>
policyTerms2Title=Definitions
policyTerms2Html=<dl class='def'><dt>Listing</dt><dd>Any property, room, bed, or unit advertised by a Vendor on the Platform.</dd><dt>Booking</dt><dd>A confirmed reservation made by a Customer for a Listing through the Platform.</dd><dt>Vendor Content</dt><dd>All photographs, descriptions, pricing, availability, policies, and other information a Vendor uploads or provides.</dd><dt>Booking Amount</dt><dd>The total amount payable by a Customer for a Booking, inclusive of applicable taxes and platform fees.</dd><dt>Applicable Law</dt><dd>The laws of the Republic of India, including but not limited to the Information Technology Act, 2000, the Consumer Protection Act, 2019 and rules made thereunder, and applicable state Shops and Establishments, tourism, and municipal regulations.</dd></dl>
policyTerms3Title=Role of StayVriksha — Intermediary Platform Only
policyTerms3Html=<p>StayVriksha is an online marketplace and intermediary that connects Customers with Vendors. StayVriksha does not own, operate, manage, or control any hotel, PG, hostel, service apartment, or rental property listed on the Platform, and is not a party to the accommodation or hospitality contract formed between a Vendor and a Customer upon Booking confirmation.</p><p>StayVriksha functions as an “intermediary” within the meaning of Section 2(1)(w) of the Information Technology Act, 2000, and disclaims all liability for Vendor Content and for the performance, safety, legality, and quality of any Listing, to the fullest extent permitted by law.</p><p>Nothing on the Platform constitutes an endorsement, warranty, or guarantee by StayVriksha of any Vendor, Listing, or property.</p>
policyTerms4Title=Vendor Registration and Eligibility
policyTerms4Html=<p>To list a property, a Vendor must complete registration and provide accurate, current, and complete information, including:</p><ul><li>Valid government-issued identity and address proof of the owner/authorised signatory;</li><li>Proof of ownership, lease, or authorisation to operate and let out the property;</li><li>All licences, registrations, permits, and certificates required under Applicable Law to operate the property as a hotel, PG, hostel, service apartment, or rental accommodation (including, where applicable, trade licence, police/PG registration, fire safety NOC, GST registration, and municipal health/lodging permits);</li><li>Bank account and PAN/GST details for settlement of payments.</li></ul><p>StayVriksha may, at its sole discretion, verify, suspend, reject, or de-list any Vendor or Listing at any time, with or without notice, and is under no obligation to conduct background checks, and any verification StayVriksha does perform does not amount to a warranty of the Vendor’s compliance or fitness.</p>
policyTerms5Title=Vendor Responsibilities — Vendor Bears Full Responsibility
policyTerms5Html=<p>The Vendor is solely and fully responsible for the property, the Listing, and the stay experience of the Customer. Without limiting the foregoing, the Vendor shall be exclusively responsible for:</p><ul><li>The accuracy of all Listing information, including photographs, room descriptions, amenities, pricing, availability, and house rules;</li><li>Obtaining and maintaining all licences, permits, registrations, insurance, and approvals required by Applicable Law to operate the property;</li><li>The physical safety, security, hygiene, fire safety, and structural soundness of the property;</li><li>The conduct, background verification, and supervision of the Vendor’s staff, security personnel, and representatives;</li><li>Honouring confirmed Bookings at the price, dates, and terms shown on the Platform at the time of Booking;</li><li>Compliance with all applicable tax laws, including collection and deposit of GST or other statutory levies on the stay;</li><li>Any injury, illness, loss, theft, damage to property, or death occurring on or about the property, howsoever caused;</li><li>Resolution of disputes with Customers regarding the quality, condition, or suitability of the property;</li><li>Compliance with all local police, municipal, and tourism department reporting and guest-registration requirements.</li></ul><p>The Vendor acknowledges and agrees that StayVriksha bears no responsibility or liability whatsoever for any of the matters listed in this Section 5, and that all such liability rests solely with the Vendor.</p>
policyTerms6Title=Bookings and Payments
policyTerms6Html=<p><strong>Booking Confirmation.</strong> A Booking is confirmed only upon issuance of a confirmation by the Platform after successful payment. The Vendor agrees to honour every confirmed Booking at the price and terms displayed at the time of Booking, subject to the Vendor’s stated policies.</p><p><strong>Payment Collection.</strong> StayVriksha collects the Booking Amount from the Customer on behalf of the Vendor through the Platform’s designated payment gateway, acting solely as a limited collection agent of the Vendor for this purpose. Receipt of payment by StayVriksha shall be deemed receipt on behalf of the Vendor.</p><p><strong>Settlement and Commission.</strong> StayVriksha shall deduct its agreed commission/service fee from the Booking Amount and remit the balance to the Vendor’s registered bank account within the timeline specified in the Vendor Agreement (typically within 30 days of check-in/service completion, subject to no valid dispute or chargeback being pending).</p><p><strong>Taxes.</strong> All applicable taxes (including GST) on the accommodation/service are the Vendor’s responsibility to account for and remit to the appropriate authorities, unless otherwise required of StayVriksha under Applicable Law as a marketplace facilitator.</p><p><strong>Payment Failures and Fraud.</strong> StayVriksha is not liable for any delay, failure, or reversal of payment caused by the Customer’s bank, payment gateway, network issues, or fraudulent activity by any third party.</p>
policyTerms7Title=Cancellation, Refund, and No-show Policy
policyTerms7Html=<p>Each Vendor shall set out its own cancellation, refund, rescheduling, and no-show policy for each Listing, which shall be displayed to the Customer prior to Booking. By completing a Booking, the Customer agrees to be bound by the specific Vendor’s policy for that Listing.</p><p>StayVriksha’s role in processing any refund is limited to facilitating the return of funds already collected, in accordance with the Vendor’s stated policy and subject to the Vendor authorising or being liable for the refund. StayVriksha is not obligated to refund any amount already settled to a Vendor except by recovering it from the Vendor.</p><p>StayVriksha shall not be liable for a Vendor’s refusal or failure to honour its own cancellation or refund policy; such failure is a matter solely between the Customer and the Vendor, without prejudice to StayVriksha’s right to take action against the Vendor under Section 17.</p>
policyTerms8Title=Vendor Indemnification
policyTerms8Html=<p>The Vendor agrees to indemnify, defend, and hold harmless StayVriksha, its directors, officers, employees, and affiliates from and against any and all claims, demands, losses, damages, liabilities, costs, and expenses (including reasonable legal fees) arising out of or relating to:</p><ul><li>Any inaccurate, misleading, or unauthorised Listing information;</li><li>The Vendor’s failure to hold or maintain any required licence, permit, or registration;</li><li>Any injury, loss, death, theft, or damage occurring at or in connection with the property;</li><li>The Vendor’s breach of these Terms, Applicable Law, or any third-party right;</li><li>Any dispute between the Vendor and a Customer.</li></ul>
policyTerms9Title=Customer Obligations
policyTerms9Html=<p>Customers agree to:</p><ul><li>Provide accurate identification and Booking information;</li><li>Comply with the house rules, check-in/check-out timings, and policies of the Vendor whose property they book;</li><li>Behave lawfully and respectfully towards Vendors, staff, and other guests;</li><li>Be liable for any damage they personally cause to a property, payable directly to the Vendor;</li><li>Not use the Platform for any unlawful, fraudulent, or unauthorised purpose (including circumventing the Platform to book directly with a Vendor to avoid fees).</li></ul><p>The Customer agrees to indemnify StayVriksha against any loss arising from the Customer’s breach of this Section or any misuse of the Platform.</p>
policyTerms10Title=Limitation of Liability
policyTerms10Html=<p>The Platform and all Listings are provided on an “as is” and “as available” basis. StayVriksha makes no warranty, express or implied, as to the accuracy, quality, safety, legality, or fitness of any Listing or Vendor.</p><p>To the fullest extent permitted by Applicable Law, StayVriksha shall not be liable for any direct, indirect, incidental, special, or consequential damages, including but not limited to personal injury, death, property damage, loss of stay, or loss arising from Vendor default, arising out of or in connection with any Booking or use of the Platform.</p><p>Where any liability of StayVriksha cannot be excluded under Applicable Law, such liability shall, in aggregate, be limited to the platform fee/commission actually retained by StayVriksha in respect of the specific Booking giving rise to the claim.</p>
policyTerms11Title=Reviews and Ratings
policyTerms11Html=<p>Customers may submit honest reviews of their stay. StayVriksha may moderate, remove, or decline to publish reviews that are unlawful, defamatory, fraudulent, or in violation of these Terms, but is not obligated to verify every review and is not liable for the content of user-submitted reviews.</p>
policyTerms12Title=Suspension and Termination
policyTerms12Html=<p>StayVriksha may suspend, restrict, or terminate a Vendor’s or Customer’s access to the Platform, with or without notice, for breach of these Terms, fraudulent activity, repeated Customer complaints, failure to maintain required licences, or any conduct that StayVriksha reasonably believes is harmful to the Platform, other Users, or StayVriksha’s reputation.</p><p>Any amounts owed to the Vendor may be withheld pending investigation of a complaint, chargeback, or suspected fraud.</p>
policyTerms13Title=Intellectual Property
policyTerms13Html=<p>The Platform, its design, logos, trademarks, and underlying software are the exclusive property of StayVriksha or its licensors. Vendors grant StayVriksha a non-exclusive, royalty-free licence to use, reproduce, and display Vendor Content on the Platform and in its marketing for the purpose of operating and promoting the Platform.</p>
policyTerms14Title=Data Privacy
policyTerms14Html=<p>Personal data collected from Vendors and Customers is processed in accordance with StayVriksha’s <a href='#Policies/privacy'>Privacy Policy</a> and Applicable Law, including the Digital Personal Data Protection Act, 2023. By using the Platform, you consent to such processing.</p>
policyTerms15Title=Force Majeure
policyTerms15Html=<p>StayVriksha shall not be liable for any failure or delay in performance caused by events beyond its reasonable control, including natural disasters, pandemics, government orders, internet or payment gateway outages, strikes, or civil unrest.</p>
policyTerms16Title=Governing Law and Dispute Resolution
policyTerms16Html=<p>These Terms shall be governed by and construed in accordance with the laws of India.</p><p>Any dispute arising out of or in connection with these Terms shall first be attempted to be resolved amicably through the Grievance Redressal mechanism in Section 17. Failing amicable resolution within 30 days, the dispute shall be referred to and finally resolved by arbitration under the Arbitration and Conciliation Act, 1996, seated in Kalaburagi, with proceedings conducted in English before a sole arbitrator appointed by StayVriksha.</p><p>Subject to the above, the courts at Kalaburagi, Karnataka shall have exclusive jurisdiction.</p>
policyTerms17Title=Grievance Redressal Officer
policyTerms17Html=<p>In accordance with the Information Technology Act, 2000 and the Consumer Protection (E-Commerce) Rules, 2020, the details of the Grievance Officer are as follows:</p><div class='contact-card'><h3>Grievance Officer</h3><p><strong>Name:</strong> Grievance Team<br><strong>Designation:</strong> Grievance Officer<br><strong>Email:</strong> <a href='mailto:admin@stayvriksha.in'>admin@stayvriksha.in</a><br><strong>Address:</strong> 111, Kalpavriksha Karekal Layout, Near Railway Bridge, Kalaburagi, Karnataka – 585102</p><p><strong>Response Timeline:</strong> Acknowledgement within 48 hours; resolution within 30 days of receipt of complaint.</p></div>
policyTerms18Title=Amendment
policyTerms18Html=<p>StayVriksha may modify these Terms at any time by posting the revised Terms on the Platform with an updated “Last updated” date. Continued use of the Platform after such changes constitutes acceptance of the revised Terms.</p>
policyTerms19Title=Severability and Entire Agreement
policyTerms19Html=<p>If any provision of these Terms is held invalid or unenforceable, the remaining provisions shall continue in full force and effect. These Terms, together with the Privacy Policy and any Vendor Agreement, constitute the entire agreement between the parties in relation to their subject matter.</p>
policyTerms20Title=Contact
policyTerms20Html=<p>For any questions regarding these Terms, please contact:</p><div class='contact-card'><h3>StayVriksha</h3><p>Email: <a href='mailto:admin@stayvriksha.in'>admin@stayvriksha.in</a></p><p>Address: 111, Kalpavriksha Karekal Layout, Near Railway Bridge, Kalaburagi, Karnataka – 585102</p></div>

# Policies - Privacy Policy
policyPrivacyTitle=Privacy Policy
policyPrivacySubtitle=How we collect, use, disclose, store, and protect personal information.
policyPrivacy1Title=Introduction
policyPrivacy1Html=<p>StayVriksha respects the privacy of customers, property vendors, and visitors to our website.</p><p>This Privacy Policy explains how we collect, use, disclose, store, and protect personal information when you visit our Platform, create an account, book accommodation, register a property, or contact us.</p>
policyPrivacy2Title=Information We May Collect
policyPrivacy2Html=<p>Depending on how you use the Platform, we may collect the following categories of information:</p><h3>A. Account and contact information</h3><ul><li>Name, email address, phone number, and account credentials.</li><li>Communication preferences and support correspondence.</li></ul><h3>B. Booking information</h3><ul><li>Property, room, and booking reference.</li><li>Check-in and check-out dates, number of guests, booking status, and cancellation records.</li><li>Special requests or information you choose to provide.</li></ul><h3>C. Payment information</h3><ul><li>Transaction reference, payment status, amount, and refund information.</li><li>Payments may be handled by third-party payment service providers. We should not collect or store full card credentials unless specifically authorised and compliant with applicable security requirements.</li></ul><h3>D. Vendor information</h3><ul><li>Business and property details.</li><li>Owner or authorised representative information.</li><li>Identity, address, ownership or operating authorisation documents, licences, tax information, and bank settlement details where required.</li></ul><h3>E. Technical information</h3><ul><li>IP address, browser or device information, log data, and website usage information, where collected.</li><li>Cookies and similar technologies, where used.</li></ul><p>We collect only information that is reasonably necessary for our stated purposes and applicable legal obligations.</p>
policyPrivacy3Title=How We Use Information
policyPrivacy3Html=<p>We may use personal information to:</p><ul><li>Create and manage customer and vendor accounts.</li><li>Search, reserve, confirm, and manage accommodation bookings.</li><li>Facilitate payment processing, refunds, and vendor settlements.</li><li>Communicate booking confirmations, cancellations, reminders, and service updates.</li><li>Verify vendor and property information.</li><li>Respond to complaints, support requests, and disputes.</li><li>Detect fraud, abuse, unauthorised access, and security threats.</li><li>Improve the Platform and understand service usage.</li><li>Meet legal, regulatory, accounting, and record-keeping obligations.</li><li>Send promotional communications where permitted by law and applicable preferences.</li></ul>
policyPrivacy4Title=How Information Is Shared
policyPrivacy4Html=<p>We may share relevant information with:</p><ul><li><strong>Property Vendors:</strong> Information needed to fulfil a booking, such as the guest's name, booking details, contact details, and necessary check-in information.</li><li><strong>Payment service providers:</strong> Information needed to process payments, refunds, and transaction verification.</li><li><strong>Technology and service providers:</strong> Hosting, website maintenance, customer support, communications, analytics, and security providers engaged by us.</li><li><strong>Professional advisers:</strong> Legal, accounting, audit, or compliance advisers where necessary.</li><li><strong>Government and regulatory authorities:</strong> Where disclosure is required by law or is otherwise lawfully permitted.</li><li><strong>Other parties:</strong> Where necessary to address fraud, protect rights and safety, or carry out a transaction with appropriate safeguards.</li></ul><p>We do not authorise service providers to use personal information for unrelated purposes beyond the applicable arrangements and law.</p>
policyPrivacy5Title=Cookies and Similar Technologies
policyPrivacy5Html=<p>Our website may use cookies or similar technologies to maintain sessions, remember preferences, support security, or understand website usage.</p><p>Where applicable, you may control cookies through your browser or the available website settings. Disabling certain cookies may affect some Platform functions.</p><p>Details of any analytics or advertising technologies used should be disclosed according to our actual implementation.</p>
policyPrivacy6Title=Data Retention
policyPrivacy6Html=<p>We retain personal information only for as long as reasonably necessary for the purposes described in this Policy, including providing services, resolving disputes, maintaining business records, preventing fraud, and complying with legal obligations.</p><p>Retention periods vary by data category and applicable requirements. Information that is no longer required should be securely deleted or anonymised where appropriate and legally permissible.</p>
policyPrivacy7Title=Data Security
policyPrivacy7Html=<p>We use reasonable technical and organisational safeguards appropriate to the information processed and the risks involved.</p><p>No method of online transmission or electronic storage can guarantee absolute security. If a personal-data breach occurs, we will respond and provide notifications as required by applicable law.</p>
policyPrivacy8Title=Your Privacy Rights and Requests
policyPrivacy8Html=<p>Subject to applicable law, you may have rights to request access to information, correction or updating of inaccurate information, deletion of eligible information, withdrawal of consent where processing relies on consent, and information about grievance or complaint procedures.</p><p>Requests may be submitted to <a href='mailto:admin@stayvriksha.in'>admin@stayvriksha.in</a>.</p><p>We may need to verify your identity before processing a request. Some information may need to be retained to meet legal obligations or resolve disputes.</p>
policyPrivacy9Title=Children and Accommodation Bookings
policyPrivacy9Html=<p>Our Platform is intended for people legally able to use the relevant services. A person making a booking must comply with the applicable age, identity, and occupancy requirements of the property and the law.</p><p>Where personal information of children is processed, StayVriksha will comply with applicable legal requirements. Vendors must not collect or use guest information for unrelated purposes.</p>
policyPrivacy10Title=Third-Party Services and Links
policyPrivacy10Html=<p>The Platform may contain links or integrations with third-party websites and payment providers. Their privacy practices are governed by their own policies.</p><p>Customers and Vendors should review the relevant third-party privacy information when using those services.</p>
policyPrivacy11Title=Changes to This Policy
policyPrivacy11Html=<p>We may update this Privacy Policy as our services, data practices, or legal obligations change. The revised version will be published with an updated date, and additional notice or consent will be provided where required.</p>
policyPrivacy12Title=Contact and Privacy Complaints
policyPrivacy12Html=<p>For privacy questions or requests, contact:</p><div class='contact-card'><h3>StayVriksha</h3><p><strong>Email:</strong> <a href='mailto:admin@stayvriksha.in'>admin@stayvriksha.in</a></p><p><strong>Address:</strong> 111, Kalpavriksha Karekal Layout, Near Railway Bridge, Kalaburagi, Karnataka – 585102</p></div>

# Policies - Cancellation & Refund
policyRefundTitle=Cancellation & Refund Policy
policyRefundSubtitle=How booking cancellations, refund requests, rescheduling, no-shows, and payment-related issues are handled.
policyRefund1Title=Purpose
policyRefund1Html=<p>This Policy explains how booking cancellations, refund requests, rescheduling, no-shows, and payment-related issues are handled on StayVriksha.</p><p>StayVriksha connects customers with accommodation providers. The cancellation and refund conditions may differ by property, room type, booking plan, and dates.</p>
policyRefund2Title=Property-Specific Cancellation Rules
policyRefund2Html=<p>Before making a booking, Customers should review the cancellation policy displayed on the relevant property or booking page.</p><p>A booking may be:</p><ul><li><strong>Free cancellation:</strong> Cancellation is permitted within the stated deadline without a cancellation charge, subject to the displayed conditions.</li><li><strong>Partially refundable:</strong> A specified portion of the amount may be refunded according to the displayed policy.</li><li><strong>Non-refundable:</strong> The booking amount may not be refundable for voluntary cancellation, except where the Vendor's policy or applicable law provides otherwise.</li></ul><p>These are policy categories, not a guarantee that every listing offers all three options. The actual conditions displayed for the booking will apply.</p>
policyRefund3Title=How to Cancel a Booking
policyRefund3Html=<p>Customers should use the cancellation option available in their account or contact StayVriksha support at <a href='mailto:admin@stayvriksha.in'>admin@stayvriksha.in</a>.</p><p>When submitting a request, provide:</p><ul><li>Booking reference number.</li><li>Registered phone number or email address.</li><li>Property name and stay dates.</li><li>Reason for cancellation, if requested.</li></ul><p>Customers should retain the cancellation confirmation for their records.</p><p>A cancellation request is subject to the applicable booking terms. Customers should not assume that a booking is cancelled until confirmation is provided.</p>
policyRefund4Title=Refund Eligibility
policyRefund4Html=<p>Refund eligibility depends on the property-specific cancellation policy, booking conditions, the timing of the cancellation, and applicable law.</p><p>Where a refund is approved, the refundable amount will be calculated according to the applicable policy, including any permitted cancellation charges or non-refundable components disclosed before booking.</p><p>A refund may also be considered where a Vendor cancels a confirmed booking, cannot provide the booked accommodation, or where another refund entitlement applies under the relevant policy or law.</p>
policyRefund5Title=Vendor-Initiated Cancellations
policyRefund5Html=<p>If a Vendor cancels a confirmed booking or cannot provide the booked accommodation, StayVriksha will assist the Customer with the available resolution process.</p><p>Depending on the circumstances and applicable terms, this may include a refund or an alternative arrangement accepted by the Customer.</p><p>Vendors must notify StayVriksha promptly of cancellations or material changes and cooperate in resolving affected bookings.</p>
policyRefund6Title=No-shows and Late Arrivals
policyRefund6Html=<p>A no-show occurs when a Customer does not arrive within the applicable check-in period and has not made an arrangement accepted by the Vendor.</p><p>No-show charges and refund eligibility will depend on the cancellation and no-show conditions disclosed for that booking.</p><p>Customers expecting to arrive late should contact the property in advance. A late arrival does not automatically extend the reservation or guarantee a refund.</p>
policyRefund7Title=Early Check-out and Shortened Stays
policyRefund7Html=<p>If a Customer checks out earlier than the booked departure date, any refund for unused nights will depend on the property-specific policy and applicable law.</p><p>Customers should contact the Vendor and StayVriksha support to request a review.</p>
policyRefund8Title=Refund Processing
policyRefund8Html=<p>Once a refund is approved, StayVriksha or the relevant payment service provider will initiate processing according to the applicable payment process.</p><p>The time taken for the funds to appear in the Customer's account may depend on the payment method, bank, card issuer, or payment provider.</p><p>Published processing timeline: [Insert your verified refund initiation timeline and any relevant exclusions.]</p><p>If a refund has not appeared within the stated period, Customers should contact <a href='mailto:admin@stayvriksha.in'>admin@stayvriksha.in</a> with their booking reference and transaction details.</p>
policyRefund9Title=Failed, Duplicate, or Pending Payments
policyRefund9Html=<p>If money is debited but the booking is not confirmed, or if a duplicate payment appears to have been made, Customers should contact support and provide the transaction reference.</p><p>StayVriksha will review the transaction with the relevant payment provider and communicate the resolution.</p><p>A pending payment is not necessarily a completed booking. Customers should avoid making another payment until they have checked the booking status, where practicable.</p>
policyRefund10Title=Refund Method
policyRefund10Html=<p>Approved refunds will ordinarily be processed to the original payment method where supported by the payment provider and permitted by law.</p><p>If that method is unavailable, any alternative refund arrangement will be handled according to the payment provider's requirements and applicable law.</p>
policyRefund11Title=Disputes and Escalations
policyRefund11Html=<p>If a Customer disagrees with a cancellation charge or refund decision, they may contact <a href='mailto:admin@stayvriksha.in'>admin@stayvriksha.in</a> with the booking reference and supporting information.</p><p>StayVriksha will review the request, consult the Vendor or payment provider where necessary, and communicate the outcome within the applicable timeline.</p><p>Nothing in this Policy limits rights or remedies available under applicable law.</p>
policyRefund12Title=Contact Us
policyRefund12Html=<p>For cancellation or refund assistance:</p><div class='contact-card'><h3>StayVriksha Support</h3><p><strong>Email:</strong> <a href='mailto:admin@stayvriksha.in'>admin@stayvriksha.in</a></p><p><strong>Address:</strong> 111, Kalpavriksha Karekal Layout, Near Railway Bridge, Kalaburagi, Karnataka – 585102</p></div>

# Policies - Vendor Agreement
policyVendorTitle=Vendor Agreement
policyVendorSubtitle=The agreement governing the participation of property owners, managers, and authorised accommodation operators on the Platform.
policyVendorKp1=This Vendor Agreement governs the participation of property owners, managers, and authorised accommodation operators (“Vendor”) on the StayVriksha Platform.
policyVendorKp2=By registering a property or accepting the applicable Vendor terms electronically, the Vendor agrees to comply with this Agreement, the StayVriksha Terms & Conditions, and applicable laws.
policyVendor1Title=Eligibility and Registration
policyVendor1Html=<p>Vendors may apply to list eligible hotels, hostels, PG accommodation, serviced apartments, and rental properties.</p><p>During registration, StayVriksha may request:</p><ul><li>Government-issued identity and address documents for the owner or authorised representative.</li><li>Proof of ownership, lease, management authority, or permission to operate and list the property.</li><li>Applicable licences, registrations, permits, and safety approvals.</li><li>Business, PAN, GST, and bank account details where required.</li><li>Accurate property information, room details, photographs, amenities, and pricing.</li></ul><p>Registration and document submission do not automatically guarantee approval. StayVriksha may request additional information or decline a listing for legitimate operational, verification, safety, or compliance reasons.</p>
policyVendor2Title=Listing Accuracy
policyVendor2Html=<p>The Vendor must ensure that every listing is accurate, complete, current, and not misleading.</p><p>The Vendor is responsible for maintaining correct information about:</p><ul><li>Property name, location, and contact details.</li><li>Room types, bed configurations, occupancy limits, and availability.</li><li>Amenities, facilities, accessibility features, and property photographs.</li><li>Rates, taxes, mandatory charges, deposits, and other applicable fees.</li><li>Check-in/check-out times, identification requirements, and house rules.</li><li>Cancellation, refund, rescheduling, and no-show conditions.</li></ul><p>Material changes must be updated promptly. Vendors must not advertise facilities, availability, or prices they cannot honour.</p>
policyVendor3Title=Legal Compliance and Property Standards
policyVendor3Html=<p>The Vendor is responsible for obtaining and maintaining all approvals and registrations applicable to the property and its operations.</p><p>This may include relevant local lodging, trade, municipal, police, fire-safety, tourism, and tax requirements, depending on the property and jurisdiction.</p><p>The Vendor must maintain appropriate cleanliness, security, fire safety, structural safety, and lawful operating conditions.</p><p>StayVriksha's review of documents or a listing does not replace inspections, certifications, or obligations imposed by law.</p>
policyVendor4Title=Bookings and Guest Service
policyVendor4Html=<p>The Vendor must:</p><ul><li>Honour confirmed bookings in accordance with the advertised terms.</li><li>Provide the booked accommodation, room category, and disclosed facilities.</li><li>Maintain accurate availability and avoid accepting incompatible reservations.</li><li>Communicate check-in instructions and material changes in a timely manner.</li><li>Treat guests fairly and respectfully.</li><li>Handle complaints promptly and cooperate with StayVriksha when an issue is escalated.</li><li>Notify StayVriksha immediately if a confirmed booking cannot be fulfilled.</li></ul><p>The Vendor must not impose undisclosed mandatory charges or materially change the agreed booking terms without an appropriate lawful basis and the Customer's required agreement.</p>
policyVendor5Title=Pricing, Commission and Payments
policyVendor5Html=<p>The Vendor agrees that the applicable commission, platform service fee, taxes, settlement schedule, and payment conditions will be set out in the commercial terms accepted by the Vendor.</p><ul><li><strong>Commission rate:</strong> [Insert agreed rate or reference to the accepted commercial schedule.]</li><li><strong>Settlement timeline:</strong> [Insert agreed timeline and any applicable conditions.]</li><li><strong>Settlement method:</strong> [Insert the supported settlement method.]</li></ul><p>StayVriksha may deduct agreed fees and other properly chargeable amounts from booking proceeds as authorised by the applicable agreement and law.</p><p>Settlements may be subject to payment-provider processing, refunds, chargebacks, fraud reviews, unresolved booking disputes, and applicable legal requirements. Any withholding must be handled according to the agreed terms and applicable law.</p><p>Vendors are responsible for their applicable tax reporting and payment obligations, except where a legal obligation is imposed on StayVriksha or another party.</p>
policyVendor6Title=Cancellations, Refunds and No-shows
policyVendor6Html=<p>Vendors must configure clear and accurate cancellation, refund, rescheduling, and no-show conditions for each applicable listing.</p><p>These terms must be made available to Customers before booking confirmation.</p><p>Vendors must comply with the accepted policy and applicable law, promptly inform StayVriksha of cancellation requests, and cooperate with refund processing.</p><p>If a Vendor cancels a confirmed booking or cannot accommodate a guest, the Vendor must notify StayVriksha and cooperate in arranging an appropriate resolution.</p>
policyVendor7Title=Customer Information and Privacy
policyVendor7Html=<p>Vendors may use customer information only for legitimate purposes connected with the booking, guest communication, check-in, security, legal compliance, and related service delivery.</p><p>Vendors must:</p><ul><li>Protect customer information against unauthorised access or disclosure.</li><li>Restrict access to authorised personnel.</li><li>Avoid using guest information for unrelated marketing without a lawful basis.</li><li>Retain information only as permitted or required by law.</li><li>Notify StayVriksha promptly of a suspected data breach involving information received through the Platform, and comply with applicable notification requirements.</li></ul><p>Vendors must comply with applicable privacy and data protection obligations.</p>
policyVendor8Title=Property Content and Intellectual Property
policyVendor8Html=<p>The Vendor confirms that it has the necessary rights and permissions to upload and authorise the use of property photographs, descriptions, logos, and other listing content.</p><p>The Vendor grants StayVriksha a non-exclusive, royalty-free licence to display, reproduce, and use authorised listing content to operate, promote, and market the relevant listing and Platform during the applicable relationship.</p><p>This licence does not transfer ownership of the Vendor's intellectual property.</p><p>The Vendor must promptly notify StayVriksha of any intellectual property complaint concerning its listing.</p>
policyVendor9Title=Complaints, Safety and Investigations
policyVendor9Html=<p>The Vendor is responsible for addressing property-related service issues and complying with applicable safety requirements.</p><p>The Vendor must cooperate with reasonable investigations involving alleged misrepresentation, booking failures, customer complaints, fraud, or safety concerns.</p><p>StayVriksha may request supporting evidence, restrict a listing, pause new bookings, or take other proportionate action where reasonably necessary, subject to applicable law and contractual obligations.</p>
policyVendor10Title=Suspension and Termination
policyVendor10Html=<p>Either party may terminate the commercial relationship in accordance with the applicable agreement.</p><p>StayVriksha may suspend or remove a listing where there are legitimate concerns involving material contractual breaches, inaccurate information, suspected fraud, legal non-compliance, safety risks, or repeated unresolved complaints.</p><p>Where appropriate, the Vendor will be notified and given an opportunity to respond or remedy the issue.</p><p>Termination does not automatically cancel existing bookings or remove payment, refund, record-keeping, or other obligations that survive termination.</p>
policyVendor11Title=Indemnification and Liability
policyVendor11Html=<p>Each party is responsible for its own acts, omissions, and contractual and legal obligations.</p><p>To the extent permitted by law, the Vendor will be responsible for losses, claims, or expenses arising from the Vendor's breach of this Agreement, unlawful operation, misleading listing information, infringement of third-party rights, or negligent or wrongful conduct.</p><p>Any indemnification obligation is subject to applicable law and does not exclude liability that cannot legally be excluded.</p>
policyVendor12Title=Dispute Resolution
policyVendor12Html=<p>The parties should first attempt to resolve disputes through good-faith discussion and the StayVriksha grievance process.</p><p>Any arbitration or court proceedings will be subject to applicable law and any valid dispute-resolution agreement.</p>
policyVendor13Title=Changes to the Agreement
policyVendor13Html=<p>Changes to material commercial terms, including commission and settlement arrangements, will be communicated and accepted in the manner required by the applicable agreement and law.</p><p>Updated Platform policies may apply as permitted by the agreement and applicable law.</p>
policyVendor14Title=Vendor Acceptance
policyVendor14Html=<p>Before submitting a property for publication, the Vendor should confirm that they:</p><ul><li>Have authority to list and operate the property.</li><li>Have provided accurate information and supporting documents.</li><li>Have reviewed the applicable commercial terms.</li><li>Understand the booking, cancellation, refund, privacy, and settlement obligations.</li><li>Agree to comply with this Vendor Agreement and applicable law.</li></ul><div class='contact-card'><h3>Acceptance</h3><p><strong>Vendor / Business Name:</strong> [Vendor name]<br><strong>Authorised Representative:</strong> [Name]<br><strong>Property Name(s):</strong> [Property name(s)]<br><strong>Date of Acceptance:</strong> [Date]<br><strong>Electronic Acceptance / Signature:</strong> [Configured acceptance method]</p></div>
policyVendor15Title=Contact
policyVendor15Html=<p>For vendor questions or assistance, contact:</p><div class='contact-card'><h3>StayVriksha Vendor Support</h3><p><strong>Email:</strong> <a href='mailto:admin@stayvriksha.in'>admin@stayvriksha.in</a></p><p><strong>Address:</strong> 111, Kalpavriksha Karekal Layout, Near Railway Bridge, Kalaburagi, Karnataka – 585102</p></div>


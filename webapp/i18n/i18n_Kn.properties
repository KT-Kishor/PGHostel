# --- Card 1: Manage Vendors ---
topic_manageVendors_title=ವೆಂಡರ್ ನಿರ್ವಹಣೆ
topic_manageVendors_desc=ವೆಂಡರ್‌ಗಳು "ವೆಂಡರ್ ನೋಂದಣಿ" ಬಟನ್ ಮೂಲಕ ನೋಂದಾಯಿಸಿಕೊಳ್ಳಬಹುದು ಮತ್ತು ಅಗತ್ಯವಿರುವ ಕಂಪನಿ ಹಾಗೂ ಸಂಪರ್ಕ ವಿವರಗಳನ್ನು ಸಲ್ಲಿಸಬಹುದು. ಸೂಪರ್ ಅಡ್ಮಿನ್ ಸಿಸ್ಟಮ್ ಮೂಲಕ ಸಲ್ಲಿಕೆಯಾದ ಸಂಪೂರ್ಣ ವೆಂಡರ್ ಮಾಹಿತಿಯನ್ನು ಪರಿಶೀಲಿಸಬಹುದು. ಸೂಪರ್ ಅಡ್ಮಿನ್ ಒದಗಿಸಿದ ವಿವರಗಳು ಮತ್ತು ಪರಿಶೀಲನೆ ಆಧಾರದ ಮೇಲೆ ವೆಂಡರ್‌ಗಳನ್ನು ಅನುಮೋದಿಸಬಹುದು ಅಥವಾ ತಿರಸ್ಕರಿಸಬಹುದು. ವೆಂಡರ್‌ಗಳು ದಾಖಲೆಗಳನ್ನು ಅಪ್‌ಲೋಡ್ ಮಾಡಬಹುದು ಮತ್ತು ಸೂಪರ್ ಅಡ್ಮಿನ್ ಅವುಗಳನ್ನು ನಿರ್ವಹಿಸಬಹುದು.

# --- Card 2: Branch Management ---
topic_branchManagement_title=ಶಾಖೆ ನಿರ್ವಹಣೆ
topic_branchManagement_desc=ಅಡ್ಮಿನ್ ಹಾಸ್ಟೆಲ್‌ಗಳು, PG ಗಳು ಮತ್ತು ಹೋಟೆಲ್‌ಗಳಂತಹ ವಿವಿಧ ಶಾಖೆ ಪ್ರಕಾರಗಳನ್ನು ರಚಿಸುವ ಮೂಲಕ ಬಹು ಶಾಖೆಗಳನ್ನು ನಿರ್ವಹಿಸಬಹುದು. ಶಾಖೆಯನ್ನು ರಚಿಸುವಾಗ ಅಡ್ಮಿನ್ ಜಿಎಸ್‌ಟಿ ವಿವರಗಳನ್ನು ನಮೂದಿಸಬಹುದು. ಜಿಎಸ್‌ಟಿ ಅನ್ವಯವಾಗುತ್ತದೆಯೇ ಎಂಬುದನ್ನು ನಿರ್ದಿಷ್ಟಪಡಿಸುವ ಆಯ್ಕೆಯನ್ನು ಸಿಸ್ಟಮ್ ಒದಗಿಸುತ್ತದೆ. ಅಡ್ಮಿನ್ ಸಂಪೂರ್ಣ ಶಾಖೆಯ ಡೇಟಾವನ್ನು Excel ಫಾರ್ಮ್ಯಾಟ್‌ ನಲ್ಲಿ ಡೌನ್‌ಲೋಡ್ ಮಾಡಬಹುದು ಮತ್ತು ಅಗತ್ಯವಿದ್ದಾಗ ನವೀಕರಿಸಬಹುದು.

# --- Card 3: Bed Management ---
topic_bedManagement_title=ಬೆಡ್ ನಿರ್ವಹಣೆ
topic_bedManagement_desc=ಅಡ್ಮಿನ್ ಸಿಂಗಲ್ ಬೆಡ್, ಡಬಲ್ ಬೆಡ್ ಮತ್ತು ಕಸ್ಟಮೈಸ್ ಮಾಡಿದ ಬೆಡ್ ಕಾನ್ಫಿಗರೇಶನ್‌ಗಳಂತಹ ಬೆಡ್ ಪ್ರಕಾರಗಳನ್ನು ರಚಿಸಬಹುದು ಮತ್ತು ನಿರ್ವಹಿಸಬಹುದು. ಬೆಡ್ ಪ್ರಕಾರವನ್ನು ರಚಿಸುವಾಗ ಅಡ್ಮಿನ್ ಅಗತ್ಯ ವಿವರಗಳನ್ನು ನೀಡಬಹುದು ಮತ್ತು ಚಿತ್ರಗಳನ್ನು ಅಪ್‌ಲೋಡ್ ಮಾಡಬಹುದು. ಪ್ರತಿ ಬೆಡ್ ಪ್ರಕಾರಕ್ಕೆ ಲಭ್ಯವಿರುವ ಕೊಠಡಿಗಳ ಸಂಖ್ಯೆ ಮತ್ತು ಪ್ರತಿ ಕೊಠಡಿಗೆ ಗರಿಷ್ಠ ನಿವಾಸಿಗಳ ಸಂಖ್ಯೆಯನ್ನು ವ್ಯಾಖ್ಯಾನಿಸಬಹುದು.

# --- Card 4: Room Management ---
topic_roomManagement_title=ಕೊಠಡಿ ನಿರ್ವಹಣೆ
topic_roomManagement_desc=ಅಡ್ಮಿನ್ ಕೊಠಡಿ ಸಂಖ್ಯೆಗಳನ್ನು ನಿಯೋಜಿಸುವ ಮೂಲಕ ಮತ್ತು ಪ್ರತಿ ಆಸ್ತಿಗೆ ಅಗತ್ಯವಿರುವ ಕೊಠಡಿಗಳ ಸಂಖ್ಯೆಯನ್ನು ವ್ಯಾಖ್ಯಾನಿಸುವ ಮೂಲಕ ಕೊಠಡಿಗಳನ್ನು ರಚಿಸಬಹುದು ಮತ್ತು ನಿರ್ವಹಿಸಬಹುದು. ಅಡ್ಮಿನ್ ಆಯ್ಕೆಮಾಡಿದ ಕೊಠಡಿ ಅಥವಾ ಕೊಠಡಿ ಪ್ರಕಾರದ ಆಧಾರದ ಮೇಲೆ ಬೆಲೆಗಳನ್ನು ಹೊಂದಿಸಬಹುದು ಮತ್ತು ನಿರ್ವಹಿಸಬಹುದು. ಕೊಠಡಿ ವಿವರಗಳು, ಲಭ್ಯತೆ ಮತ್ತು ಬೆಲೆಯನ್ನು ಯಾವುದೇ ಸಮಯದಲ್ಲಿ ನವೀಕರಿಸಬಹುದು.

# --- Card 5: Facility Management ---
topic_facilityManagement_title=ಸೌಲಭ್ಯ ನಿರ್ವಹಣೆ
topic_facilityManagement_desc=ಅಡ್ಮಿನ್ ವಿವಿಧ ಸೌಲಭ್ಯಗಳನ್ನು ರಚಿಸಬಹುದು ಮತ್ತು ನಿರ್ವಹಿಸಬಹುದು ಹಾಗೂ ಪ್ರತಿ ಸೌಲಭ್ಯಕ್ಕೆ ಅನ್ವಯವಾಗುವ ಬೆಲೆಯನ್ನು ವ್ಯಾಖ್ಯಾನಿಸಬಹುದು. ಲಭ್ಯವಿರುವ ಸೇವೆಗಳ ಅವಲೋಕನವನ್ನು ಒದಗಿಸಲು ಅಡ್ಮಿನ್ ಸೌಲಭ್ಯದ ಚಿತ್ರಗಳು ಮತ್ತು ಸಂಬಂಧಿತ ವಿವರಗಳನ್ನು ಸೇರಿಸಬಹುದು. ದೈನಂದಿನ, ಮಾಸಿಕ ಅಥವಾ ವಾರ್ಷಿಕ ದರಗಳಂತಹ ವಿಭಿನ್ನ ಅವಧಿಗಳ ಆಧಾರದ ಮೇಲೆ ಬೆಲೆಯನ್ನು ಕಾನ್ಫಿಗರ್ ಮಾಡಬಹುದು.

# --- Card 6: Amenities Management ---
topic_amenitiesManagement_title=ಸೌಕರ್ಯಗಳ ನಿರ್ವಹಣೆ
topic_amenitiesManagement_desc=ಅಡ್ಮಿನ್ ಪ್ರತಿ ಆಸ್ತಿಯಲ್ಲಿ ಲಭ್ಯವಿರುವ ವಿವಿಧ ಸೌಕರ್ಯಗಳನ್ನು ರಚಿಸಬಹುದು ಮತ್ತು ನಿರ್ವಹಿಸಬಹುದು. ಅಡ್ಮಿನ್ ಸಂಬಂಧಿತ ಚಿತ್ರಗಳನ್ನು ಸೇರಿಸಬಹುದು ಮತ್ತು ವಿವರವಾದ ಮಾಹಿತಿಯನ್ನು ಒದಗಿಸಬಹುದು. ನಿರ್ದಿಷ್ಟ ಆಸ್ತಿಯಲ್ಲಿ ಲಭ್ಯವಿರುವ ಸೌಕರ್ಯಗಳ ಸಂಖ್ಯೆಯನ್ನು ನಿರ್ದಿಷ್ಟಪಡಿಸಲು ಸಿಸ್ಟಮ್ ಅನುಮತಿಸುತ್ತದೆ ಮತ್ತು ಡೇಟಾವನ್ನು Excel ಫಾರ್ಮ್ಯಾಟ್‌ನಲ್ಲಿ ಡೌನ್‌ಲೋಡ್ ಮಾಡಬಹುದು.

# --- Card 7: Coupon Management ---
topic_couponManagement_title=ಕೂಪನ್ ನಿರ್ವಹಣೆ

policyVendor15Html=<p>ವ್ಯಾಪಾರಿ ಪ್ರಶ್ನೆಗಳು ಅಥವಾ ಸಹಾಯಕ್ಕಾಗಿ ಸಂಪರ್ಕಿಸಿ:</p><div class='contact-card'><h3>ಸ್ಟೇವೃಕ್ಷ ವ್ಯಾಪಾರಿ ಬೆಂಬಲ</h3><p><strong>ಇಮೇಲ್:</strong> <a href='mailto:admin@stayvriksha.in'>admin@stayvriksha.in</a></p><p><strong>ವಿಳಾಸ:</strong> 111, ಕಲ್ಪವೃಕ್ಷ ಕರೇಕಲ್ ಲೇಔಟ್, ರೈಲ್ವೇ ಸೇತುವೆ ಹತ್ತಿರ, ಕಲಬುರಗಿ, ಕರ್ನಾಟಕ – 585102</p></div>


policyTermsKp1=ಸ್ಟೇವೃಕ್ಷ ಒಂದು ಮಧ್ಯವರ್ತಿ ಮಾರುಕಟ್ಟೆ ವೇದಿಕೆ; ವಸತಿ ಒಪ್ಪಂದವು ಗ್ರಾಹಕ ಮತ್ತು ವ್ಯಾಪಾರಿಯ ನಡುವೆ ಇರುತ್ತದೆ.
policyTermsKp2=ಯಶಸ್ವಿ ಪಾವತಿಯ ನಂತರ ವೇದಿಕೆ ದೃಢೀಕರಣ ನೀಡಿದಾಗ ಮಾತ್ರ ಬುಕಿಂಗ್ ದೃಢೀಕೃತವಾಗುತ್ತದೆ.
policyTermsKp3=ಪ್ರತಿ ವ್ಯಾಪಾರಿಯು ಪ್ರತಿ ಲಿಸ್ಟಿಂಗ್‌ಗೂ ತನ್ನದೇ ಆದ ರದ್ದತಿ, ಮರುಪಾವತಿ, ಮರುನಿಗದಿ ಮತ್ತು ನೋ-ಶೋ ನೀತಿಯನ್ನು ನಿಗದಿಪಡಿಸುತ್ತಾನೆ.
policyTerms1Title=ಪರಿಚಯ ಮತ್ತು ಸ್ವೀಕಾರ
policyTerms1Html=<p>ಈ ನಿಯಮಗಳು ಮತ್ತು ಷರತ್ತುಗಳು (“ಷರತ್ತುಗಳು”) ಸ್ಟೇವೃಕ್ಷ (“ಸ್ಟೇವೃಕ್ಷ”, “ನಾವು”, “ನಮಗೆ”, ಅಥವಾ “ನಮ್ಮ”) ನಿರ್ವಹಿಸುವ ವೆಬ್‌ಸೈಟ್, ಮೊಬೈಲ್ ಅಪ್ಲಿಕೇಶನ್ ಮತ್ತು ಸಂಬಂಧಿತ ಸೇವೆಗಳಿಗೆ (ಒಟ್ಟಾಗಿ “ವೇದಿಕೆ”) ಪ್ರವೇಶ ಮತ್ತು ಬಳಕೆಯನ್ನು ನಿಯಂತ್ರಿಸುತ್ತವೆ. ಸ್ಟೇವೃಕ್ಷ ಭಾರತದ ಕಾನೂನುಗಳ ಅಡಿಯಲ್ಲಿ ಸಂಘಟಿತವಾದ ಕಂಪನಿ/ಒಡೆತನವಾಗಿದ್ದು, ಅದರ ನೋಂದಾಯಿತ ಕಚೇರಿ 111, ಕಲ್ಪವೃಕ್ಷ ಕರೇಕಲ್ ಲೇಔಟ್, ರೈಲ್ವೇ ಸೇತುವೆ ಹತ್ತಿರ, ಕಲಬುರಗಿ, ಕರ್ನಾಟಕ – 585102 ನಲ್ಲಿದೆ.</p><p>ಈ ವೇದಿಕೆ (a) ಹೋಟೆಲ್‌ಗಳು, ಪೇಯಿಂಗ್-ಗೆಸ್ಟ್ (PG) ವಸತಿಗಳು, ಹಾಸ್ಟೆಲ್‌ಗಳು, ಸರ್ವಿಸ್ ಅಪಾರ್ಟ್‌ಮೆಂಟ್‌ಗಳು ಮತ್ತು ಬಾಡಿಗೆ ಆಸ್ತಿಗಳ ಮಾಲೀಕರು, ವ್ಯವಸ್ಥಾಪಕರು ಅಥವಾ ನಿರ್ವಾಹಕರು (“ವ್ಯಾಪಾರಿಗಳು”) ತಮ್ಮ ಆಸ್ತಿಗಳನ್ನು ಬುಕಿಂಗ್‌ಗಾಗಿ ಪಟ್ಟಿ ಮಾಡಲು ಹಾಗೂ (b) ಸಾರ್ವಜನಿಕರು (“ಗ್ರಾಹಕರು”, “ಬಳಕೆದಾರರು”, ಅಥವಾ “ನೀವು”) ಅಂತಹ ಆಸ್ತಿಗಳಲ್ಲಿ ಉಳಿಯಲು ಹುಡುಕಲು, ಬುಕ್ ಮಾಡಲು ಮತ್ತು ಪಾವತಿಸಲು ಅನುವು ಮಾಡಿಕೊಡುತ್ತದೆ.</p><p>ವ್ಯಾಪಾರಿಯಾಗಿ ನೋಂದಣಿ ಮಾಡುವುದು, ಗ್ರಾಹಕ ಖಾತೆ ರಚಿಸುವುದು, ವೇದಿಕೆಯನ್ನು ಬ್ರೌಸ್ ಮಾಡುವುದು ಅಥವಾ ಬುಕಿಂಗ್ ಮಾಡುವುದರ ಮೂಲಕ, ನೀವು ಈ ಷರತ್ತುಗಳು, ನಮ್ಮ ಗೋಪ್ಯತಾ ನೀತಿ ಮತ್ತು ಇಲ್ಲಿ ಉಲ್ಲೇಖಿಸಲಾದ ಯಾವುದೇ ಹೆಚ್ಚುವರಿ ನೀತಿಗಳಿಗೆ ಬದ್ಧರಾಗಿರಲು ಒಪ್ಪುತ್ತೀರಿ. ನೀವು ಒಪ್ಪದಿದ್ದರೆ, ವೇದಿಕೆಯನ್ನು ಬಳಸಬಾರದು.</p>
policyTerms2Title=ವ್ಯಾಖ್ಯಾನಗಳು
policyTerms2Html=<dl class='def'><dt>ಲಿಸ್ಟಿಂಗ್</dt><dd>ವೇದಿಕೆಯಲ್ಲಿ ವ್ಯಾಪಾರಿಯಿಂದ ಜಾಹೀರಾತು ಮಾಡಲಾದ ಯಾವುದೇ ಆಸ್ತಿ, ಕೊಠಡಿ, ಹಾಸಿಗೆ ಅಥವಾ ಘಟಕ.</dd><dt>ಬುಕಿಂಗ್</dt><dd>ವೇದಿಕೆಯ ಮೂಲಕ ಗ್ರಾಹಕನು ಲಿಸ್ಟಿಂಗ್‌ಗಾಗಿ ಮಾಡಿದ ದೃಢೀಕೃತ ಕಾಯ್ದಿರಿಸುವಿಕೆ.</dd><dt>ವ್ಯಾಪಾರಿ ವಿಷಯ</dt><dd>ವ್ಯಾಪಾರಿಯು ಅಪ್‌ಲೋಡ್ ಮಾಡುವ ಅಥವಾ ಒದಗಿಸುವ ಎಲ್ಲಾ ಛಾಯಾಚಿತ್ರಗಳು, ವಿವರಣೆಗಳು, ಬೆಲೆ, ಲಭ್ಯತೆ, ನೀತಿಗಳು ಮತ್ತು ಇತರ ಮಾಹಿತಿ.</dd><dt>ಬುಕಿಂಗ್ ಮೊತ್ತ</dt><dd>ಬುಕಿಂಗ್‌ಗಾಗಿ ಗ್ರಾಹಕನು ಪಾವತಿಸಬೇಕಾದ ಒಟ್ಟು ಮೊತ್ತ, ಅನ್ವಯವಾಗುವ ತೆರಿಗೆಗಳು ಮತ್ತು ವೇದಿಕೆ ಶುಲ್ಕಗಳು ಸೇರಿದಂತೆ.</dd><dt>ಅನ್ವಯವಾಗುವ ಕಾನೂನು</dt><dd>ಭಾರತ ಗಣರಾಜ್ಯದ ಕಾನೂನುಗಳು, ಅವುಗಳಲ್ಲಿ ಮಾಹಿತಿ ತಂತ್ರಜ್ಞಾನ ಕಾಯ್ದೆ, 2000 (Information Technology Act, 2000), ಗ್ರಾಹಕ ಸಂರಕ್ಷಣಾ ಕಾಯ್ದೆ, 2019 (Consumer Protection Act, 2019) ಮತ್ತು ಅದರ ಅಡಿಯಲ್ಲಿ ರಚಿಸಲಾದ ನಿಯಮಗಳು ಹಾಗೂ ಅನ್ವಯವಾಗುವ ರಾಜ್ಯದ ಅಂಗಡಿ ಮತ್ತು ಸಂಸ್ಥೆಗಳು, ಪ್ರವಾಸೋದ್ಯಮ ಮತ್ತು ಪೌರಾಡಳಿತ ನಿಯಮಗಳು ಸೇರಿವೆ, ಆದರೆ ಇಷ್ಟಕ್ಕೆ ಸೀಮಿತವಲ್ಲ.</dd></dl>
policyTerms3Title=ಸ್ಟೇವೃಕ್ಷ ಪಾತ್ರ — ಕೇವಲ ಮಧ್ಯವರ್ತಿ ವೇದಿಕೆ
policyTerms3Html=<p>ಸ್ಟೇವೃಕ್ಷ ಗ್ರಾಹಕರನ್ನು ವ್ಯಾಪಾರಿಗಳೊಂದಿಗೆ ಜೋಡಿಸುವ ಆನ್‌ಲೈನ್ ಮಾರುಕಟ್ಟೆ ಮತ್ತು ಮಧ್ಯವರ್ತಿಯಾಗಿದೆ. ವೇದಿಕೆಯಲ್ಲಿ ಪಟ್ಟಿ ಮಾಡಲಾದ ಯಾವುದೇ ಹೋಟೆಲ್, PG, ಹಾಸ್ಟೆಲ್, ಸರ್ವಿಸ್ ಅಪಾರ್ಟ್‌ಮೆಂಟ್ ಅಥವಾ ಬಾಡಿಗೆ ಆಸ್ತಿಯನ್ನು ಸ್ಟೇವೃಕ್ಷ ಹೊಂದಿಲ್ಲ, ನಿರ್ವಹಿಸುವುದಿಲ್ಲ ಅಥವಾ ನಿಯಂತ್ರಿಸುವುದಿಲ್ಲ ಮತ್ತು ಬುಕಿಂಗ್ ದೃಢೀಕರಣದ ನಂತರ ವ್ಯಾಪಾರಿ ಮತ್ತು ಗ್ರಾಹಕನ ನಡುವೆ ರೂಪುಗೊಳ್ಳುವ ವಸತಿ ಅಥವಾ ಆತಿಥ್ಯ ಒಪ್ಪಂದದ ಪಕ್ಷವಲ್ಲ.</p><p>ಸ್ಟೇವೃಕ್ಷ ಮಾಹಿತಿ ತಂತ್ರಜ್ಞಾನ ಕಾಯ್ದೆ, 2000 ರ ಕಲಂ 2(1)(w) ದ ಅರ್ಥದಲ್ಲಿ “ಮಧ್ಯವರ್ತಿ”ಯಾಗಿ ಕಾರ್ಯನಿರ್ವಹಿಸುತ್ತದೆ ಮತ್ತು ಕಾನೂನಿನಿಂದ ಅನುಮತಿಸಲಾದ ಗರಿಷ್ಠ ಮಟ್ಟಿಗೆ ವ್ಯಾಪಾರಿ ವಿಷಯ ಹಾಗೂ ಯಾವುದೇ ಲಿಸ್ಟಿಂಗ್‌ನ ನಿರ್ವಹಣೆ, ಸುರಕ್ಷತೆ, ಕಾನೂನುಬದ್ಧತೆ ಮತ್ತು ಗುಣಮಟ್ಟಕ್ಕೆ ಸಂಬಂಧಿಸಿದ ಎಲ್ಲಾ ಹೊಣೆಗಾರಿಕೆಯನ್ನು ನಿರಾಕರಿಸುತ್ತದೆ.</p><p>ವೇದಿಕೆಯಲ್ಲಿನ ಯಾವುದೂ ಯಾವುದೇ ವ್ಯಾಪಾರಿ, ಲಿಸ್ಟಿಂಗ್ ಅಥವಾ ಆಸ್ತಿಗೆ ಸ್ಟೇವೃಕ್ಷ ನೀಡುವ ಸಮರ್ಥನೆ, ಖಾತರಿ ಅಥವಾ ಗ್ಯಾರಂಟಿ ಅಲ್ಲ.</p>
policyTerms4Title=ವ್ಯಾಪಾರಿ ನೋಂದಣಿ ಮತ್ತು ಅರ್ಹತೆ
policyTerms4Html=<p>ಆಸ್ತಿಯನ್ನು ಪಟ್ಟಿ ಮಾಡಲು, ವ್ಯಾಪಾರಿಯು ನೋಂದಣಿ ಪೂರ್ಣಗೊಳಿಸಬೇಕು ಮತ್ತು ನಿಖರ, ಇತ್ತೀಚಿನ ಹಾಗೂ ಪೂರ್ಣ ಮಾಹಿತಿಯನ್ನು ಒದಗಿಸಬೇಕು, ಅವುಗಳಲ್ಲಿ ಸೇರಿವೆ:</p><ul><li>ಮಾಲೀಕರು/ಅಧಿಕೃತ ಸಹಿದಾರರ ಸರ್ಕಾರದಿಂದ ನೀಡಲಾದ ಮಾನ್ಯ ಗುರುತು ಮತ್ತು ವಿಳಾಸದ ಪುರಾವೆ;</li><li>ಆಸ್ತಿಯ ಮಾಲೀಕತ್ವ, ಗುತ್ತಿಗೆ, ಅಥವಾ ಅದನ್ನು ನಡೆಸಲು ಮತ್ತು ಬಾಡಿಗೆಗೆ ನೀಡಲು ಅಧಿಕಾರದ ಪುರಾವೆ;</li><li>ಆಸ್ತಿಯನ್ನು ಹೋಟೆಲ್, PG, ಹಾಸ್ಟೆಲ್, ಸರ್ವಿಸ್ ಅಪಾರ್ಟ್‌ಮೆಂಟ್ ಅಥವಾ ಬಾಡಿಗೆ ವಸತಿಯಾಗಿ ನಡೆಸಲು ಅನ್ವಯವಾಗುವ ಕಾನೂನಿನ ಅಡಿಯಲ್ಲಿ ಅಗತ್ಯವಿರುವ ಎಲ್ಲಾ ಪರವಾನಗಿಗಳು, ನೋಂದಣಿಗಳು, ಅನುಮತಿಗಳು ಮತ್ತು ಪ್ರಮಾಣಪತ್ರಗಳು (ಅನ್ವಯವಾದಲ್ಲಿ ವ್ಯಾಪಾರ ಪರವಾನಗಿ, ಪೊಲೀಸ್/PG ನೋಂದಣಿ, ಅಗ್ನಿ ಸುರಕ್ಷತಾ NOC, GST ನೋಂದಣಿ ಮತ್ತು ಪೌರ ಆರೋಗ್ಯ/ವಸತಿ ಅನುಮತಿಗಳು ಸೇರಿದಂತೆ);</li><li>ಪಾವತಿಗಳ ಇತ್ಯರ್ಥಕ್ಕಾಗಿ ಬ್ಯಾಂಕ್ ಖಾತೆ ಮತ್ತು PAN/GST ವಿವರಗಳು.</li></ul><p>ಸ್ಟೇವೃಕ್ಷ ತನ್ನ ಸ್ವಂತ ವಿವೇಚನೆಯಿಂದ ಯಾವುದೇ ಸಮಯದಲ್ಲಿ, ಸೂಚನೆಯೊಂದಿಗೆ ಅಥವಾ ಇಲ್ಲದೆ, ಯಾವುದೇ ವ್ಯಾಪಾರಿ ಅಥವಾ ಲಿಸ್ಟಿಂಗ್ ಅನ್ನು ಪರಿಶೀಲಿಸಬಹುದು, ಅಮಾನತುಗೊಳಿಸಬಹುದು, ತಿರಸ್ಕರಿಸಬಹುದು ಅಥವಾ ಪಟ್ಟಿಯಿಂದ ತೆಗೆಯಬಹುದು; ಹಿನ್ನೆಲೆ ಪರಿಶೀಲನೆ ನಡೆಸುವ ಯಾವುದೇ ಬಾಧ್ಯತೆ ಅದಕ್ಕೆ ಇಲ್ಲ ಮತ್ತು ಸ್ಟೇವೃಕ್ಷ ನಡೆಸುವ ಯಾವುದೇ ಪರಿಶೀಲನೆಯು ವ್ಯಾಪಾರಿಯ ಅನುಸರಣೆ ಅಥವಾ ಸೂಕ್ತತೆಯ ಖಾತರಿಯಾಗುವುದಿಲ್ಲ.</p>
policyTerms5Title=ವ್ಯಾಪಾರಿಯ ಜವಾಬ್ದಾರಿಗಳು — ಸಂಪೂರ್ಣ ಜವಾಬ್ದಾರಿ ವ್ಯಾಪಾರಿಯದ್ದು
policyTerms5Html=<p>ಆಸ್ತಿ, ಲಿಸ್ಟಿಂಗ್ ಮತ್ತು ಗ್ರಾಹಕನ ತಂಗುವಿಕೆಯ ಅನುಭವಕ್ಕೆ ಸಂಪೂರ್ಣ ಮತ್ತು ಏಕೈಕ ಜವಾಬ್ದಾರಿ ವ್ಯಾಪಾರಿಯದ್ದಾಗಿದೆ. ಮೇಲಿನವನ್ನು ಸೀಮಿತಗೊಳಿಸದೆ, ವ್ಯಾಪಾರಿಯು ಈ ಕೆಳಗಿನವುಗಳಿಗೆ ಪ್ರತ್ಯೇಕವಾಗಿ ಜವಾಬ್ದಾರನಾಗಿರುತ್ತಾನೆ:</p><ul><li>ಛಾಯಾಚಿತ್ರಗಳು, ಕೊಠಡಿ ವಿವರಣೆಗಳು, ಸೌಲಭ್ಯಗಳು, ಬೆಲೆ, ಲಭ್ಯತೆ ಮತ್ತು ಮನೆ ನಿಯಮಗಳು ಸೇರಿದಂತೆ ಎಲ್ಲಾ ಲಿಸ್ಟಿಂಗ್ ಮಾಹಿತಿಯ ನಿಖರತೆ;</li><li>ಆಸ್ತಿಯನ್ನು ನಡೆಸಲು ಅನ್ವಯವಾಗುವ ಕಾನೂನಿನಿಂದ ಅಗತ್ಯವಿರುವ ಎಲ್ಲಾ ಪರವಾನಗಿಗಳು, ಅನುಮತಿಗಳು, ನೋಂದಣಿಗಳು, ವಿಮೆ ಮತ್ತು ಅನುಮೋದನೆಗಳನ್ನು ಪಡೆಯುವುದು ಮತ್ತು ನಿರ್ವಹಿಸುವುದು;</li><li>ಆಸ್ತಿಯ ದೈಹಿಕ ಸುರಕ್ಷತೆ, ಭದ್ರತೆ, ನೈರ್ಮಲ್ಯ, ಅಗ್ನಿ ಸುರಕ್ಷತೆ ಮತ್ತು ರಚನಾತ್ಮಕ ಗಟ್ಟಿತನ;</li><li>ವ್ಯಾಪಾರಿಯ ಸಿಬ್ಬಂದಿ, ಭದ್ರತಾ ಸಿಬ್ಬಂದಿ ಮತ್ತು ಪ್ರತಿನಿಧಿಗಳ ನಡವಳಿಕೆ, ಹಿನ್ನೆಲೆ ಪರಿಶೀಲನೆ ಮತ್ತು ಮೇಲ್ವಿಚಾರಣೆ;</li><li>ಬುಕಿಂಗ್ ಸಮಯದಲ್ಲಿ ವೇದಿಕೆಯಲ್ಲಿ ತೋರಿಸಿದ ಬೆಲೆ, ದಿನಾಂಕಗಳು ಮತ್ತು ಷರತ್ತುಗಳಲ್ಲಿ ದೃಢೀಕೃತ ಬುಕಿಂಗ್‌ಗಳನ್ನು ಪಾಲಿಸುವುದು;</li><li>ತಂಗುವಿಕೆಯ ಮೇಲಿನ GST ಅಥವಾ ಇತರ ಶಾಸನಬದ್ಧ ತೆರಿಗೆಗಳ ಸಂಗ್ರಹ ಮತ್ತು ಠೇವಣಿ ಸೇರಿದಂತೆ ಎಲ್ಲಾ ಅನ್ವಯವಾಗುವ ತೆರಿಗೆ ಕಾನೂನುಗಳ ಅನುಸರಣೆ;</li><li>ಆಸ್ತಿಯಲ್ಲಿ ಅಥವಾ ಅದರ ಸುತ್ತಮುತ್ತ ಯಾವುದೇ ರೀತಿಯಲ್ಲಿ ಸಂಭವಿಸುವ ಗಾಯ, ಅನಾರೋಗ್ಯ, ನಷ್ಟ, ಕಳ್ಳತನ, ಆಸ್ತಿ ಹಾನಿ ಅಥವಾ ಸಾವು;</li><li>ಆಸ್ತಿಯ ಗುಣಮಟ್ಟ, ಸ್ಥಿತಿ ಅಥವಾ ಸೂಕ್ತತೆಗೆ ಸಂಬಂಧಿಸಿದ ಗ್ರಾಹಕರೊಂದಿಗಿನ ವಿವಾದಗಳ ಪರಿಹಾರ;</li><li>ಸ್ಥಳೀಯ ಪೊಲೀಸ್, ಪೌರ ಮತ್ತು ಪ್ರವಾಸೋದ್ಯಮ ಇಲಾಖೆಯ ವರದಿ ಮತ್ತು ಅತಿಥಿ ನೋಂದಣಿ ಅಗತ್ಯತೆಗಳ ಅನುಸರಣೆ.</li></ul><p>ಈ ಕಲಂ 5 ರಲ್ಲಿ ಪಟ್ಟಿ ಮಾಡಲಾದ ಯಾವುದೇ ವಿಷಯಗಳಿಗೆ ಸ್ಟೇವೃಕ್ಷ ಯಾವುದೇ ಜವಾಬ್ದಾರಿ ಅಥವಾ ಹೊಣೆಗಾರಿಕೆಯನ್ನು ಹೊತ್ತಿಲ್ಲ ಎಂದು ವ್ಯಾಪಾರಿ ಒಪ್ಪಿಕೊಳ್ಳುತ್ತಾನೆ ಮತ್ತು ಅಂತಹ ಸಂಪೂರ್ಣ ಹೊಣೆಗಾರಿಕೆ ವ್ಯಾಪಾರಿಯ ಮೇಲೆಯೇ ಇರುತ್ತದೆ.</p>
policyTerms6Title=ಬುಕಿಂಗ್ ಮತ್ತು ಪಾವತಿಗಳು
policyTerms6Html=<p><strong>ಬುಕಿಂಗ್ ದೃಢೀಕರಣ.</strong> ಯಶಸ್ವಿ ಪಾವತಿಯ ನಂತರ ವೇದಿಕೆಯು ದೃಢೀಕರಣ ನೀಡಿದಾಗ ಮಾತ್ರ ಬುಕಿಂಗ್ ದೃಢೀಕೃತವಾಗುತ್ತದೆ. ಬುಕಿಂಗ್ ಸಮಯದಲ್ಲಿ ಪ್ರದರ್ಶಿಸಿದ ಬೆಲೆ ಮತ್ತು ಷರತ್ತುಗಳಲ್ಲಿ ಪ್ರತಿ ದೃಢೀಕೃತ ಬುಕಿಂಗ್ ಅನ್ನು ಪಾಲಿಸಲು ವ್ಯಾಪಾರಿ ಒಪ್ಪುತ್ತಾನೆ, ಅದು ವ್ಯಾಪಾರಿಯ ಘೋಷಿತ ನೀತಿಗಳಿಗೆ ಒಳಪಟ್ಟಿರುತ್ತದೆ.</p><p><strong>ಪಾವತಿ ಸಂಗ್ರಹ.</strong> ಸ್ಟೇವೃಕ್ಷ ವ್ಯಾಪಾರಿಯ ಪರವಾಗಿ, ಈ ಉದ್ದೇಶಕ್ಕಾಗಿ ಸೀಮಿತ ಸಂಗ್ರಹ ಪ್ರತಿನಿಧಿಯಾಗಿ ಕಾರ್ಯನಿರ್ವಹಿಸುತ್ತಾ, ವೇದಿಕೆಯ ನಿಗದಿತ ಪಾವತಿ ಗೇಟ್‌ವೇ ಮೂಲಕ ಗ್ರಾಹಕರಿಂದ ಬುಕಿಂಗ್ ಮೊತ್ತವನ್ನು ಸಂಗ್ರಹಿಸುತ್ತದೆ. ಸ್ಟೇವೃಕ್ಷ ಪಾವತಿಯನ್ನು ಸ್ವೀಕರಿಸುವುದು ವ್ಯಾಪಾರಿಯ ಪರವಾಗಿ ಸ್ವೀಕಾರವೆಂದು ಪರಿಗಣಿಸಲಾಗುತ್ತದೆ.</p><p><strong>ಇತ್ಯರ್ಥ ಮತ್ತು ಕಮಿಷನ್.</strong> ಸ್ಟೇವೃಕ್ಷ ತನ್ನ ಒಪ್ಪಿದ ಕಮಿಷನ್/ಸೇವಾ ಶುಲ್ಕವನ್ನು ಬುಕಿಂಗ್ ಮೊತ್ತದಿಂದ ಕಡಿತಗೊಳಿಸಿ, ಉಳಿದ ಮೊತ್ತವನ್ನು ವ್ಯಾಪಾರಿ ಒಪ್ಪಂದದಲ್ಲಿ ನಿರ್ದಿಷ್ಟಪಡಿಸಿದ ಕಾಲಮಿತಿಯೊಳಗೆ (ಸಾಮಾನ್ಯವಾಗಿ ಚೆಕ್-ಇನ್/ಸೇವೆ ಪೂರ್ಣಗೊಂಡ 30 ದಿನಗಳೊಳಗೆ, ಯಾವುದೇ ಮಾನ್ಯ ವಿವಾದ ಅಥವಾ ಚಾರ್ಜ್‌ಬ್ಯಾಕ್ ಬಾಕಿ ಇಲ್ಲದಿದ್ದರೆ) ವ್ಯಾಪಾರಿಯ ನೋಂದಾಯಿತ ಬ್ಯಾಂಕ್ ಖಾತೆಗೆ ವರ್ಗಾಯಿಸುತ್ತದೆ.</p><p><strong>ತೆರಿಗೆಗಳು.</strong> ವಸತಿ/ಸೇವೆಯ ಮೇಲಿನ ಎಲ್ಲಾ ಅನ್ವಯವಾಗುವ ತೆರಿಗೆಗಳನ್ನು (GST ಸೇರಿದಂತೆ) ಲೆಕ್ಕಪರಿಶೋಧಿಸಿ ಸೂಕ್ತ ಅಧಿಕಾರಿಗಳಿಗೆ ಪಾವತಿಸುವ ಜವಾಬ್ದಾರಿ ವ್ಯಾಪಾರಿಯದ್ದಾಗಿದೆ, ಅನ್ವಯವಾಗುವ ಕಾನೂನಿನ ಅಡಿಯಲ್ಲಿ ಮಾರುಕಟ್ಟೆ ಸುಗಮಗೊಳಿಸುವವರಾಗಿ ಸ್ಟೇವೃಕ್ಷ ಮೇಲೆ ಬೇರೆ ರೀತಿಯಲ್ಲಿ ಅಗತ್ಯವಿರದಿದ್ದರೆ.</p><p><strong>ಪಾವತಿ ವೈಫಲ್ಯ ಮತ್ತು ವಂಚನೆ.</strong> ಗ್ರಾಹಕರ ಬ್ಯಾಂಕ್, ಪಾವತಿ ಗೇಟ್‌ವೇ, ನೆಟ್‌ವರ್ಕ್ ಸಮಸ್ಯೆಗಳು ಅಥವಾ ಯಾವುದೇ ಮೂರನೇ ಪಕ್ಷದ ವಂಚನಾ ಚಟುವಟಿಕೆಯಿಂದ ಉಂಟಾದ ಪಾವತಿಯ ವಿಳಂಬ, ವೈಫಲ್ಯ ಅಥವಾ ರಿವರ್ಸಲ್‌ಗೆ ಸ್ಟೇವೃಕ್ಷ ಹೊಣೆಯಲ್ಲ.</p>
policyTerms7Title=ರದ್ದತಿ, ಮರುಪಾವತಿ ಮತ್ತು ನೋ-ಶೋ ನೀತಿ
policyTerms7Html=<p>ಪ್ರತಿ ವ್ಯಾಪಾರಿಯು ಪ್ರತಿ ಲಿಸ್ಟಿಂಗ್‌ಗೂ ತನ್ನದೇ ಆದ ರದ್ದತಿ, ಮರುಪಾವತಿ, ಮರುನಿಗದಿ ಮತ್ತು ನೋ-ಶೋ ನೀತಿಯನ್ನು ನಿಗದಿಪಡಿಸುತ್ತಾನೆ ಮತ್ತು ಅದನ್ನು ಬುಕಿಂಗ್‌ಗೆ ಮೊದಲು ಗ್ರಾಹಕರಿಗೆ ತೋರಿಸಲಾಗುತ್ತದೆ. ಬುಕಿಂಗ್ ಪೂರ್ಣಗೊಳಿಸುವ ಮೂಲಕ, ಆ ಲಿಸ್ಟಿಂಗ್‌ನ ನಿರ್ದಿಷ್ಟ ವ್ಯಾಪಾರಿಯ ನೀತಿಗೆ ಬದ್ಧರಾಗಿರಲು ಗ್ರಾಹಕರು ಒಪ್ಪುತ್ತಾರೆ.</p><p>ಯಾವುದೇ ಮರುಪಾವತಿಯನ್ನು ಪ್ರಕ್ರಿಯೆಗೊಳಿಸುವಲ್ಲಿ ಸ್ಟೇವೃಕ್ಷ ಪಾತ್ರವು ವ್ಯಾಪಾರಿಯ ಘೋಷಿತ ನೀತಿಗೆ ಅನುಸಾರವಾಗಿ ಮತ್ತು ಮರುಪಾವತಿಗೆ ವ್ಯಾಪಾರಿ ಅಧಿಕಾರ ನೀಡುವುದು ಅಥವಾ ಜವಾಬ್ದಾರನಾಗಿರುವುದಕ್ಕೆ ಒಳಪಟ್ಟು, ಈಗಾಗಲೇ ಸಂಗ್ರಹಿಸಿದ ಹಣವನ್ನು ಮರಳಿಸಲು ನೆರವು ನೀಡುವುದಕ್ಕೆ ಸೀಮಿತವಾಗಿದೆ. ವ್ಯಾಪಾರಿಗೆ ಈಗಾಗಲೇ ಇತ್ಯರ್ಥವಾದ ಮೊತ್ತವನ್ನು ವ್ಯಾಪಾರಿಯಿಂದ ವಸೂಲಿ ಮಾಡುವುದನ್ನು ಹೊರತುಪಡಿಸಿ, ಅದನ್ನು ಮರುಪಾವತಿಸುವ ಬಾಧ್ಯತೆ ಸ್ಟೇವೃಕ್ಷ ಗೆ ಇಲ್ಲ.</p><p>ವ್ಯಾಪಾರಿಯು ತನ್ನದೇ ರದ್ದತಿ ಅಥವಾ ಮರುಪಾವತಿ ನೀತಿಯನ್ನು ಪಾಲಿಸಲು ನಿರಾಕರಿಸುವುದು ಅಥವಾ ವಿಫಲವಾಗುವುದಕ್ಕೆ ಸ್ಟೇವೃಕ್ಷ ಹೊಣೆಯಲ್ಲ; ಅಂತಹ ವೈಫಲ್ಯವು ಕೇವಲ ಗ್ರಾಹಕ ಮತ್ತು ವ್ಯಾಪಾರಿಯ ನಡುವಿನ ವಿಷಯವಾಗಿದ್ದು, ಕಲಂ 17 ರ ಅಡಿಯಲ್ಲಿ ವ್ಯಾಪಾರಿಯ ವಿರುದ್ಧ ಕ್ರಮ ಕೈಗೊಳ್ಳುವ ಸ್ಟೇವೃಕ್ಷ ಹಕ್ಕಿಗೆ ಯಾವುದೇ ಹಾನಿಯಾಗುವುದಿಲ್ಲ.</p>
policyTerms8Title=ವ್ಯಾಪಾರಿಯ ಪರಿಹಾರ ಭರಣೆ
policyTerms8Html=<p>ಕೆಳಗಿನವುಗಳಿಂದ ಉಂಟಾಗುವ ಅಥವಾ ಸಂಬಂಧಿಸಿದ ಎಲ್ಲಾ ಮತ್ತು ಪ್ರತಿಯೊಂದು ಕ್ಲೇಮ್‌ಗಳು, ಬೇಡಿಕೆಗಳು, ನಷ್ಟಗಳು, ಹಾನಿಗಳು, ಹೊಣೆಗಾರಿಕೆಗಳು, ವೆಚ್ಚಗಳು ಮತ್ತು ಖರ್ಚುಗಳಿಂದ (ಸಮಂಜಸವಾದ ಕಾನೂನು ಶುಲ್ಕಗಳು ಸೇರಿದಂತೆ) ಸ್ಟೇವೃಕ್ಷ, ಅದರ ನಿರ್ದೇಶಕರು, ಅಧಿಕಾರಿಗಳು, ಉದ್ಯೋಗಿಗಳು ಮತ್ತು ಸಂಯುಕ್ತ ಸಂಸ್ಥೆಗಳನ್ನು ಪರಿಹಾರ ನೀಡಿ, ರಕ್ಷಿಸಿ ಮತ್ತು ಹಾನಿಯಿಲ್ಲದಂತೆ ಇರಿಸಲು ವ್ಯಾಪಾರಿ ಒಪ್ಪುತ್ತಾನೆ:</p><ul><li>ಯಾವುದೇ ನಿಖರವಲ್ಲದ, ದಾರಿತಪ್ಪಿಸುವ ಅಥವಾ ಅನಧಿಕೃತ ಲಿಸ್ಟಿಂಗ್ ಮಾಹಿತಿ;</li><li>ಅಗತ್ಯವಿರುವ ಯಾವುದೇ ಪರವಾನಗಿ, ಅನುಮತಿ ಅಥವಾ ನೋಂದಣಿಯನ್ನು ಹೊಂದಲು ಅಥವಾ ನಿರ್ವಹಿಸಲು ವ್ಯಾಪಾರಿ ವಿಫಲವಾಗುವುದು;</li><li>ಆಸ್ತಿಯಲ್ಲಿ ಅಥವಾ ಅದಕ್ಕೆ ಸಂಬಂಧಿಸಿದಂತೆ ಸಂಭವಿಸುವ ಯಾವುದೇ ಗಾಯ, ನಷ್ಟ, ಸಾವು, ಕಳ್ಳತನ ಅಥವಾ ಹಾನಿ;</li><li>ಈ ಷರತ್ತುಗಳು, ಅನ್ವಯವಾಗುವ ಕಾನೂನು ಅಥವಾ ಯಾವುದೇ ಮೂರನೇ ಪಕ್ಷದ ಹಕ್ಕನ್ನು ವ್ಯಾಪಾರಿ ಉಲ್ಲಂಘಿಸುವುದು;</li><li>ವ್ಯಾಪಾರಿ ಮತ್ತು ಗ್ರಾಹಕರ ನಡುವಿನ ಯಾವುದೇ ವಿವಾದ.</li></ul>
policyTerms9Title=ಗ್ರಾಹಕರ ಕರ್ತವ್ಯಗಳು
policyTerms9Html=<p>ಗ್ರಾಹಕರು ಒಪ್ಪುತ್ತಾರೆ:</p><ul><li>ನಿಖರವಾದ ಗುರುತು ಮತ್ತು ಬುಕಿಂಗ್ ಮಾಹಿತಿಯನ್ನು ಒದಗಿಸಲು;</li><li>ತಾವು ಬುಕ್ ಮಾಡುವ ಆಸ್ತಿಯ ವ್ಯಾಪಾರಿಯ ಮನೆ ನಿಯಮಗಳು, ಚೆಕ್-ಇನ್/ಚೆಕ್-ಔಟ್ ಸಮಯಗಳು ಮತ್ತು ನೀತಿಗಳನ್ನು ಪಾಲಿಸಲು;</li><li>ವ್ಯಾಪಾರಿಗಳು, ಸಿಬ್ಬಂದಿ ಮತ್ತು ಇತರ ಅತಿಥಿಗಳ ಬಗ್ಗೆ ಕಾನೂನುಬದ್ಧವಾಗಿ ಮತ್ತು ಗೌರವದಿಂದ ವರ್ತಿಸಲು;</li><li>ಆಸ್ತಿಗೆ ತಾವೇ ಉಂಟುಮಾಡುವ ಯಾವುದೇ ಹಾನಿಗೆ ಹೊಣೆಯಾಗಿರಲು, ಅದನ್ನು ನೇರವಾಗಿ ವ್ಯಾಪಾರಿಗೆ ಪಾವತಿಸಬೇಕು;</li><li>ಶುಲ್ಕ ತಪ್ಪಿಸಲು ವೇದಿಕೆಯನ್ನು ಬಳಸದೆ ನೇರವಾಗಿ ವ್ಯಾಪಾರಿಯೊಂದಿಗೆ ಬುಕಿಂಗ್ ಮಾಡುವುದು ಸೇರಿದಂತೆ, ಯಾವುದೇ ಕಾನೂನುಬಾಹಿರ, ವಂಚನಾತ್ಮಕ ಅಥವಾ ಅನಧಿಕೃತ ಉದ್ದೇಶಕ್ಕಾಗಿ ವೇದಿಕೆಯನ್ನು ಬಳಸದಿರಲು.</li></ul><p>ಈ ಕಲಂನ ಗ್ರಾಹಕರ ಉಲ್ಲಂಘನೆ ಅಥವಾ ವೇದಿಕೆಯ ಯಾವುದೇ ದುರುಪಯೋಗದಿಂದ ಉಂಟಾಗುವ ಯಾವುದೇ ನಷ್ಟಕ್ಕೆ ಗ್ರಾಹಕರು ಸ್ಟೇವೃಕ್ಷ ಗೆ ಪರಿಹಾರ ನೀಡಲು ಒಪ್ಪುತ್ತಾರೆ.</p>
policyTerms10Title=ಹೊಣೆಗಾರಿಕೆಯ ಮಿತಿ
policyTerms10Html=<p>ವೇದಿಕೆ ಮತ್ತು ಎಲ್ಲಾ ಲಿಸ್ಟಿಂಗ್‌ಗಳನ್ನು “ಇರುವಂತೆ” ಮತ್ತು “ಲಭ್ಯವಿರುವಂತೆ” ಆಧಾರದಲ್ಲಿ ಒದಗಿಸಲಾಗಿದೆ. ಯಾವುದೇ ಲಿಸ್ಟಿಂಗ್ ಅಥವಾ ವ್ಯಾಪಾರಿಯ ನಿಖರತೆ, ಗುಣಮಟ್ಟ, ಸುರಕ್ಷತೆ, ಕಾನೂನುಬದ್ಧತೆ ಅಥವಾ ಸೂಕ್ತತೆಗೆ ಸ್ಟೇವೃಕ್ಷ ಯಾವುದೇ ಸ್ಪಷ್ಟ ಅಥವಾ ಸೂಚಿತ ಖಾತರಿ ನೀಡುವುದಿಲ್ಲ.</p><p>ಅನ್ವಯವಾಗುವ ಕಾನೂನಿನಿಂದ ಅನುಮತಿಸಲಾದ ಗರಿಷ್ಠ ಮಟ್ಟಿಗೆ, ಯಾವುದೇ ಬುಕಿಂಗ್ ಅಥವಾ ವೇದಿಕೆಯ ಬಳಕೆಯಿಂದ ಉಂಟಾಗುವ ಅಥವಾ ಸಂಬಂಧಿಸಿದ ಯಾವುದೇ ನೇರ, ಪರೋಕ್ಷ, ಆಕಸ್ಮಿಕ, ವಿಶೇಷ ಅಥವಾ ಪರಿಣಾಮಕಾರಿ ಹಾನಿಗಳಿಗೆ ಸ್ಟೇವೃಕ್ಷ ಹೊಣೆಯಾಗಿರುವುದಿಲ್ಲ, ಅವುಗಳಲ್ಲಿ ವೈಯಕ್ತಿಕ ಗಾಯ, ಸಾವು, ಆಸ್ತಿ ಹಾನಿ, ತಂಗುವಿಕೆಯ ನಷ್ಟ ಅಥವಾ ವ್ಯಾಪಾರಿಯ ಚ್ಯುತಿಯಿಂದ ಉಂಟಾದ ನಷ್ಟ ಸೇರಿದೆ, ಆದರೆ ಇಷ್ಟಕ್ಕೆ ಸೀಮಿತವಲ್ಲ.</p><p>ಅನ್ವಯವಾಗುವ ಕಾನೂನಿನ ಅಡಿಯಲ್ಲಿ ಸ್ಟೇವೃಕ್ಷ ನ ಯಾವುದೇ ಹೊಣೆಗಾರಿಕೆಯನ್ನು ಹೊರಗಿಡಲು ಸಾಧ್ಯವಿಲ್ಲದಿದ್ದಲ್ಲಿ, ಅಂತಹ ಹೊಣೆಗಾರಿಕೆಯು ಒಟ್ಟಾರೆಯಾಗಿ, ಕ್ಲೇಮ್‌ಗೆ ಕಾರಣವಾದ ನಿರ್ದಿಷ್ಟ ಬುಕಿಂಗ್‌ಗೆ ಸಂಬಂಧಿಸಿದಂತೆ ಸ್ಟೇವೃಕ್ಷ ನಿಜವಾಗಿ ಉಳಿಸಿಕೊಂಡ ವೇದಿಕೆ ಶುಲ್ಕ/ಕಮಿಷನ್‌ಗೆ ಸೀಮಿತವಾಗಿರುತ್ತದೆ.</p>
policyTerms11Title=ವಿಮರ್ಶೆಗಳು ಮತ್ತು ರೇಟಿಂಗ್‌ಗಳು
policyTerms11Html=<p>ಗ್ರಾಹಕರು ತಮ್ಮ ತಂಗುವಿಕೆಯ ಪ್ರಾಮಾಣಿಕ ವಿಮರ್ಶೆಗಳನ್ನು ಸಲ್ಲಿಸಬಹುದು. ಕಾನೂನುಬಾಹಿರ, ಮಾನಹಾನಿಕರ, ವಂಚನಾತ್ಮಕ ಅಥವಾ ಈ ಷರತ್ತುಗಳ ಉಲ್ಲಂಘನೆಯಾಗಿರುವ ವಿಮರ್ಶೆಗಳನ್ನು ಸ್ಟೇವೃಕ್ಷ ಮಧ್ಯಸ್ಥಿಕೆ ಮಾಡಬಹುದು, ತೆಗೆಯಬಹುದು ಅಥವಾ ಪ್ರಕಟಿಸಲು ನಿರಾಕರಿಸಬಹುದು; ಆದರೆ ಪ್ರತಿ ವಿಮರ್ಶೆಯನ್ನೂ ಪರಿಶೀಲಿಸುವ ಬಾಧ್ಯತೆ ಅದಕ್ಕೆ ಇಲ್ಲ ಮತ್ತು ಬಳಕೆದಾರರು ಸಲ್ಲಿಸಿದ ವಿಮರ್ಶೆಗಳ ವಿಷಯಕ್ಕೆ ಅದು ಹೊಣೆಯಲ್ಲ.</p>
policyTerms12Title=ಅಮಾನತು ಮತ್ತು ಮುಕ್ತಾಯ
policyTerms12Html=<p>ಈ ಷರತ್ತುಗಳ ಉಲ್ಲಂಘನೆ, ವಂಚನಾ ಚಟುವಟಿಕೆ, ಪುನರಾವರ್ತಿತ ಗ್ರಾಹಕ ದೂರುಗಳು, ಅಗತ್ಯವಿರುವ ಪರವಾನಗಿಗಳನ್ನು ನಿರ್ವಹಿಸಲು ವಿಫಲವಾಗುವುದು, ಅಥವಾ ವೇದಿಕೆ, ಇತರ ಬಳಕೆದಾರರು ಅಥವಾ ಸ್ಟೇವೃಕ್ಷ ಯ ಖ್ಯಾತಿಗೆ ಹಾನಿಕರ ಎಂದು ಸ್ಟೇವೃಕ್ಷ ಸಮಂಜಸವಾಗಿ ನಂಬುವ ಯಾವುದೇ ನಡವಳಿಕೆಯ ಆಧಾರದಲ್ಲಿ, ಸೂಚನೆಯೊಂದಿಗೆ ಅಥವಾ ಇಲ್ಲದೆ, ವ್ಯಾಪಾರಿ ಅಥವಾ ಗ್ರಾಹಕರ ವೇದಿಕೆ ಪ್ರವೇಶವನ್ನು ಅಮಾನತುಗೊಳಿಸಬಹುದು, ನಿರ್ಬಂಧಿಸಬಹುದು ಅಥವಾ ಮುಕ್ತಾಯಗೊಳಿಸಬಹುದು.</p><p>ದೂರು, ಚಾರ್ಜ್‌ಬ್ಯಾಕ್ ಅಥವಾ ಶಂಕಿತ ವಂಚನೆಯ ತನಿಖೆ ಬಾಕಿ ಇರುವವರೆಗೆ ವ್ಯಾಪಾರಿಗೆ ಬಾಕಿ ಇರುವ ಮೊತ್ತವನ್ನು ತಡೆಹಿಡಿಯಬಹುದು.</p>
policyTerms13Title=ಬೌದ್ಧಿಕ ಆಸ್ತಿ
policyTerms13Html=<p>ವೇದಿಕೆ, ಅದರ ವಿನ್ಯಾಸ, ಲೋಗೋಗಳು, ಟ್ರೇಡ್‌ಮಾರ್ಕ್‌ಗಳು ಮತ್ತು ಆಧಾರವಾಗಿರುವ ಸಾಫ್ಟ್‌ವೇರ್ ಸ್ಟೇವೃಕ್ಷ ಅಥವಾ ಅದರ ಪರವಾನಗಿದಾರರ ವಿಶೇಷ ಆಸ್ತಿಯಾಗಿದೆ. ವೇದಿಕೆಯನ್ನು ನಿರ್ವಹಿಸುವ ಮತ್ತು ಪ್ರಚಾರ ಮಾಡುವ ಉದ್ದೇಶಕ್ಕಾಗಿ, ವೇದಿಕೆಯಲ್ಲಿ ಮತ್ತು ಅದರ ಮಾರ್ಕೆಟಿಂಗ್‌ನಲ್ಲಿ ವ್ಯಾಪಾರಿ ವಿಷಯವನ್ನು ಬಳಸಲು, ಪುನರುತ್ಪಾದಿಸಲು ಮತ್ತು ಪ್ರದರ್ಶಿಸಲು ವ್ಯಾಪಾರಿಗಳು ಸ್ಟೇವೃಕ್ಷ ಗೆ ವಿಶೇಷವಲ್ಲದ, ರಾಯಲ್ಟಿ-ಮುಕ್ತ ಪರವಾನಗಿಯನ್ನು ನೀಡುತ್ತಾರೆ.</p>
policyTerms14Title=ಡೇಟಾ ಗೋಪ್ಯತೆ
policyTerms14Html=<p>ವ್ಯಾಪಾರಿಗಳು ಮತ್ತು ಗ್ರಾಹಕರಿಂದ ಸಂಗ್ರಹಿಸಿದ ವೈಯಕ್ತಿಕ ಡೇಟಾವನ್ನು ಸ್ಟೇವೃಕ್ಷ ನ <a href='#Policies/privacy'>ಗೋಪ್ಯತಾ ನೀತಿ</a> ಮತ್ತು ಅನ್ವಯವಾಗುವ ಕಾನೂನಿನ ಅನುಸಾರ ಪ್ರಕ್ರಿಯೆಗೊಳಿಸಲಾಗುತ್ತದೆ, ಅದರಲ್ಲಿ ಡಿಜಿಟಲ್ ವೈಯಕ್ತಿಕ ಡೇಟಾ ಸಂರಕ್ಷಣಾ ಕಾಯ್ದೆ, 2023 (Digital Personal Data Protection Act, 2023) ಸೇರಿದೆ. ವೇದಿಕೆಯನ್ನು ಬಳಸುವ ಮೂಲಕ ನೀವು ಅಂತಹ ಪ್ರಕ್ರಿಯೆಗೆ ಸಮ್ಮತಿಸುತ್ತೀರಿ.</p>
policyTerms15Title=ಅನಿರೀಕ್ಷಿತ ಪರಿಸ್ಥಿತಿಗಳು (ಫೋರ್ಸ್ ಮೆಜ್ಯೂರ್)
policyTerms15Html=<p>ನೈಸರ್ಗಿಕ ವಿಪತ್ತುಗಳು, ಸಾಂಕ್ರಾಮಿಕ ರೋಗಗಳು, ಸರ್ಕಾರಿ ಆದೇಶಗಳು, ಇಂಟರ್ನೆಟ್ ಅಥವಾ ಪಾವತಿ ಗೇಟ್‌ವೇ ಸ್ಥಗಿತಗಳು, ಮುಷ್ಕರಗಳು ಅಥವಾ ನಾಗರಿಕ ಅಶಾಂತಿ ಸೇರಿದಂತೆ, ತನ್ನ ಸಮಂಜಸ ನಿಯಂತ್ರಣ ಮೀರಿದ ಘಟನೆಗಳಿಂದ ಉಂಟಾಗುವ ಯಾವುದೇ ವೈಫಲ್ಯ ಅಥವಾ ವಿಳಂಬಕ್ಕೆ ಸ್ಟೇವೃಕ್ಷ ಹೊಣೆಯಾಗಿರುವುದಿಲ್ಲ.</p>
policyTerms16Title=ಅನ್ವಯವಾಗುವ ಕಾನೂನು ಮತ್ತು ವಿವಾದ ಪರಿಹಾರ
policyTerms16Html=<p>ಈ ಷರತ್ತುಗಳು ಭಾರತದ ಕಾನೂನುಗಳಿಂದ ನಿಯಂತ್ರಿಸಲ್ಪಡುತ್ತವೆ ಮತ್ತು ಅವುಗಳಿಗೆ ಅನುಸಾರವಾಗಿ ವ್ಯಾಖ್ಯಾನಿಸಲ್ಪಡುತ್ತವೆ.</p><p>ಈ ಷರತ್ತುಗಳಿಂದ ಉಂಟಾಗುವ ಅಥವಾ ಸಂಬಂಧಿಸಿದ ಯಾವುದೇ ವಿವಾದವನ್ನು ಮೊದಲು ಕಲಂ 17 ರ ದೂರು ನಿವಾರಣಾ ಕಾರ್ಯವಿಧಾನದ ಮೂಲಕ ಸೌಹಾರ್ದಯುತವಾಗಿ ಪರಿಹರಿಸಲು ಪ್ರಯತ್ನಿಸಲಾಗುತ್ತದೆ. 30 ದಿನಗಳೊಳಗೆ ಸೌಹಾರ್ದಯುತ ಪರಿಹಾರವಾಗದಿದ್ದಲ್ಲಿ, ವಿವಾದವನ್ನು ಮಧ್ಯಸ್ಥಿಕೆ ಮತ್ತು ಸಂಧಾನ ಕಾಯ್ದೆ, 1996 (Arbitration and Conciliation Act, 1996) ಅಡಿಯಲ್ಲಿ ಮಧ್ಯಸ್ಥಿಕೆಯ ಮೂಲಕ ಅಂತಿಮವಾಗಿ ಪರಿಹರಿಸಲಾಗುತ್ತದೆ; ಸ್ಥಳ ಕಲಬುರಗಿ ಆಗಿರುತ್ತದೆ ಮತ್ತು ಕಾರ್ಯವಿಧಾನಗಳು ಸ್ಟೇವೃಕ್ಷ ನೇಮಿಸಿದ ಏಕೈಕ ಮಧ್ಯಸ್ಥಗಾರರ ಮುಂದೆ ಇಂಗ್ಲಿಷ್‌ನಲ್ಲಿ ನಡೆಯುತ್ತವೆ.</p><p>ಮೇಲಿನವುಗಳಿಗೆ ಒಳಪಟ್ಟು, ಕಲಬುರಗಿ, ಕರ್ನಾಟಕದ ನ್ಯಾಯಾಲಯಗಳಿಗೆ ವಿಶೇಷ ಅಧಿಕಾರ ವ್ಯಾಪ್ತಿ ಇರುತ್ತದೆ.</p>
policyTerms17Title=ದೂರು ನಿವಾರಣಾ ಅಧಿಕಾರಿ
policyTerms17Html=<p>ಮಾಹಿತಿ ತಂತ್ರಜ್ಞಾನ ಕಾಯ್ದೆ, 2000 ಮತ್ತು ಗ್ರಾಹಕ ಸಂರಕ್ಷಣಾ (ಇ-ಕಾಮರ್ಸ್) ನಿಯಮಗಳು, 2020 ರ ಅನುಸಾರ ದೂರು ಅಧಿಕಾರಿಯ ವಿವರಗಳು ಈ ಕೆಳಗಿನಂತಿವೆ:</p><div class='contact-card'><h3>ದೂರು ಅಧಿಕಾರಿ</h3><p><strong>ಹೆಸರು:</strong> ದೂರು ತಂಡ<br><strong>ಹುದ್ದೆ:</strong> ದೂರು ಅಧಿಕಾರಿ<br><strong>ಇಮೇಲ್:</strong> <a href='mailto:admin@stayvriksha.in'>admin@stayvriksha.in</a><br><strong>ವಿಳಾಸ:</strong> 111, ಕಲ್ಪವೃಕ್ಷ ಕರೇಕಲ್ ಲೇಔಟ್, ರೈಲ್ವೇ ಸೇತುವೆ ಹತ್ತಿರ, ಕಲಬುರಗಿ, ಕರ್ನಾಟಕ – 585102</p><p><strong>ಪ್ರತಿಕ್ರಿಯೆ ಕಾಲಮಿತಿ:</strong> 48 ಗಂಟೆಗಳೊಳಗೆ ಸ್ವೀಕೃತಿ; ದೂರು ಸ್ವೀಕರಿಸಿದ 30 ದಿನಗಳೊಳಗೆ ಪರಿಹಾರ.</p></div>
policyTerms18Title=ತಿದ್ದುಪಡಿ
policyTerms18Html=<p>ಪರಿಷ್ಕೃತ ಷರತ್ತುಗಳನ್ನು ನವೀಕರಿಸಿದ “ಕೊನೆಯ ನವೀಕರಣ” ದಿನಾಂಕದೊಂದಿಗೆ ವೇದಿಕೆಯಲ್ಲಿ ಪ್ರಕಟಿಸುವ ಮೂಲಕ ಸ್ಟೇವೃಕ್ಷ ಈ ಷರತ್ತುಗಳನ್ನು ಯಾವುದೇ ಸಮಯದಲ್ಲಿ ಬದಲಾಯಿಸಬಹುದು. ಅಂತಹ ಬದಲಾವಣೆಗಳ ನಂತರ ವೇದಿಕೆಯ ನಿರಂತರ ಬಳಕೆಯು ಪರಿಷ್ಕೃತ ಷರತ್ತುಗಳ ಸ್ವೀಕಾರವೆಂದು ಪರಿಗಣಿಸಲಾಗುತ್ತದೆ.</p>
policyTerms19Title=ಬೇರ್ಪಡಿಸುವಿಕೆ ಮತ್ತು ಸಂಪೂರ್ಣ ಒಪ್ಪಂದ
policyTerms19Html=<p>ಈ ಷರತ್ತುಗಳ ಯಾವುದೇ ನಿಬಂಧನೆ ಅಮಾನ್ಯ ಅಥವಾ ಜಾರಿಗೊಳಿಸಲಾಗದದ್ದು ಎಂದು ತೀರ್ಮಾನವಾದರೆ, ಉಳಿದ ನಿಬಂಧನೆಗಳು ಪೂರ್ಣವಾಗಿ ಜಾರಿಯಲ್ಲಿರುತ್ತವೆ. ಈ ಷರತ್ತುಗಳು, ಗೋಪ್ಯತಾ ನೀತಿ ಮತ್ತು ಯಾವುದೇ ವ್ಯಾಪಾರಿ ಒಪ್ಪಂದದೊಂದಿಗೆ ಸೇರಿ, ಅವುಗಳ ವಿಷಯಕ್ಕೆ ಸಂಬಂಧಿಸಿದಂತೆ ಪಕ್ಷಗಳ ನಡುವಿನ ಸಂಪೂರ್ಣ ಒಪ್ಪಂದವನ್ನು ರೂಪಿಸುತ್ತವೆ.</p>
policyTerms20Title=ಸಂಪರ್ಕ
policyTerms20Html=<p>ಈ ಷರತ್ತುಗಳಿಗೆ ಸಂಬಂಧಿಸಿದ ಯಾವುದೇ ಪ್ರಶ್ನೆಗಳಿಗಾಗಿ ದಯವಿಟ್ಟು ಸಂಪರ್ಕಿಸಿ:</p><div class='contact-card'><h3>ಸ್ಟೇವೃಕ್ಷ</h3><p>ಇಮೇಲ್: <a href='mailto:admin@stayvriksha.in'>admin@stayvriksha.in</a></p><p>ವಿಳಾಸ: 111, ಕಲ್ಪವೃಕ್ಷ ಕರೇಕಲ್ ಲೇಔಟ್, ರೈಲ್ವೇ ಸೇತುವೆ ಹತ್ತಿರ, ಕಲಬುರಗಿ, ಕರ್ನಾಟಕ – 585102</p></div>

# Policies - Privacy Policy
policyPrivacyTitle=ಗೋಪ್ಯತಾ ನೀತಿ
policyPrivacySubtitle=ನಾವು ವೈಯಕ್ತಿಕ ಮಾಹಿತಿಯನ್ನು ಹೇಗೆ ಸಂಗ್ರಹಿಸುತ್ತೇವೆ, ಬಳಸುತ್ತೇವೆ, ಹಂಚಿಕೊಳ್ಳುತ್ತೇವೆ, ಸಂಗ್ರಹಿಸಿ ಇಡುತ್ತೇವೆ ಮತ್ತು ರಕ್ಷಿಸುತ್ತೇವೆ.
policyPrivacy1Title=ಪರಿಚಯ
policyPrivacy1Html=<p>ಸ್ಟೇವೃಕ್ಷ ಗ್ರಾಹಕರು, ಆಸ್ತಿ ವ್ಯಾಪಾರಿಗಳು ಮತ್ತು ನಮ್ಮ ವೆಬ್‌ಸೈಟ್‌ಗೆ ಭೇಟಿ ನೀಡುವವರ ಗೋಪ್ಯತೆಯನ್ನು ಗೌರವಿಸುತ್ತದೆ.</p><p>ನೀವು ನಮ್ಮ ವೇದಿಕೆಗೆ ಭೇಟಿ ನೀಡಿದಾಗ, ಖಾತೆ ರಚಿಸಿದಾಗ, ವಸತಿ ಬುಕ್ ಮಾಡಿದಾಗ, ಆಸ್ತಿಯನ್ನು ನೋಂದಣಿ ಮಾಡಿದಾಗ ಅಥವಾ ನಮ್ಮನ್ನು ಸಂಪರ್ಕಿಸಿದಾಗ ನಾವು ವೈಯಕ್ತಿಕ ಮಾಹಿತಿಯನ್ನು ಹೇಗೆ ಸಂಗ್ರಹಿಸುತ್ತೇವೆ, ಬಳಸುತ್ತೇವೆ, ಹಂಚಿಕೊಳ್ಳುತ್ತೇವೆ, ಸಂಗ್ರಹಿಸಿ ಇಡುತ್ತೇವೆ ಮತ್ತು ರಕ್ಷಿಸುತ್ತೇವೆ ಎಂಬುದನ್ನು ಈ ಗೋಪ್ಯತಾ ನೀತಿ ವಿವರಿಸುತ್ತದೆ.</p>
policyPrivacy2Title=ನಾವು ಸಂಗ್ರಹಿಸಬಹುದಾದ ಮಾಹಿತಿ
policyPrivacy2Html=<p>ನೀವು ವೇದಿಕೆಯನ್ನು ಹೇಗೆ ಬಳಸುತ್ತೀರಿ ಎಂಬುದರ ಆಧಾರದಲ್ಲಿ, ನಾವು ಈ ಕೆಳಗಿನ ವರ್ಗಗಳ ಮಾಹಿತಿಯನ್ನು ಸಂಗ್ರಹಿಸಬಹುದು:</p><h3>ಅ. ಖಾತೆ ಮತ್ತು ಸಂಪರ್ಕ ಮಾಹಿತಿ</h3><ul><li>ಹೆಸರು, ಇಮೇಲ್ ವಿಳಾಸ, ದೂರವಾಣಿ ಸಂಖ್ಯೆ ಮತ್ತು ಖಾತೆ ರುಜುವಾತುಗಳು.</li><li>ಸಂವಹನ ಆದ್ಯತೆಗಳು ಮತ್ತು ಬೆಂಬಲ ಪತ್ರವ್ಯವಹಾರ.</li></ul><h3>ಆ. ಬುಕಿಂಗ್ ಮಾಹಿತಿ</h3><ul><li>ಆಸ್ತಿ, ಕೊಠಡಿ ಮತ್ತು ಬುಕಿಂಗ್ ಉಲ್ಲೇಖ.</li><li>ಚೆಕ್-ಇನ್ ಮತ್ತು ಚೆಕ್-ಔಟ್ ದಿನಾಂಕಗಳು, ಅತಿಥಿಗಳ ಸಂಖ್ಯೆ, ಬುಕಿಂಗ್ ಸ್ಥಿತಿ ಮತ್ತು ರದ್ದತಿ ದಾಖಲೆಗಳು.</li><li>ವಿಶೇಷ ವಿನಂತಿಗಳು ಅಥವಾ ನೀವು ಒದಗಿಸಲು ಆಯ್ಕೆಮಾಡುವ ಮಾಹಿತಿ.</li></ul><h3>ಇ. ಪಾವತಿ ಮಾಹಿತಿ</h3><ul><li>ವಹಿವಾಟು ಉಲ್ಲೇಖ, ಪಾವತಿ ಸ್ಥಿತಿ, ಮೊತ್ತ ಮತ್ತು ಮರುಪಾವತಿ ಮಾಹಿತಿ.</li><li>ಪಾವತಿಗಳನ್ನು ಮೂರನೇ ಪಕ್ಷದ ಪಾವತಿ ಸೇವಾ ಪೂರೈಕೆದಾರರು ನಿರ್ವಹಿಸಬಹುದು. ವಿಶೇಷವಾಗಿ ಅಧಿಕೃತಗೊಳಿಸದಿದ್ದರೆ ಮತ್ತು ಅನ್ವಯವಾಗುವ ಭದ್ರತಾ ಅಗತ್ಯತೆಗಳಿಗೆ ಅನುಸರಣೆಯಾಗದಿದ್ದರೆ, ನಾವು ಪೂರ್ಣ ಕಾರ್ಡ್ ರುಜುವಾತುಗಳನ್ನು ಸಂಗ್ರಹಿಸುವುದಿಲ್ಲ ಅಥವಾ ಶೇಖರಿಸಿಡುವುದಿಲ್ಲ.</li></ul><h3>ಈ. ವ್ಯಾಪಾರಿ ಮಾಹಿತಿ</h3><ul><li>ವ್ಯಾಪಾರ ಮತ್ತು ಆಸ್ತಿ ವಿವರಗಳು.</li><li>ಮಾಲೀಕ ಅಥವಾ ಅಧಿಕೃತ ಪ್ರತಿನಿಧಿಯ ಮಾಹಿತಿ.</li><li>ಅಗತ್ಯವಿದ್ದಲ್ಲಿ ಗುರುತು, ವಿಳಾಸ, ಮಾಲೀಕತ್ವ ಅಥವಾ ನಿರ್ವಹಣಾ ಅಧಿಕಾರ ದಾಖಲೆಗಳು, ಪರವಾನಗಿಗಳು, ತೆರಿಗೆ ಮಾಹಿತಿ ಮತ್ತು ಬ್ಯಾಂಕ್ ಇತ್ಯರ್ಥ ವಿವರಗಳು.</li></ul><h3>ಉ. ತಾಂತ್ರಿಕ ಮಾಹಿತಿ</h3><ul><li>ಸಂಗ್ರಹಿಸಿದಲ್ಲಿ IP ವಿಳಾಸ, ಬ್ರೌಸರ್ ಅಥವಾ ಸಾಧನ ಮಾಹಿತಿ, ಲಾಗ್ ಡೇಟಾ ಮತ್ತು ವೆಬ್‌ಸೈಟ್ ಬಳಕೆಯ ಮಾಹಿತಿ.</li><li>ಬಳಸಿದಲ್ಲಿ ಕುಕೀಗಳು ಮತ್ತು ಸಮಾನ ತಂತ್ರಜ್ಞಾನಗಳು.</li></ul><p>ನಮ್ಮ ಘೋಷಿತ ಉದ್ದೇಶಗಳು ಮತ್ತು ಅನ್ವಯವಾಗುವ ಕಾನೂನು ಬಾಧ್ಯತೆಗಳಿಗೆ ಸಮಂಜಸವಾಗಿ ಅಗತ್ಯವಿರುವ ಮಾಹಿತಿಯನ್ನು ಮಾತ್ರ ನಾವು ಸಂಗ್ರಹಿಸುತ್ತೇವೆ.</p>
policyPrivacy3Title=ನಾವು ಮಾಹಿತಿಯನ್ನು ಹೇಗೆ ಬಳಸುತ್ತೇವೆ
policyPrivacy3Html=<p>ನಾವು ವೈಯಕ್ತಿಕ ಮಾಹಿತಿಯನ್ನು ಈ ಕೆಳಗಿನವುಗಳಿಗಾಗಿ ಬಳಸಬಹುದು:</p><ul><li>ಗ್ರಾಹಕ ಮತ್ತು ವ್ಯಾಪಾರಿ ಖಾತೆಗಳನ್ನು ರಚಿಸುವುದು ಮತ್ತು ನಿರ್ವಹಿಸುವುದು.</li><li>ವಸತಿ ಬುಕಿಂಗ್‌ಗಳನ್ನು ಹುಡುಕುವುದು, ಕಾಯ್ದಿರಿಸುವುದು, ದೃಢೀಕರಿಸುವುದು ಮತ್ತು ನಿರ್ವಹಿಸುವುದು.</li><li>ಪಾವತಿ ಪ್ರಕ್ರಿಯೆ, ಮರುಪಾವತಿಗಳು ಮತ್ತು ವ್ಯಾಪಾರಿ ಇತ್ಯರ್ಥಗಳನ್ನು ಸುಗಮಗೊಳಿಸುವುದು.</li><li>ಬುಕಿಂಗ್ ದೃಢೀಕರಣಗಳು, ರದ್ದತಿಗಳು, ಜ್ಞಾಪನೆಗಳು ಮತ್ತು ಸೇವಾ ನವೀಕರಣಗಳನ್ನು ತಿಳಿಸುವುದು.</li><li>ವ್ಯಾಪಾರಿ ಮತ್ತು ಆಸ್ತಿ ಮಾಹಿತಿಯನ್ನು ಪರಿಶೀಲಿಸುವುದು.</li><li>ದೂರುಗಳು, ಬೆಂಬಲ ವಿನಂತಿಗಳು ಮತ್ತು ವಿವಾದಗಳಿಗೆ ಪ್ರತಿಕ್ರಿಯಿಸುವುದು.</li><li>ವಂಚನೆ, ದುರುಪಯೋಗ, ಅನಧಿಕೃತ ಪ್ರವೇಶ ಮತ್ತು ಭದ್ರತಾ ಅಪಾಯಗಳನ್ನು ಪತ್ತೆಹಚ್ಚುವುದು.</li><li>ವೇದಿಕೆಯನ್ನು ಸುಧಾರಿಸುವುದು ಮತ್ತು ಸೇವಾ ಬಳಕೆಯನ್ನು ಅರ್ಥಮಾಡಿಕೊಳ್ಳುವುದು.</li><li>ಕಾನೂನು, ನಿಯಂತ್ರಕ, ಲೆಕ್ಕಪತ್ರ ಮತ್ತು ದಾಖಲೆ ನಿರ್ವಹಣಾ ಬಾಧ್ಯತೆಗಳನ್ನು ಪೂರೈಸುವುದು.</li><li>ಕಾನೂನಿನಿಂದ ಅನುಮತಿಸಲಾದಲ್ಲಿ ಮತ್ತು ಅನ್ವಯವಾಗುವ ಆದ್ಯತೆಗಳಿಗೆ ಅನುಸಾರ ಪ್ರಚಾರ ಸಂವಹನಗಳನ್ನು ಕಳುಹಿಸುವುದು.</li></ul>
policyPrivacy4Title=ಮಾಹಿತಿಯನ್ನು ಹೇಗೆ ಹಂಚಿಕೊಳ್ಳಲಾಗುತ್ತದೆ
policyPrivacy4Html=<p>ನಾವು ಸಂಬಂಧಿತ ಮಾಹಿತಿಯನ್ನು ಈ ಕೆಳಗಿನವರೊಂದಿಗೆ ಹಂಚಿಕೊಳ್ಳಬಹುದು:</p><ul><li><strong>ಆಸ್ತಿ ವ್ಯಾಪಾರಿಗಳು:</strong> ಬುಕಿಂಗ್ ಪೂರೈಸಲು ಅಗತ್ಯವಿರುವ ಮಾಹಿತಿ, ಉದಾಹರಣೆಗೆ ಅತಿಥಿಯ ಹೆಸರು, ಬುಕಿಂಗ್ ವಿವರಗಳು, ಸಂಪರ್ಕ ವಿವರಗಳು ಮತ್ತು ಅಗತ್ಯವಿರುವ ಚೆಕ್-ಇನ್ ಮಾಹಿತಿ.</li><li><strong>ಪಾವತಿ ಸೇವಾ ಪೂರೈಕೆದಾರರು:</strong> ಪಾವತಿಗಳು, ಮರುಪಾವತಿಗಳು ಮತ್ತು ವಹಿವಾಟು ಪರಿಶೀಲನೆಗೆ ಅಗತ್ಯವಿರುವ ಮಾಹಿತಿ.</li><li><strong>ತಂತ್ರಜ್ಞಾನ ಮತ್ತು ಸೇವಾ ಪೂರೈಕೆದಾರರು:</strong> ನಾವು ನೇಮಿಸುವ ಹೋಸ್ಟಿಂಗ್, ವೆಬ್‌ಸೈಟ್ ನಿರ್ವಹಣೆ, ಗ್ರಾಹಕ ಬೆಂಬಲ, ಸಂವಹನ, ವಿಶ್ಲೇಷಣೆ ಮತ್ತು ಭದ್ರತಾ ಪೂರೈಕೆದಾರರು.</li><li><strong>ವೃತ್ತಿಪರ ಸಲಹೆಗಾರರು:</strong> ಅಗತ್ಯವಿದ್ದಲ್ಲಿ ಕಾನೂನು, ಲೆಕ್ಕಪತ್ರ, ಲೆಕ್ಕಪರಿಶೋಧನೆ ಅಥವಾ ಅನುಸರಣಾ ಸಲಹೆಗಾರರು.</li><li><strong>ಸರ್ಕಾರಿ ಮತ್ತು ನಿಯಂತ್ರಕ ಅಧಿಕಾರಿಗಳು:</strong> ಕಾನೂನಿನಿಂದ ಬಹಿರಂಗಪಡಿಸುವಿಕೆ ಅಗತ್ಯವಿದ್ದಲ್ಲಿ ಅಥವಾ ಬೇರೆ ರೀತಿಯಲ್ಲಿ ಕಾನೂನುಬದ್ಧವಾಗಿ ಅನುಮತಿಸಲಾದಲ್ಲಿ.</li><li><strong>ಇತರ ಪಕ್ಷಗಳು:</strong> ವಂಚನೆಯನ್ನು ಎದುರಿಸಲು, ಹಕ್ಕುಗಳು ಮತ್ತು ಸುರಕ್ಷತೆಯನ್ನು ರಕ್ಷಿಸಲು ಅಥವಾ ಸೂಕ್ತ ರಕ್ಷಣೆಗಳೊಂದಿಗೆ ವಹಿವಾಟು ನಡೆಸಲು ಅಗತ್ಯವಿದ್ದಲ್ಲಿ.</li></ul><p>ಅನ್ವಯವಾಗುವ ವ್ಯವಸ್ಥೆಗಳು ಮತ್ತು ಕಾನೂನಿನ ಆಚೆಗಿನ ಅಸಂಬಂಧಿತ ಉದ್ದೇಶಗಳಿಗಾಗಿ ವೈಯಕ್ತಿಕ ಮಾಹಿತಿಯನ್ನು ಬಳಸಲು ನಾವು ಸೇವಾ ಪೂರೈಕೆದಾರರಿಗೆ ಅಧಿಕಾರ ನೀಡುವುದಿಲ್ಲ.</p>
policyPrivacy5Title=ಕುಕೀಗಳು ಮತ್ತು ಸಮಾನ ತಂತ್ರಜ್ಞಾನಗಳು
policyPrivacy5Html=<p>ಅವಧಿಗಳನ್ನು ನಿರ್ವಹಿಸಲು, ಆದ್ಯತೆಗಳನ್ನು ನೆನಪಿಟ್ಟುಕೊಳ್ಳಲು, ಭದ್ರತೆಯನ್ನು ಬೆಂಬಲಿಸಲು ಅಥವಾ ವೆಬ್‌ಸೈಟ್ ಬಳಕೆಯನ್ನು ಅರ್ಥಮಾಡಿಕೊಳ್ಳಲು ನಮ್ಮ ವೆಬ್‌ಸೈಟ್ ಕುಕೀಗಳು ಅಥವಾ ಸಮಾನ ತಂತ್ರಜ್ಞಾನಗಳನ್ನು ಬಳಸಬಹುದು.</p><p>ಅನ್ವಯವಾದಲ್ಲಿ, ನಿಮ್ಮ ಬ್ರೌಸರ್ ಅಥವಾ ಲಭ್ಯವಿರುವ ವೆಬ್‌ಸೈಟ್ ಸೆಟ್ಟಿಂಗ್‌ಗಳ ಮೂಲಕ ನೀವು ಕುಕೀಗಳನ್ನು ನಿಯಂತ್ರಿಸಬಹುದು. ಕೆಲವು ಕುಕೀಗಳನ್ನು ನಿಷ್ಕ್ರಿಯಗೊಳಿಸುವುದು ವೇದಿಕೆಯ ಕೆಲವು ಕಾರ್ಯಗಳ ಮೇಲೆ ಪರಿಣಾಮ ಬೀರಬಹುದು.</p><p>ಬಳಸಲಾದ ಯಾವುದೇ ವಿಶ್ಲೇಷಣೆ ಅಥವಾ ಜಾಹೀರಾತು ತಂತ್ರಜ್ಞಾನಗಳ ವಿವರಗಳನ್ನು ನಮ್ಮ ನಿಜವಾದ ಅನುಷ್ಠಾನಕ್ಕೆ ಅನುಸಾರವಾಗಿ ಬಹಿರಂಗಪಡಿಸಬೇಕು.</p>
policyPrivacy6Title=ಡೇಟಾ ಧಾರಣೆ
policyPrivacy6Html=<p>ಈ ನೀತಿಯಲ್ಲಿ ವಿವರಿಸಿದ ಉದ್ದೇಶಗಳಿಗೆ ಸಮಂಜಸವಾಗಿ ಅಗತ್ಯವಿರುವಷ್ಟು ಕಾಲ ಮಾತ್ರ ನಾವು ವೈಯಕ್ತಿಕ ಮಾಹಿತಿಯನ್ನು ಉಳಿಸಿಕೊಳ್ಳುತ್ತೇವೆ; ಅವುಗಳಲ್ಲಿ ಸೇವೆಗಳನ್ನು ಒದಗಿಸುವುದು, ವಿವಾದಗಳನ್ನು ಪರಿಹರಿಸುವುದು, ವ್ಯಾಪಾರ ದಾಖಲೆಗಳನ್ನು ನಿರ್ವಹಿಸುವುದು, ವಂಚನೆಯನ್ನು ತಡೆಗಟ್ಟುವುದು ಮತ್ತು ಕಾನೂನು ಬಾಧ್ಯತೆಗಳನ್ನು ಪಾಲಿಸುವುದು ಸೇರಿವೆ.</p><p>ಧಾರಣಾ ಅವಧಿಗಳು ಡೇಟಾ ವರ್ಗ ಮತ್ತು ಅನ್ವಯವಾಗುವ ಅಗತ್ಯತೆಗಳ ಆಧಾರದಲ್ಲಿ ಬದಲಾಗುತ್ತವೆ. ಇನ್ನು ಅಗತ್ಯವಿಲ್ಲದ ಮಾಹಿತಿಯನ್ನು, ಸೂಕ್ತವಾದಾಗ ಮತ್ತು ಕಾನೂನುಬದ್ಧವಾಗಿ ಅನುಮತಿಸಲಾದಾಗ, ಸುರಕ್ಷಿತವಾಗಿ ಅಳಿಸಬೇಕು ಅಥವಾ ಅನಾಮಧೇಯಗೊಳಿಸಬೇಕು.</p>
policyPrivacy7Title=ಡೇಟಾ ಭದ್ರತೆ
policyPrivacy7Html=<p>ಸಂಸ್ಕರಿಸಲಾದ ಮಾಹಿತಿ ಮತ್ತು ಅದರಲ್ಲಿ ಒಳಗೊಂಡಿರುವ ಅಪಾಯಗಳಿಗೆ ಸೂಕ್ತವಾದ ಸಮಂಜಸ ತಾಂತ್ರಿಕ ಮತ್ತು ಸಾಂಸ್ಥಿಕ ರಕ್ಷಣಾ ಕ್ರಮಗಳನ್ನು ನಾವು ಬಳಸುತ್ತೇವೆ.</p><p>ಆನ್‌ಲೈನ್ ಪ್ರಸರಣ ಅಥವಾ ಎಲೆಕ್ಟ್ರಾನಿಕ್ ಶೇಖರಣೆಯ ಯಾವುದೇ ವಿಧಾನವೂ ಸಂಪೂರ್ಣ ಭದ್ರತೆಯನ್ನು ಖಾತರಿಪಡಿಸಲಾರದು. ವೈಯಕ್ತಿಕ ಡೇಟಾ ಉಲ್ಲಂಘನೆ ಸಂಭವಿಸಿದಲ್ಲಿ, ಅನ್ವಯವಾಗುವ ಕಾನೂನಿನಂತೆ ನಾವು ಪ್ರತಿಕ್ರಿಯಿಸುತ್ತೇವೆ ಮತ್ತು ಸೂಚನೆಗಳನ್ನು ನೀಡುತ್ತೇವೆ.</p>
policyPrivacy8Title=ನಿಮ್ಮ ಗೋಪ್ಯತಾ ಹಕ್ಕುಗಳು ಮತ್ತು ವಿನಂತಿಗಳು
policyPrivacy8Html=<p>ಅನ್ವಯವಾಗುವ ಕಾನೂನಿಗೆ ಒಳಪಟ್ಟು, ಮಾಹಿತಿಗೆ ಪ್ರವೇಶವನ್ನು ವಿನಂತಿಸುವ, ತಪ್ಪಾದ ಮಾಹಿತಿಯನ್ನು ಸರಿಪಡಿಸುವ ಅಥವಾ ನವೀಕರಿಸುವ, ಅರ್ಹ ಮಾಹಿತಿಯನ್ನು ಅಳಿಸುವ, ಸಂಸ್ಕರಣೆ ಸಮ್ಮತಿಯನ್ನು ಅವಲಂಬಿಸಿದ್ದಲ್ಲಿ ಸಮ್ಮತಿಯನ್ನು ಹಿಂತೆಗೆದುಕೊಳ್ಳುವ ಮತ್ತು ದೂರು ಅಥವಾ ಪರಿಹಾರ ಕಾರ್ಯವಿಧಾನಗಳ ಬಗ್ಗೆ ಮಾಹಿತಿ ಪಡೆಯುವ ಹಕ್ಕುಗಳು ನಿಮಗೆ ಇರಬಹುದು.</p><p>ವಿನಂತಿಗಳನ್ನು <a href='mailto:admin@stayvriksha.in'>admin@stayvriksha.in</a> ಗೆ ಸಲ್ಲಿಸಬಹುದು.</p><p>ವಿನಂತಿಯನ್ನು ಪ್ರಕ್ರಿಯೆಗೊಳಿಸುವ ಮೊದಲು ನಿಮ್ಮ ಗುರುತನ್ನು ಪರಿಶೀಲಿಸಬೇಕಾಗಬಹುದು. ಕಾನೂನು ಬಾಧ್ಯತೆಗಳನ್ನು ಪೂರೈಸಲು ಅಥವಾ ವಿವಾದಗಳನ್ನು ಪರಿಹರಿಸಲು ಕೆಲವು ಮಾಹಿತಿಯನ್ನು ಉಳಿಸಿಕೊಳ್ಳಬೇಕಾಗಬಹುದು.</p>
policyPrivacy9Title=ಮಕ್ಕಳು ಮತ್ತು ವಸತಿ ಬುಕಿಂಗ್
policyPrivacy9Html=<p>ನಮ್ಮ ವೇದಿಕೆ ಕಾನೂನುಬದ್ಧವಾಗಿ ಸಂಬಂಧಿತ ಸೇವೆಗಳನ್ನು ಬಳಸಲು ಸಮರ್ಥರಾದವರಿಗೆ ಉದ್ದೇಶಿಸಲಾಗಿದೆ. ಬುಕಿಂಗ್ ಮಾಡುವ ವ್ಯಕ್ತಿಯು ಆಸ್ತಿ ಮತ್ತು ಕಾನೂನಿನ ಅನ್ವಯವಾಗುವ ವಯಸ್ಸು, ಗುರುತು ಮತ್ತು ವಾಸದ ಅಗತ್ಯತೆಗಳನ್ನು ಪಾಲಿಸಬೇಕು.</p><p>ಮಕ್ಕಳ ವೈಯಕ್ತಿಕ ಮಾಹಿತಿಯನ್ನು ಸಂಸ್ಕರಿಸುವ ಸಂದರ್ಭದಲ್ಲಿ, ಸ್ಟೇವೃಕ್ಷ ಅನ್ವಯವಾಗುವ ಕಾನೂನು ಅಗತ್ಯತೆಗಳನ್ನು ಪಾಲಿಸುತ್ತದೆ. ಅಸಂಬಂಧಿತ ಉದ್ದೇಶಗಳಿಗಾಗಿ ಅತಿಥಿ ಮಾಹಿತಿಯನ್ನು ವ್ಯಾಪಾರಿಗಳು ಸಂಗ್ರಹಿಸಬಾರದು ಅಥವಾ ಬಳಸಬಾರದು.</p>
policyPrivacy10Title=ಮೂರನೇ ಪಕ್ಷದ ಸೇವೆಗಳು ಮತ್ತು ಲಿಂಕ್‌ಗಳು
policyPrivacy10Html=<p>ವೇದಿಕೆಯಲ್ಲಿ ಮೂರನೇ ಪಕ್ಷದ ವೆಬ್‌ಸೈಟ್‌ಗಳು ಮತ್ತು ಪಾವತಿ ಪೂರೈಕೆದಾರರ ಲಿಂಕ್‌ಗಳು ಅಥವಾ ಏಕೀಕರಣಗಳು ಇರಬಹುದು. ಅವರ ಗೋಪ್ಯತಾ ಅಭ್ಯಾಸಗಳು ಅವರದೇ ನೀತಿಗಳಿಂದ ನಿಯಂತ್ರಿಸಲ್ಪಡುತ್ತವೆ.</p><p>ಆ ಸೇವೆಗಳನ್ನು ಬಳಸುವಾಗ ಗ್ರಾಹಕರು ಮತ್ತು ವ್ಯಾಪಾರಿಗಳು ಸಂಬಂಧಿತ ಮೂರನೇ ಪಕ್ಷದ ಗೋಪ್ಯತಾ ಮಾಹಿತಿಯನ್ನು ಪರಿಶೀಲಿಸಬೇಕು.</p>
policyPrivacy11Title=ಈ ನೀತಿಯಲ್ಲಿ ಬದಲಾವಣೆಗಳು
policyPrivacy11Html=<p>ನಮ್ಮ ಸೇವೆಗಳು, ಡೇಟಾ ಅಭ್ಯಾಸಗಳು ಅಥವಾ ಕಾನೂನು ಬಾಧ್ಯತೆಗಳು ಬದಲಾದಂತೆ ನಾವು ಈ ಗೋಪ್ಯತಾ ನೀತಿಯನ್ನು ನವೀಕರಿಸಬಹುದು. ಪರಿಷ್ಕೃತ ಆವೃತ್ತಿಯನ್ನು ನವೀಕರಿಸಿದ ದಿನಾಂಕದೊಂದಿಗೆ ಪ್ರಕಟಿಸಲಾಗುತ್ತದೆ ಮತ್ತು ಅಗತ್ಯವಿದ್ದಲ್ಲಿ ಹೆಚ್ಚುವರಿ ಸೂಚನೆ ಅಥವಾ ಸಮ್ಮತಿಯನ್ನು ಒದಗಿಸಲಾಗುತ್ತದೆ.</p>
policyPrivacy12Title=ಸಂಪರ್ಕ ಮತ್ತು ಗೋಪ್ಯತಾ ದೂರುಗಳು
policyPrivacy12Html=<p>ಗೋಪ್ಯತೆಗೆ ಸಂಬಂಧಿಸಿದ ಪ್ರಶ್ನೆಗಳು ಅಥವಾ ವಿನಂತಿಗಳಿಗಾಗಿ ಸಂಪರ್ಕಿಸಿ:</p><div class='contact-card'><h3>ಸ್ಟೇವೃಕ್ಷ</h3><p><strong>ಇಮೇಲ್:</strong> <a href='mailto:admin@stayvriksha.in'>admin@stayvriksha.in</a></p><p><strong>ವಿಳಾಸ:</strong> 111, ಕಲ್ಪವೃಕ್ಷ ಕರೇಕಲ್ ಲೇಔಟ್, ರೈಲ್ವೇ ಸೇತುವೆ ಹತ್ತಿರ, ಕಲಬುರಗಿ, ಕರ್ನಾಟಕ – 585102</p></div>

# Policies - Cancellation & Refund
policyRefundTitle=ರದ್ದತಿ ಮತ್ತು ಮರುಪಾವತಿ ನೀತಿ
policyRefundSubtitle=ಬುಕಿಂಗ್ ರದ್ದತಿಗಳು, ಮರುಪಾವತಿ ವಿನಂತಿಗಳು, ಮರುನಿಗದಿ, ನೋ-ಶೋ ಮತ್ತು ಪಾವತಿ ಸಂಬಂಧಿತ ಸಮಸ್ಯೆಗಳನ್ನು ಹೇಗೆ ನಿರ್ವಹಿಸಲಾಗುತ್ತದೆ.
policyRefund1Title=ಉದ್ದೇಶ
policyRefund1Html=<p>ಬುಕಿಂಗ್ ರದ್ದತಿಗಳು, ಮರುಪಾವತಿ ವಿನಂತಿಗಳು, ಮರುನಿಗದಿ, ನೋ-ಶೋ ಮತ್ತು ಪಾವತಿ ಸಂಬಂಧಿತ ಸಮಸ್ಯೆಗಳನ್ನು ಸ್ಟೇವೃಕ್ಷ ನಲ್ಲಿ ಹೇಗೆ ನಿರ್ವಹಿಸಲಾಗುತ್ತದೆ ಎಂಬುದನ್ನು ಈ ನೀತಿ ವಿವರಿಸುತ್ತದೆ.</p><p>ಸ್ಟೇವೃಕ್ಷ ಗ್ರಾಹಕರನ್ನು ವಸತಿ ಪೂರೈಕೆದಾರರೊಂದಿಗೆ ಜೋಡಿಸುತ್ತದೆ. ರದ್ದತಿ ಮತ್ತು ಮರುಪಾವತಿ ಷರತ್ತುಗಳು ಆಸ್ತಿ, ಕೊಠಡಿ ಪ್ರಕಾರ, ಬುಕಿಂಗ್ ಯೋಜನೆ ಮತ್ತು ದಿನಾಂಕಗಳ ಆಧಾರದಲ್ಲಿ ಭಿನ್ನವಾಗಿರಬಹುದು.</p>
policyRefund2Title=ಆಸ್ತಿ-ನಿರ್ದಿಷ್ಟ ರದ್ದತಿ ನಿಯಮಗಳು
policyRefund2Html=<p>ಬುಕಿಂಗ್ ಮಾಡುವ ಮೊದಲು, ಸಂಬಂಧಿತ ಆಸ್ತಿ ಅಥವಾ ಬುಕಿಂಗ್ ಪುಟದಲ್ಲಿ ತೋರಿಸಿದ ರದ್ದತಿ ನೀತಿಯನ್ನು ಗ್ರಾಹಕರು ಪರಿಶೀಲಿಸಬೇಕು.</p><p>ಬುಕಿಂಗ್ ಈ ಕೆಳಗಿನಂತಿರಬಹುದು:</p><ul><li><strong>ಉಚಿತ ರದ್ದತಿ:</strong> ನಿಗದಿತ ಕಾಲಮಿತಿಯೊಳಗೆ, ಪ್ರದರ್ಶಿತ ಷರತ್ತುಗಳಿಗೆ ಒಳಪಟ್ಟು, ರದ್ದತಿ ಶುಲ್ಕವಿಲ್ಲದೆ ರದ್ದತಿಗೆ ಅನುಮತಿ ಇರುತ್ತದೆ.</li><li><strong>ಭಾಗಶಃ ಮರುಪಾವತಿ:</strong> ಪ್ರದರ್ಶಿತ ನೀತಿಯ ಪ್ರಕಾರ ಮೊತ್ತದ ಒಂದು ನಿರ್ದಿಷ್ಟ ಭಾಗವನ್ನು ಮರುಪಾವತಿಸಬಹುದು.</li><li><strong>ಮರುಪಾವತಿ ಇಲ್ಲ:</strong> ಸ್ವಂತ ಇಚ್ಛೆಯ ರದ್ದತಿಗೆ ಬುಕಿಂಗ್ ಮೊತ್ತವನ್ನು ಮರುಪಾವತಿಸಲಾಗುವುದಿಲ್ಲ, ವ್ಯಾಪಾರಿಯ ನೀತಿ ಅಥವಾ ಅನ್ವಯವಾಗುವ ಕಾನೂನು ಬೇರೆ ರೀತಿ ಒದಗಿಸದಿದ್ದರೆ.</li></ul><p>ಇವು ನೀತಿ ವರ್ಗಗಳು; ಪ್ರತಿ ಲಿಸ್ಟಿಂಗ್ ಮೂರೂ ಆಯ್ಕೆಗಳನ್ನು ನೀಡುತ್ತದೆ ಎಂಬ ಖಾತರಿ ಅಲ್ಲ. ಬುಕಿಂಗ್‌ಗೆ ಪ್ರದರ್ಶಿಸಲಾದ ನಿಜವಾದ ಷರತ್ತುಗಳು ಅನ್ವಯವಾಗುತ್ತವೆ.</p>
policyRefund3Title=ಬುಕಿಂಗ್ ಅನ್ನು ಹೇಗೆ ರದ್ದು ಮಾಡುವುದು
policyRefund3Html=<p>ಗ್ರಾಹಕರು ತಮ್ಮ ಖಾತೆಯಲ್ಲಿ ಲಭ್ಯವಿರುವ ರದ್ದತಿ ಆಯ್ಕೆಯನ್ನು ಬಳಸಬೇಕು ಅಥವಾ <a href='mailto:admin@stayvriksha.in'>admin@stayvriksha.in</a> ನಲ್ಲಿ ಸ್ಟೇವೃಕ್ಷ ಬೆಂಬಲವನ್ನು ಸಂಪರ್ಕಿಸಬೇಕು.</p><p>ವಿನಂತಿ ಸಲ್ಲಿಸುವಾಗ ಈ ಕೆಳಗಿನವನ್ನು ಒದಗಿಸಿ:</p><ul><li>ಬುಕಿಂಗ್ ಉಲ್ಲೇಖ ಸಂಖ್ಯೆ.</li><li>ನೋಂದಾಯಿತ ದೂರವಾಣಿ ಸಂಖ್ಯೆ ಅಥವಾ ಇಮೇಲ್ ವಿಳಾಸ.</li><li>ಆಸ್ತಿಯ ಹೆಸರು ಮತ್ತು ತಂಗುವ ದಿನಾಂಕಗಳು.</li><li>ವಿನಂತಿಸಿದಲ್ಲಿ ರದ್ದತಿಯ ಕಾರಣ.</li></ul><p>ಗ್ರಾಹಕರು ತಮ್ಮ ದಾಖಲೆಗಳಿಗಾಗಿ ರದ್ದತಿ ದೃಢೀಕರಣವನ್ನು ಇಟ್ಟುಕೊಳ್ಳಬೇಕು.</p><p>ರದ್ದತಿ ವಿನಂತಿಯು ಅನ್ವಯವಾಗುವ ಬುಕಿಂಗ್ ಷರತ್ತುಗಳಿಗೆ ಒಳಪಟ್ಟಿರುತ್ತದೆ. ದೃಢೀಕರಣ ನೀಡುವವರೆಗೆ ಬುಕಿಂಗ್ ರದ್ದಾಗಿದೆ ಎಂದು ಗ್ರಾಹಕರು ಭಾವಿಸಬಾರದು.</p>
policyRefund4Title=ಮರುಪಾವತಿ ಅರ್ಹತೆ
policyRefund4Html=<p>ಮರುಪಾವತಿ ಅರ್ಹತೆಯು ಆಸ್ತಿ-ನಿರ್ದಿಷ್ಟ ರದ್ದತಿ ನೀತಿ, ಬುಕಿಂಗ್ ಷರತ್ತುಗಳು, ರದ್ದತಿಯ ಸಮಯ ಮತ್ತು ಅನ್ವಯವಾಗುವ ಕಾನೂನನ್ನು ಅವಲಂಬಿಸಿದೆ.</p><p>ಮರುಪಾವತಿ ಅನುಮೋದನೆಯಾದಲ್ಲಿ, ಮರುಪಾವತಿ ಮೊತ್ತವನ್ನು ಅನ್ವಯವಾಗುವ ನೀತಿಯ ಪ್ರಕಾರ ಲೆಕ್ಕಹಾಕಲಾಗುತ್ತದೆ, ಅದರಲ್ಲಿ ಬುಕಿಂಗ್‌ಗೆ ಮೊದಲು ಬಹಿರಂಗಪಡಿಸಿದ ಅನುಮತಿಸಲಾದ ರದ್ದತಿ ಶುಲ್ಕಗಳು ಅಥವಾ ಮರುಪಾವತಿ ಮಾಡಲಾಗದ ಅಂಶಗಳು ಸೇರಿವೆ.</p><p>ವ್ಯಾಪಾರಿಯು ದೃಢೀಕೃತ ಬುಕಿಂಗ್ ಅನ್ನು ರದ್ದು ಮಾಡಿದಾಗ, ಬುಕ್ ಮಾಡಿದ ವಸತಿಯನ್ನು ಒದಗಿಸಲು ಸಾಧ್ಯವಾಗದಿದ್ದಾಗ, ಅಥವಾ ಸಂಬಂಧಿತ ನೀತಿ ಅಥವಾ ಕಾನೂನಿನ ಅಡಿಯಲ್ಲಿ ಬೇರೆ ಮರುಪಾವತಿ ಹಕ್ಕು ಅನ್ವಯವಾದಾಗಲೂ ಮರುಪಾವತಿಯನ್ನು ಪರಿಗಣಿಸಬಹುದು.</p>
policyRefund5Title=ವ್ಯಾಪಾರಿ ಪ್ರಾರಂಭಿಸಿದ ರದ್ದತಿಗಳು
policyRefund5Html=<p>ವ್ಯಾಪಾರಿಯು ದೃಢೀಕೃತ ಬುಕಿಂಗ್ ಅನ್ನು ರದ್ದು ಮಾಡಿದರೆ ಅಥವಾ ಬುಕ್ ಮಾಡಿದ ವಸತಿಯನ್ನು ಒದಗಿಸಲು ಸಾಧ್ಯವಾಗದಿದ್ದರೆ, ಲಭ್ಯವಿರುವ ಪರಿಹಾರ ಪ್ರಕ್ರಿಯೆಯಲ್ಲಿ ಸ್ಟೇವೃಕ್ಷ ಗ್ರಾಹಕರಿಗೆ ನೆರವು ನೀಡುತ್ತದೆ.</p><p>ಸಂದರ್ಭಗಳು ಮತ್ತು ಅನ್ವಯವಾಗುವ ಷರತ್ತುಗಳ ಆಧಾರದಲ್ಲಿ, ಇದರಲ್ಲಿ ಮರುಪಾವತಿ ಅಥವಾ ಗ್ರಾಹಕರು ಒಪ್ಪಿಕೊಂಡ ಪರ್ಯಾಯ ವ್ಯವಸ್ಥೆ ಸೇರಬಹುದು.</p><p>ರದ್ದತಿಗಳು ಅಥವಾ ಪ್ರಮುಖ ಬದಲಾವಣೆಗಳ ಬಗ್ಗೆ ವ್ಯಾಪಾರಿಗಳು ತಕ್ಷಣ ಸ್ಟೇವೃಕ್ಷ ಗೆ ತಿಳಿಸಬೇಕು ಮತ್ತು ಬಾಧಿತ ಬುಕಿಂಗ್‌ಗಳನ್ನು ಪರಿಹರಿಸುವಲ್ಲಿ ಸಹಕರಿಸಬೇಕು.</p>
policyRefund6Title=ನೋ-ಶೋ ಮತ್ತು ತಡವಾದ ಆಗಮನ
policyRefund6Html=<p>ಗ್ರಾಹಕನು ಅನ್ವಯವಾಗುವ ಚೆಕ್-ಇನ್ ಅವಧಿಯೊಳಗೆ ಬಾರದಿದ್ದರೆ ಮತ್ತು ವ್ಯಾಪಾರಿ ಒಪ್ಪಿಕೊಂಡ ವ್ಯವಸ್ಥೆಯನ್ನು ಮಾಡದಿದ್ದರೆ ಅದು ನೋ-ಶೋ ಆಗುತ್ತದೆ.</p><p>ನೋ-ಶೋ ಶುಲ್ಕಗಳು ಮತ್ತು ಮರುಪಾವತಿ ಅರ್ಹತೆಯು ಆ ಬುಕಿಂಗ್‌ಗೆ ಬಹಿರಂಗಪಡಿಸಿದ ರದ್ದತಿ ಮತ್ತು ನೋ-ಶೋ ಷರತ್ತುಗಳನ್ನು ಅವಲಂಬಿಸಿರುತ್ತದೆ.</p><p>ತಡವಾಗಿ ಬರುವ ನಿರೀಕ್ಷೆಯಿರುವ ಗ್ರಾಹಕರು ಮೊದಲೇ ಆಸ್ತಿಯನ್ನು ಸಂಪರ್ಕಿಸಬೇಕು. ತಡವಾದ ಆಗಮನವು ಕಾಯ್ದಿರಿಸುವಿಕೆಯನ್ನು ಸ್ವಯಂಚಾಲಿತವಾಗಿ ವಿಸ್ತರಿಸುವುದಿಲ್ಲ ಅಥವಾ ಮರುಪಾವತಿಯನ್ನು ಖಾತರಿಪಡಿಸುವುದಿಲ್ಲ.</p>
policyRefund7Title=ಬೇಗನೆ ಚೆಕ್-ಔಟ್ ಮತ್ತು ಕಡಿತಗೊಂಡ ತಂಗುವಿಕೆ
policyRefund7Html=<p>ಗ್ರಾಹಕನು ಬುಕ್ ಮಾಡಿದ ನಿರ್ಗಮನ ದಿನಾಂಕಕ್ಕಿಂತ ಮೊದಲು ಚೆಕ್-ಔಟ್ ಮಾಡಿದರೆ, ಬಳಸದ ರಾತ್ರಿಗಳಿಗೆ ಯಾವುದೇ ಮರುಪಾವತಿ ಇರುತ್ತದೆಯೇ ಎಂಬುದು ಆಸ್ತಿ-ನಿರ್ದಿಷ್ಟ ನೀತಿ ಮತ್ತು ಅನ್ವಯವಾಗುವ ಕಾನೂನನ್ನು ಅವಲಂಬಿಸಿದೆ.</p><p>ಪರಿಶೀಲನೆಗಾಗಿ ಗ್ರಾಹಕರು ವ್ಯಾಪಾರಿ ಮತ್ತು ಸ್ಟೇವೃಕ್ಷ ಬೆಂಬಲವನ್ನು ಸಂಪರ್ಕಿಸಬೇಕು.</p>
policyRefund8Title=ಮರುಪಾವತಿ ಪ್ರಕ್ರಿಯೆ
policyRefund8Html=<p>ಮರುಪಾವತಿ ಅನುಮೋದನೆಯಾದ ನಂತರ, ಸ್ಟೇವೃಕ್ಷ ಅಥವಾ ಸಂಬಂಧಿತ ಪಾವತಿ ಸೇವಾ ಪೂರೈಕೆದಾರರು ಅನ್ವಯವಾಗುವ ಪಾವತಿ ಪ್ರಕ್ರಿಯೆಯ ಪ್ರಕಾರ ಪ್ರಕ್ರಿಯೆಯನ್ನು ಪ್ರಾರಂಭಿಸುತ್ತಾರೆ.</p><p>ಗ್ರಾಹಕರ ಖಾತೆಯಲ್ಲಿ ಹಣ ಕಾಣಿಸಿಕೊಳ್ಳಲು ತಗಲುವ ಸಮಯವು ಪಾವತಿ ವಿಧಾನ, ಬ್ಯಾಂಕ್, ಕಾರ್ಡ್ ನೀಡುವ ಸಂಸ್ಥೆ ಅಥವಾ ಪಾವತಿ ಪೂರೈಕೆದಾರರನ್ನು ಅವಲಂಬಿಸಬಹುದು.</p><p>ಪ್ರಕಟಿತ ಪ್ರಕ್ರಿಯೆ ಕಾಲಮಿತಿ: [ನಿಮ್ಮ ಪರಿಶೀಲಿತ ಮರುಪಾವತಿ ಆರಂಭ ಕಾಲಮಿತಿ ಮತ್ತು ಯಾವುದೇ ಸಂಬಂಧಿತ ವಿನಾಯಿತಿಗಳನ್ನು ನಮೂದಿಸಿ.]</p><p>ತಿಳಿಸಿದ ಅವಧಿಯೊಳಗೆ ಮರುಪಾವತಿ ಕಾಣಿಸದಿದ್ದರೆ, ಗ್ರಾಹಕರು ತಮ್ಮ ಬುಕಿಂಗ್ ಉಲ್ಲೇಖ ಮತ್ತು ವಹಿವಾಟು ವಿವರಗಳೊಂದಿಗೆ <a href='mailto:admin@stayvriksha.in'>admin@stayvriksha.in</a> ಅನ್ನು ಸಂಪರ್ಕಿಸಬೇಕು.</p>
policyRefund9Title=ವಿಫಲ, ನಕಲಿ ಅಥವಾ ಬಾಕಿ ಪಾವತಿಗಳು
policyRefund9Html=<p>ಹಣವನ್ನು ಕಡಿತಗೊಳಿಸಲಾಗಿದ್ದರೂ ಬುಕಿಂಗ್ ದೃಢೀಕೃತವಾಗದಿದ್ದರೆ, ಅಥವಾ ನಕಲಿ ಪಾವತಿ ಮಾಡಲಾಗಿದೆ ಎಂದು ತೋರಿದರೆ, ಗ್ರಾಹಕರು ಬೆಂಬಲವನ್ನು ಸಂಪರ್ಕಿಸಿ ವಹಿವಾಟು ಉಲ್ಲೇಖವನ್ನು ಒದಗಿಸಬೇಕು.</p><p>ಸ್ಟೇವೃಕ್ಷ ಸಂಬಂಧಿತ ಪಾವತಿ ಪೂರೈಕೆದಾರರೊಂದಿಗೆ ವಹಿವಾಟನ್ನು ಪರಿಶೀಲಿಸಿ ಪರಿಹಾರವನ್ನು ತಿಳಿಸುತ್ತದೆ.</p><p>ಬಾಕಿ ಇರುವ ಪಾವತಿ ಅಗತ್ಯವಾಗಿ ಪೂರ್ಣಗೊಂಡ ಬುಕಿಂಗ್ ಅಲ್ಲ. ಸಾಧ್ಯವಿದ್ದಲ್ಲಿ, ಬುಕಿಂಗ್ ಸ್ಥಿತಿಯನ್ನು ಪರಿಶೀಲಿಸುವವರೆಗೆ ಗ್ರಾಹಕರು ಮತ್ತೊಂದು ಪಾವತಿ ಮಾಡುವುದನ್ನು ತಪ್ಪಿಸಬೇಕು.</p>
policyRefund10Title=ಮರುಪಾವತಿ ವಿಧಾನ
policyRefund10Html=<p>ಅನುಮೋದಿತ ಮರುಪಾವತಿಗಳನ್ನು ಸಾಮಾನ್ಯವಾಗಿ ಮೂಲ ಪಾವತಿ ವಿಧಾನಕ್ಕೆ ಪ್ರಕ್ರಿಯೆಗೊಳಿಸಲಾಗುತ್ತದೆ, ಅದು ಪಾವತಿ ಪೂರೈಕೆದಾರರಿಂದ ಬೆಂಬಲಿತವಾಗಿದ್ದಲ್ಲಿ ಮತ್ತು ಕಾನೂನಿನಿಂದ ಅನುಮತಿಸಲಾದಲ್ಲಿ.</p><p>ಆ ವಿಧಾನ ಲಭ್ಯವಿಲ್ಲದಿದ್ದರೆ, ಯಾವುದೇ ಪರ್ಯಾಯ ಮರುಪಾವತಿ ವ್ಯವಸ್ಥೆಯನ್ನು ಪಾವತಿ ಪೂರೈಕೆದಾರರ ಅಗತ್ಯತೆಗಳು ಮತ್ತು ಅನ್ವಯವಾಗುವ ಕಾನೂನಿನ ಪ್ರಕಾರ ನಿರ್ವಹಿಸಲಾಗುತ್ತದೆ.</p>
policyRefund11Title=ವಿವಾದಗಳು ಮತ್ತು ಮೇಲ್ಮನವಿಗಳು
policyRefund11Html=<p>ಗ್ರಾಹಕರು ರದ್ದತಿ ಶುಲ್ಕ ಅಥವಾ ಮರುಪಾವತಿ ನಿರ್ಧಾರದೊಂದಿಗೆ ಒಪ್ಪದಿದ್ದರೆ, ಬುಕಿಂಗ್ ಉಲ್ಲೇಖ ಮತ್ತು ಪೂರಕ ಮಾಹಿತಿಯೊಂದಿಗೆ <a href='mailto:admin@stayvriksha.in'>admin@stayvriksha.in</a> ಅನ್ನು ಸಂಪರ್ಕಿಸಬಹುದು.</p><p>ಸ್ಟೇವೃಕ್ಷ ವಿನಂತಿಯನ್ನು ಪರಿಶೀಲಿಸಿ, ಅಗತ್ಯವಿದ್ದಲ್ಲಿ ವ್ಯಾಪಾರಿ ಅಥವಾ ಪಾವತಿ ಪೂರೈಕೆದಾರರೊಂದಿಗೆ ಸಮಾಲೋಚಿಸಿ, ಅನ್ವಯವಾಗುವ ಕಾಲಮಿತಿಯೊಳಗೆ ಫಲಿತಾಂಶವನ್ನು ತಿಳಿಸುತ್ತದೆ.</p><p>ಈ ನೀತಿಯಲ್ಲಿನ ಯಾವುದೂ ಅನ್ವಯವಾಗುವ ಕಾನೂನಿನ ಅಡಿಯಲ್ಲಿ ಲಭ್ಯವಿರುವ ಹಕ್ಕುಗಳು ಅಥವಾ ಪರಿಹಾರಗಳನ್ನು ಮಿತಿಗೊಳಿಸುವುದಿಲ್ಲ.</p>
policyRefund12Title=ನಮ್ಮನ್ನು ಸಂಪರ್ಕಿಸಿ
policyRefund12Html=<p>ರದ್ದತಿ ಅಥವಾ ಮರುಪಾವತಿ ಸಹಾಯಕ್ಕಾಗಿ:</p><div class='contact-card'><h3>ಸ್ಟೇವೃಕ್ಷ ಬೆಂಬಲ</h3><p><strong>ಇಮೇಲ್:</strong> <a href='mailto:admin@stayvriksha.in'>admin@stayvriksha.in</a></p><p><strong>ವಿಳಾಸ:</strong> 111, ಕಲ್ಪವೃಕ್ಷ ಕರೇಕಲ್ ಲೇಔಟ್, ರೈಲ್ವೇ ಸೇತುವೆ ಹತ್ತಿರ, ಕಲಬುರಗಿ, ಕರ್ನಾಟಕ – 585102</p></div>

# Policies - Vendor Agreement
policyVendorTitle=ವ್ಯಾಪಾರಿ ಒಪ್ಪಂದ
policyVendorSubtitle=ವೇದಿಕೆಯಲ್ಲಿ ಆಸ್ತಿ ಮಾಲೀಕರು, ವ್ಯವಸ್ಥಾಪಕರು ಮತ್ತು ಅಧಿಕೃತ ವಸತಿ ನಿರ್ವಾಹಕರ ಭಾಗವಹಿಸುವಿಕೆಯನ್ನು ನಿಯಂತ್ರಿಸುವ ಒಪ್ಪಂದ.
policyVendorKp1=ಈ ವ್ಯಾಪಾರಿ ಒಪ್ಪಂದವು ಸ್ಟೇವೃಕ್ಷ ವೇದಿಕೆಯಲ್ಲಿ ಆಸ್ತಿ ಮಾಲೀಕರು, ವ್ಯವಸ್ಥಾಪಕರು ಮತ್ತು ಅಧಿಕೃತ ವಸತಿ ನಿರ್ವಾಹಕರ (“ವ್ಯಾಪಾರಿ”) ಭಾಗವಹಿಸುವಿಕೆಯನ್ನು ನಿಯಂತ್ರಿಸುತ್ತದೆ.
policyVendorKp2=ಆಸ್ತಿಯನ್ನು ನೋಂದಣಿ ಮಾಡುವುದರ ಮೂಲಕ ಅಥವಾ ಅನ್ವಯವಾಗುವ ವ್ಯಾಪಾರಿ ಷರತ್ತುಗಳನ್ನು ಎಲೆಕ್ಟ್ರಾನಿಕ್ ಆಗಿ ಸ್ವೀಕರಿಸುವುದರ ಮೂಲಕ, ವ್ಯಾಪಾರಿಯು ಈ ಒಪ್ಪಂದ, ಸ್ಟೇವೃಕ್ಷ ನ ನಿಯಮಗಳು ಮತ್ತು ಷರತ್ತುಗಳು ಹಾಗೂ ಅನ್ವಯವಾಗುವ ಕಾನೂನುಗಳನ್ನು ಪಾಲಿಸಲು ಒಪ್ಪುತ್ತಾನೆ.
policyVendor1Title=ಅರ್ಹತೆ ಮತ್ತು ನೋಂದಣಿ
policyVendor1Html=<p>ಅರ್ಹ ಹೋಟೆಲ್‌ಗಳು, ಹಾಸ್ಟೆಲ್‌ಗಳು, PG ವಸತಿಗಳು, ಸರ್ವಿಸ್ ಅಪಾರ್ಟ್‌ಮೆಂಟ್‌ಗಳು ಮತ್ತು ಬಾಡಿಗೆ ಆಸ್ತಿಗಳನ್ನು ಪಟ್ಟಿ ಮಾಡಲು ವ್ಯಾಪಾರಿಗಳು ಅರ್ಜಿ ಸಲ್ಲಿಸಬಹುದು.</p><p>ನೋಂದಣಿ ಸಮಯದಲ್ಲಿ ಸ್ಟೇವೃಕ್ಷ ಈ ಕೆಳಗಿನವನ್ನು ಕೇಳಬಹುದು:</p><ul><li>ಮಾಲೀಕ ಅಥವಾ ಅಧಿಕೃತ ಪ್ರತಿನಿಧಿಯ ಸರ್ಕಾರದಿಂದ ನೀಡಲಾದ ಗುರುತು ಮತ್ತು ವಿಳಾಸ ದಾಖಲೆಗಳು.</li><li>ಮಾಲೀಕತ್ವ, ಗುತ್ತಿಗೆ, ನಿರ್ವಹಣಾ ಅಧಿಕಾರ ಅಥವಾ ಆಸ್ತಿಯನ್ನು ನಡೆಸಲು ಮತ್ತು ಪಟ್ಟಿ ಮಾಡಲು ಅನುಮತಿಯ ಪುರಾವೆ.</li><li>ಅನ್ವಯವಾಗುವ ಪರವಾನಗಿಗಳು, ನೋಂದಣಿಗಳು, ಅನುಮತಿಗಳು ಮತ್ತು ಸುರಕ್ಷತಾ ಅನುಮೋದನೆಗಳು.</li><li>ಅಗತ್ಯವಿದ್ದಲ್ಲಿ ವ್ಯಾಪಾರ, PAN, GST ಮತ್ತು ಬ್ಯಾಂಕ್ ಖಾತೆ ವಿವರಗಳು.</li><li>ನಿಖರವಾದ ಆಸ್ತಿ ಮಾಹಿತಿ, ಕೊಠಡಿ ವಿವರಗಳು, ಛಾಯಾಚಿತ್ರಗಳು, ಸೌಲಭ್ಯಗಳು ಮತ್ತು ಬೆಲೆ.</li></ul><p>ನೋಂದಣಿ ಮತ್ತು ದಾಖಲೆ ಸಲ್ಲಿಕೆ ಸ್ವಯಂಚಾಲಿತವಾಗಿ ಅನುಮೋದನೆಯ ಖಾತರಿ ನೀಡುವುದಿಲ್ಲ. ಸಮಂಜಸವಾದ ಕಾರ್ಯಾಚರಣೆ, ಪರಿಶೀಲನೆ, ಸುರಕ್ಷತೆ ಅಥವಾ ಅನುಸರಣೆ ಕಾರಣಗಳಿಗಾಗಿ ಸ್ಟೇವೃಕ್ಷ ಹೆಚ್ಚುವರಿ ಮಾಹಿತಿಯನ್ನು ಕೇಳಬಹುದು ಅಥವಾ ಲಿಸ್ಟಿಂಗ್ ಅನ್ನು ತಿರಸ್ಕರಿಸಬಹುದು.</p>
policyVendor2Title=ಲಿಸ್ಟಿಂಗ್ ನಿಖರತೆ
policyVendor2Html=<p>ಪ್ರತಿ ಲಿಸ್ಟಿಂಗ್ ನಿಖರ, ಪೂರ್ಣ, ಇತ್ತೀಚಿನ ಮತ್ತು ದಾರಿತಪ್ಪಿಸದಂತಿರುವುದನ್ನು ವ್ಯಾಪಾರಿ ಖಚಿತಪಡಿಸಿಕೊಳ್ಳಬೇಕು.</p><p>ಈ ಕೆಳಗಿನವುಗಳ ಬಗ್ಗೆ ಸರಿಯಾದ ಮಾಹಿತಿಯನ್ನು ನಿರ್ವಹಿಸುವ ಜವಾಬ್ದಾರಿ ವ್ಯಾಪಾರಿಯದ್ದು:</p><ul><li>ಆಸ್ತಿಯ ಹೆಸರು, ಸ್ಥಳ ಮತ್ತು ಸಂಪರ್ಕ ವಿವರಗಳು.</li><li>ಕೊಠಡಿ ಪ್ರಕಾರಗಳು, ಹಾಸಿಗೆ ವಿನ್ಯಾಸ, ವಾಸದ ಮಿತಿಗಳು ಮತ್ತು ಲಭ್ಯತೆ.</li><li>ಸೌಲಭ್ಯಗಳು, ವೈಶಿಷ್ಟ್ಯಗಳು, ಪ್ರವೇಶ ಅನುಕೂಲತೆಗಳು ಮತ್ತು ಆಸ್ತಿಯ ಛಾಯಾಚಿತ್ರಗಳು.</li><li>ದರಗಳು, ತೆರಿಗೆಗಳು, ಕಡ್ಡಾಯ ಶುಲ್ಕಗಳು, ಠೇವಣಿಗಳು ಮತ್ತು ಇತರ ಅನ್ವಯವಾಗುವ ಶುಲ್ಕಗಳು.</li><li>ಚೆಕ್-ಇನ್/ಚೆಕ್-ಔಟ್ ಸಮಯಗಳು, ಗುರುತಿನ ಅಗತ್ಯತೆಗಳು ಮತ್ತು ಮನೆ ನಿಯಮಗಳು.</li><li>ರದ್ದತಿ, ಮರುಪಾವತಿ, ಮರುನಿಗದಿ ಮತ್ತು ನೋ-ಶೋ ಷರತ್ತುಗಳು.</li></ul><p>ಪ್ರಮುಖ ಬದಲಾವಣೆಗಳನ್ನು ತಕ್ಷಣ ನವೀಕರಿಸಬೇಕು. ಪೂರೈಸಲು ಸಾಧ್ಯವಿಲ್ಲದ ಸೌಲಭ್ಯಗಳು, ಲಭ್ಯತೆ ಅಥವಾ ಬೆಲೆಗಳನ್ನು ವ್ಯಾಪಾರಿಗಳು ಜಾಹೀರಾತು ಮಾಡಬಾರದು.</p>
policyVendor3Title=ಕಾನೂನು ಅನುಸರಣೆ ಮತ್ತು ಆಸ್ತಿ ಮಾನದಂಡಗಳು
policyVendor3Html=<p>ಆಸ್ತಿ ಮತ್ತು ಅದರ ಕಾರ್ಯಾಚರಣೆಗಳಿಗೆ ಅನ್ವಯವಾಗುವ ಎಲ್ಲಾ ಅನುಮೋದನೆಗಳು ಮತ್ತು ನೋಂದಣಿಗಳನ್ನು ಪಡೆಯುವುದು ಮತ್ತು ನಿರ್ವಹಿಸುವುದು ವ್ಯಾಪಾರಿಯ ಜವಾಬ್ದಾರಿಯಾಗಿದೆ.</p><p>ಆಸ್ತಿ ಮತ್ತು ಅಧಿಕಾರ ವ್ಯಾಪ್ತಿಯ ಆಧಾರದಲ್ಲಿ, ಇದರಲ್ಲಿ ಸಂಬಂಧಿತ ಸ್ಥಳೀಯ ವಸತಿ, ವ್ಯಾಪಾರ, ಪೌರ, ಪೊಲೀಸ್, ಅಗ್ನಿ ಸುರಕ್ಷತೆ, ಪ್ರವಾಸೋದ್ಯಮ ಮತ್ತು ತೆರಿಗೆ ಅಗತ್ಯತೆಗಳು ಸೇರಬಹುದು.</p><p>ಸೂಕ್ತವಾದ ನೈರ್ಮಲ್ಯ, ಭದ್ರತೆ, ಅಗ್ನಿ ಸುರಕ್ಷತೆ, ರಚನಾತ್ಮಕ ಸುರಕ್ಷತೆ ಮತ್ತು ಕಾನೂನುಬದ್ಧ ಕಾರ್ಯಾಚರಣಾ ಪರಿಸ್ಥಿತಿಗಳನ್ನು ವ್ಯಾಪಾರಿ ನಿರ್ವಹಿಸಬೇಕು.</p><p>ದಾಖಲೆಗಳು ಅಥವಾ ಒಂದು ಲಿಸ್ಟಿಂಗ್ ಅನ್ನು ಸ್ಟೇವೃಕ್ಷ ಪರಿಶೀಲಿಸುವುದು ಕಾನೂನಿನಿಂದ ವಿಧಿಸಲಾದ ತಪಾಸಣೆ, ಪ್ರಮಾಣೀಕರಣ ಅಥವಾ ಬಾಧ್ಯತೆಗಳಿಗೆ ಪರ್ಯಾಯವಲ್ಲ.</p>
policyVendor4Title=ಬುಕಿಂಗ್ ಮತ್ತು ಅತಿಥಿ ಸೇವೆ
policyVendor4Html=<p>ವ್ಯಾಪಾರಿ ಈ ಕೆಳಗಿನವನ್ನು ಮಾಡಬೇಕು:</p><ul><li>ಜಾಹೀರಾತು ಷರತ್ತುಗಳಿಗೆ ಅನುಸಾರ ದೃಢೀಕೃತ ಬುಕಿಂಗ್‌ಗಳನ್ನು ಪಾಲಿಸುವುದು.</li><li>ಬುಕ್ ಮಾಡಿದ ವಸತಿ, ಕೊಠಡಿ ವರ್ಗ ಮತ್ತು ಬಹಿರಂಗಪಡಿಸಿದ ಸೌಲಭ್ಯಗಳನ್ನು ಒದಗಿಸುವುದು.</li><li>ನಿಖರವಾದ ಲಭ್ಯತೆಯನ್ನು ನಿರ್ವಹಿಸುವುದು ಮತ್ತು ಹೊಂದಿಕೆಯಾಗದ ಕಾಯ್ದಿರಿಸುವಿಕೆಗಳನ್ನು ಸ್ವೀಕರಿಸುವುದನ್ನು ತಪ್ಪಿಸುವುದು.</li><li>ಚೆಕ್-ಇನ್ ಸೂಚನೆಗಳು ಮತ್ತು ಪ್ರಮುಖ ಬದಲಾವಣೆಗಳನ್ನು ಸಮಯೋಚಿತವಾಗಿ ತಿಳಿಸುವುದು.</li><li>ಅತಿಥಿಗಳೊಂದಿಗೆ ನ್ಯಾಯಯುತವಾಗಿ ಮತ್ತು ಗೌರವದಿಂದ ವರ್ತಿಸುವುದು.</li><li>ದೂರುಗಳನ್ನು ತಕ್ಷಣ ನಿರ್ವಹಿಸುವುದು ಮತ್ತು ವಿಷಯ ಮೇಲ್ಮಟ್ಟಕ್ಕೆ ಬಂದಾಗ ಸ್ಟೇವೃಕ್ಷ ಜೊತೆ ಸಹಕರಿಸುವುದು.</li><li>ದೃಢೀಕೃತ ಬುಕಿಂಗ್ ಅನ್ನು ಪೂರೈಸಲು ಸಾಧ್ಯವಾಗದಿದ್ದರೆ ತಕ್ಷಣ ಸ್ಟೇವೃಕ್ಷ ಗೆ ತಿಳಿಸುವುದು.</li></ul><p>ಬಹಿರಂಗಪಡಿಸದ ಕಡ್ಡಾಯ ಶುಲ್ಕಗಳನ್ನು ವ್ಯಾಪಾರಿ ವಿಧಿಸಬಾರದು ಅಥವಾ ಸೂಕ್ತ ಕಾನೂನು ಆಧಾರ ಮತ್ತು ಗ್ರಾಹಕರ ಅಗತ್ಯ ಸಮ್ಮತಿಯಿಲ್ಲದೆ ಒಪ್ಪಿದ ಬುಕಿಂಗ್ ಷರತ್ತುಗಳನ್ನು ಪ್ರಮುಖವಾಗಿ ಬದಲಾಯಿಸಬಾರದು.</p>
policyVendor5Title=ಬೆಲೆ, ಕಮಿಷನ್ ಮತ್ತು ಪಾವತಿಗಳು
policyVendor5Html=<p>ಅನ್ವಯವಾಗುವ ಕಮಿಷನ್, ವೇದಿಕೆ ಸೇವಾ ಶುಲ್ಕ, ತೆರಿಗೆಗಳು, ಇತ್ಯರ್ಥ ವೇಳಾಪಟ್ಟಿ ಮತ್ತು ಪಾವತಿ ಷರತ್ತುಗಳನ್ನು ವ್ಯಾಪಾರಿ ಒಪ್ಪಿಕೊಂಡ ವಾಣಿಜ್ಯ ಷರತ್ತುಗಳಲ್ಲಿ ನಿಗದಿಪಡಿಸಲಾಗುತ್ತದೆ ಎಂದು ವ್ಯಾಪಾರಿ ಒಪ್ಪುತ್ತಾನೆ.</p><ul><li><strong>ಕಮಿಷನ್ ದರ:</strong> [ಒಪ್ಪಿದ ದರ ಅಥವಾ ಸ್ವೀಕೃತ ವಾಣಿಜ್ಯ ವೇಳಾಪಟ್ಟಿಯ ಉಲ್ಲೇಖವನ್ನು ನಮೂದಿಸಿ.]</li><li><strong>ಇತ್ಯರ್ಥ ಕಾಲಮಿತಿ:</strong> [ಒಪ್ಪಿದ ಕಾಲಮಿತಿ ಮತ್ತು ಯಾವುದೇ ಅನ್ವಯವಾಗುವ ಷರತ್ತುಗಳನ್ನು ನಮೂದಿಸಿ.]</li><li><strong>ಇತ್ಯರ್ಥ ವಿಧಾನ:</strong> [ಬೆಂಬಲಿತ ಇತ್ಯರ್ಥ ವಿಧಾನವನ್ನು ನಮೂದಿಸಿ.]</li></ul><p>ಅನ್ವಯವಾಗುವ ಒಪ್ಪಂದ ಮತ್ತು ಕಾನೂನಿನಿಂದ ಅಧಿಕೃತಗೊಳಿಸಲಾದಂತೆ, ಬುಕಿಂಗ್ ಆದಾಯದಿಂದ ಒಪ್ಪಿದ ಶುಲ್ಕಗಳು ಮತ್ತು ಸೂಕ್ತವಾಗಿ ವಿಧಿಸಬಹುದಾದ ಇತರ ಮೊತ್ತಗಳನ್ನು ಸ್ಟೇವೃಕ್ಷ ಕಡಿತಗೊಳಿಸಬಹುದು.</p><p>ಇತ್ಯರ್ಥಗಳು ಪಾವತಿ ಪೂರೈಕೆದಾರರ ಪ್ರಕ್ರಿಯೆ, ಮರುಪಾವತಿಗಳು, ಚಾರ್ಜ್‌ಬ್ಯಾಕ್‌ಗಳು, ವಂಚನೆ ಪರಿಶೀಲನೆಗಳು, ಬಗೆಹರಿಯದ ಬುಕಿಂಗ್ ವಿವಾದಗಳು ಮತ್ತು ಅನ್ವಯವಾಗುವ ಕಾನೂನು ಅಗತ್ಯತೆಗಳಿಗೆ ಒಳಪಟ್ಟಿರಬಹುದು. ಯಾವುದೇ ತಡೆಹಿಡಿಯುವಿಕೆಯನ್ನು ಒಪ್ಪಿದ ಷರತ್ತುಗಳು ಮತ್ತು ಅನ್ವಯವಾಗುವ ಕಾನೂನಿನ ಪ್ರಕಾರ ನಿರ್ವಹಿಸಬೇಕು.</p><p>ಅನ್ವಯವಾಗುವ ತೆರಿಗೆ ವರದಿ ಮತ್ತು ಪಾವತಿ ಬಾಧ್ಯತೆಗಳಿಗೆ ವ್ಯಾಪಾರಿಗಳು ಜವಾಬ್ದಾರರಾಗಿರುತ್ತಾರೆ, ಕಾನೂನು ಬಾಧ್ಯತೆಯನ್ನು ಸ್ಟೇವೃಕ್ಷ ಅಥವಾ ಇನ್ನೊಂದು ಪಕ್ಷದ ಮೇಲೆ ವಿಧಿಸದಿದ್ದರೆ.</p>
policyVendor6Title=ರದ್ದತಿಗಳು, ಮರುಪಾವತಿಗಳು ಮತ್ತು ನೋ-ಶೋ
policyVendor6Html=<p>ಪ್ರತಿ ಅನ್ವಯವಾಗುವ ಲಿಸ್ಟಿಂಗ್‌ಗೂ ಸ್ಪಷ್ಟವಾದ ಮತ್ತು ನಿಖರವಾದ ರದ್ದತಿ, ಮರುಪಾವತಿ, ಮರುನಿಗದಿ ಮತ್ತು ನೋ-ಶೋ ಷರತ್ತುಗಳನ್ನು ವ್ಯಾಪಾರಿಗಳು ನಿಗದಿಪಡಿಸಬೇಕು.</p><p>ಈ ಷರತ್ತುಗಳನ್ನು ಬುಕಿಂಗ್ ದೃಢೀಕರಣಕ್ಕೆ ಮೊದಲು ಗ್ರಾಹಕರಿಗೆ ಲಭ್ಯವಾಗುವಂತೆ ಮಾಡಬೇಕು.</p><p>ವ್ಯಾಪಾರಿಗಳು ಸ್ವೀಕೃತ ನೀತಿ ಮತ್ತು ಅನ್ವಯವಾಗುವ ಕಾನೂನನ್ನು ಪಾಲಿಸಬೇಕು, ರದ್ದತಿ ವಿನಂತಿಗಳ ಬಗ್ಗೆ ತಕ್ಷಣ ಸ್ಟೇವೃಕ್ಷ ಗೆ ತಿಳಿಸಬೇಕು ಮತ್ತು ಮರುಪಾವತಿ ಪ್ರಕ್ರಿಯೆಯಲ್ಲಿ ಸಹಕರಿಸಬೇಕು.</p><p>ವ್ಯಾಪಾರಿಯು ದೃಢೀಕೃತ ಬುಕಿಂಗ್ ಅನ್ನು ರದ್ದು ಮಾಡಿದರೆ ಅಥವಾ ಅತಿಥಿಗೆ ವಸತಿ ಒದಗಿಸಲು ಸಾಧ್ಯವಾಗದಿದ್ದರೆ, ಅವನು ಸ್ಟೇವೃಕ್ಷ ಗೆ ತಿಳಿಸಿ ಸೂಕ್ತ ಪರಿಹಾರವನ್ನು ಏರ್ಪಡಿಸುವಲ್ಲಿ ಸಹಕರಿಸಬೇಕು.</p>
policyVendor7Title=ಗ್ರಾಹಕ ಮಾಹಿತಿ ಮತ್ತು ಗೋಪ್ಯತೆ
policyVendor7Html=<p>ಬುಕಿಂಗ್, ಅತಿಥಿ ಸಂವಹನ, ಚೆಕ್-ಇನ್, ಭದ್ರತೆ, ಕಾನೂನು ಅನುಸರಣೆ ಮತ್ತು ಸಂಬಂಧಿತ ಸೇವಾ ವಿತರಣೆಗೆ ಸಂಬಂಧಿಸಿದ ಕಾನೂನುಬದ್ಧ ಉದ್ದೇಶಗಳಿಗಾಗಿ ಮಾತ್ರ ವ್ಯಾಪಾರಿಗಳು ಗ್ರಾಹಕ ಮಾಹಿತಿಯನ್ನು ಬಳಸಬಹುದು.</p><p>ವ್ಯಾಪಾರಿಗಳು ಈ ಕೆಳಗಿನವನ್ನು ಮಾಡಬೇಕು:</p><ul><li>ಅನಧಿಕೃತ ಪ್ರವೇಶ ಅಥವಾ ಬಹಿರಂಗಪಡಿಸುವಿಕೆಯಿಂದ ಗ್ರಾಹಕ ಮಾಹಿತಿಯನ್ನು ರಕ್ಷಿಸುವುದು.</li><li>ಪ್ರವೇಶವನ್ನು ಅಧಿಕೃತ ಸಿಬ್ಬಂದಿಗೆ ಮಾತ್ರ ಸೀಮಿತಗೊಳಿಸುವುದು.</li><li>ಕಾನೂನುಬದ್ಧ ಆಧಾರವಿಲ್ಲದೆ ಅತಿಥಿ ಮಾಹಿತಿಯನ್ನು ಅಸಂಬಂಧಿತ ಮಾರ್ಕೆಟಿಂಗ್‌ಗೆ ಬಳಸುವುದನ್ನು ತಪ್ಪಿಸುವುದು.</li><li>ಕಾನೂನಿನಿಂದ ಅನುಮತಿಸಲಾದ ಅಥವಾ ಅಗತ್ಯವಿರುವಷ್ಟು ಕಾಲ ಮಾತ್ರ ಮಾಹಿತಿಯನ್ನು ಉಳಿಸಿಕೊಳ್ಳುವುದು.</li><li>ವೇದಿಕೆಯ ಮೂಲಕ ಪಡೆದ ಮಾಹಿತಿಗೆ ಸಂಬಂಧಿಸಿದ ಶಂಕಿತ ಡೇಟಾ ಉಲ್ಲಂಘನೆಯ ಬಗ್ಗೆ ತಕ್ಷಣ ಸ್ಟೇವೃಕ್ಷ ಗೆ ತಿಳಿಸುವುದು ಮತ್ತು ಅನ್ವಯವಾಗುವ ಸೂಚನಾ ಅಗತ್ಯತೆಗಳನ್ನು ಪಾಲಿಸುವುದು.</li></ul><p>ವ್ಯಾಪಾರಿಗಳು ಅನ್ವಯವಾಗುವ ಗೋಪ್ಯತೆ ಮತ್ತು ಡೇಟಾ ಸಂರಕ್ಷಣಾ ಬಾಧ್ಯತೆಗಳನ್ನು ಪಾಲಿಸಬೇಕು.</p>
policyVendor8Title=ಆಸ್ತಿ ವಿಷಯ ಮತ್ತು ಬೌದ್ಧಿಕ ಆಸ್ತಿ
policyVendor8Html=<p>ಆಸ್ತಿಯ ಛಾಯಾಚಿತ್ರಗಳು, ವಿವರಣೆಗಳು, ಲೋಗೋಗಳು ಮತ್ತು ಇತರ ಲಿಸ್ಟಿಂಗ್ ವಿಷಯವನ್ನು ಅಪ್‌ಲೋಡ್ ಮಾಡಲು ಮತ್ತು ಅವುಗಳ ಬಳಕೆಗೆ ಅಧಿಕಾರ ನೀಡಲು ಅಗತ್ಯವಿರುವ ಹಕ್ಕುಗಳು ಮತ್ತು ಅನುಮತಿಗಳು ತನಗಿವೆ ಎಂದು ವ್ಯಾಪಾರಿ ದೃಢೀಕರಿಸುತ್ತಾನೆ.</p><p>ಅನ್ವಯವಾಗುವ ಸಂಬಂಧದ ಅವಧಿಯಲ್ಲಿ ಸಂಬಂಧಿತ ಲಿಸ್ಟಿಂಗ್ ಮತ್ತು ವೇದಿಕೆಯನ್ನು ನಿರ್ವಹಿಸಲು, ಪ್ರಚಾರ ಮಾಡಲು ಮತ್ತು ಮಾರಾಟ ಮಾಡಲು, ಅಧಿಕೃತ ಲಿಸ್ಟಿಂಗ್ ವಿಷಯವನ್ನು ಪ್ರದರ್ಶಿಸಲು, ಪುನರುತ್ಪಾದಿಸಲು ಮತ್ತು ಬಳಸಲು ವ್ಯಾಪಾರಿ ಸ್ಟೇವೃಕ್ಷ ಗೆ ವಿಶೇಷವಲ್ಲದ, ರಾಯಲ್ಟಿ-ಮುಕ್ತ ಪರವಾನಗಿಯನ್ನು ನೀಡುತ್ತಾನೆ.</p><p>ಈ ಪರವಾನಗಿಯು ವ್ಯಾಪಾರಿಯ ಬೌದ್ಧಿಕ ಆಸ್ತಿಯ ಮಾಲೀಕತ್ವವನ್ನು ವರ್ಗಾಯಿಸುವುದಿಲ್ಲ.</p><p>ತನ್ನ ಲಿಸ್ಟಿಂಗ್‌ಗೆ ಸಂಬಂಧಿಸಿದ ಯಾವುದೇ ಬೌದ್ಧಿಕ ಆಸ್ತಿ ದೂರಿನ ಬಗ್ಗೆ ವ್ಯಾಪಾರಿ ತಕ್ಷಣ ಸ್ಟೇವೃಕ್ಷ ಗೆ ತಿಳಿಸಬೇಕು.</p>
policyVendor9Title=ದೂರುಗಳು, ಸುರಕ್ಷತೆ ಮತ್ತು ತನಿಖೆಗಳು
policyVendor9Html=<p>ಆಸ್ತಿಗೆ ಸಂಬಂಧಿಸಿದ ಸೇವಾ ಸಮಸ್ಯೆಗಳನ್ನು ಪರಿಹರಿಸುವುದು ಮತ್ತು ಅನ್ವಯವಾಗುವ ಸುರಕ್ಷತಾ ಅಗತ್ಯತೆಗಳನ್ನು ಪಾಲಿಸುವುದು ವ್ಯಾಪಾರಿಯ ಜವಾಬ್ದಾರಿಯಾಗಿದೆ.</p><p>ಆರೋಪಿತ ತಪ್ಪು ನಿರೂಪಣೆ, ಬುಕಿಂಗ್ ವೈಫಲ್ಯಗಳು, ಗ್ರಾಹಕ ದೂರುಗಳು, ವಂಚನೆ ಅಥವಾ ಸುರಕ್ಷತಾ ಕಳವಳಗಳಿಗೆ ಸಂಬಂಧಿಸಿದ ಸಮಂಜಸವಾದ ತನಿಖೆಗಳಲ್ಲಿ ವ್ಯಾಪಾರಿ ಸಹಕರಿಸಬೇಕು.</p><p>ಸ್ಟೇವೃಕ್ಷ ಪೂರಕ ಸಾಕ್ಷ್ಯವನ್ನು ಕೇಳಬಹುದು, ಒಂದು ಲಿಸ್ಟಿಂಗ್ ಅನ್ನು ನಿರ್ಬಂಧಿಸಬಹುದು, ಹೊಸ ಬುಕಿಂಗ್‌ಗಳನ್ನು ತಡೆಹಿಡಿಯಬಹುದು, ಅಥವಾ ಸಮಂಜಸವಾಗಿ ಅಗತ್ಯವಿದ್ದಲ್ಲಿ ಅನ್ವಯವಾಗುವ ಕಾನೂನು ಮತ್ತು ಒಪ್ಪಂದದ ಬಾಧ್ಯತೆಗಳಿಗೆ ಒಳಪಟ್ಟು ಬೇರೆ ಅನುಪಾತದ ಕ್ರಮವನ್ನು ತೆಗೆದುಕೊಳ್ಳಬಹುದು.</p>
policyVendor10Title=ಅಮಾನತು ಮತ್ತು ಮುಕ್ತಾಯ
policyVendor10Html=<p>ಯಾವುದೇ ಪಕ್ಷವು ಅನ್ವಯವಾಗುವ ಒಪ್ಪಂದಕ್ಕೆ ಅನುಸಾರ ವಾಣಿಜ್ಯ ಸಂಬಂಧವನ್ನು ಮುಕ್ತಾಯಗೊಳಿಸಬಹುದು.</p><p>ಪ್ರಮುಖ ಒಪ್ಪಂದ ಉಲ್ಲಂಘನೆಗಳು, ನಿಖರವಲ್ಲದ ಮಾಹಿತಿ, ಶಂಕಿತ ವಂಚನೆ, ಕಾನೂನು ಅನುಸರಣೆಯ ಕೊರತೆ, ಸುರಕ್ಷತಾ ಅಪಾಯಗಳು ಅಥವಾ ಪುನರಾವರ್ತಿತ ಬಗೆಹರಿಯದ ದೂರುಗಳಿಗೆ ಸಂಬಂಧಿಸಿದ ಸಮಂಜಸವಾದ ಕಳವಳಗಳಿದ್ದಲ್ಲಿ ಸ್ಟೇವೃಕ್ಷ ಒಂದು ಲಿಸ್ಟಿಂಗ್ ಅನ್ನು ಅಮಾನತುಗೊಳಿಸಬಹುದು ಅಥವಾ ತೆಗೆಯಬಹುದು.</p><p>ಸೂಕ್ತವಾದಲ್ಲಿ, ವ್ಯಾಪಾರಿಗೆ ಸೂಚಿಸಲಾಗುತ್ತದೆ ಮತ್ತು ಪ್ರತಿಕ್ರಿಯಿಸಲು ಅಥವಾ ಸಮಸ್ಯೆಯನ್ನು ಸರಿಪಡಿಸಲು ಅವಕಾಶ ನೀಡಲಾಗುತ್ತದೆ.</p><p>ಮುಕ್ತಾಯವು ಅಸ್ತಿತ್ವದಲ್ಲಿರುವ ಬುಕಿಂಗ್‌ಗಳನ್ನು ಸ್ವಯಂಚಾಲಿತವಾಗಿ ರದ್ದು ಮಾಡುವುದಿಲ್ಲ ಅಥವಾ ಮುಕ್ತಾಯದ ನಂತರವೂ ಉಳಿಯುವ ಪಾವತಿ, ಮರುಪಾವತಿ, ದಾಖಲೆ ನಿರ್ವಹಣೆ ಅಥವಾ ಇತರ ಬಾಧ್ಯತೆಗಳನ್ನು ತೆಗೆದುಹಾಕುವುದಿಲ್ಲ.</p>
policyVendor11Title=ಪರಿಹಾರ ಭರಣೆ ಮತ್ತು ಹೊಣೆಗಾರಿಕೆ
policyVendor11Html=<p>ಪ್ರತಿ ಪಕ್ಷವು ತನ್ನದೇ ಕಾರ್ಯಗಳು, ಲೋಪಗಳು ಮತ್ತು ಒಪ್ಪಂದ ಹಾಗೂ ಕಾನೂನು ಬಾಧ್ಯತೆಗಳಿಗೆ ಜವಾಬ್ದಾರವಾಗಿರುತ್ತದೆ.</p><p>ಕಾನೂನಿನಿಂದ ಅನುಮತಿಸಲಾದ ಮಟ್ಟಿಗೆ, ಈ ಒಪ್ಪಂದದ ವ್ಯಾಪಾರಿಯ ಉಲ್ಲಂಘನೆ, ಕಾನೂನುಬಾಹಿರ ಕಾರ್ಯಾಚರಣೆ, ದಾರಿತಪ್ಪಿಸುವ ಲಿಸ್ಟಿಂಗ್ ಮಾಹಿತಿ, ಮೂರನೇ ಪಕ್ಷದ ಹಕ್ಕುಗಳ ಉಲ್ಲಂಘನೆ, ಅಥವಾ ನಿರ್ಲಕ್ಷ್ಯ ಅಥವಾ ತಪ್ಪು ನಡವಳಿಕೆಯಿಂದ ಉಂಟಾಗುವ ನಷ್ಟಗಳು, ಕ್ಲೇಮ್‌ಗಳು ಅಥವಾ ಖರ್ಚುಗಳಿಗೆ ವ್ಯಾಪಾರಿ ಜವಾಬ್ದಾರನಾಗಿರುತ್ತಾನೆ.</p><p>ಯಾವುದೇ ಪರಿಹಾರ ಭರಣೆ ಬಾಧ್ಯತೆಯು ಅನ್ವಯವಾಗುವ ಕಾನೂನಿಗೆ ಒಳಪಟ್ಟಿರುತ್ತದೆ ಮತ್ತು ಕಾನೂನುಬದ್ಧವಾಗಿ ಹೊರಗಿಡಲಾಗದ ಹೊಣೆಗಾರಿಕೆಯನ್ನು ಹೊರಗಿಡುವುದಿಲ್ಲ.</p>
policyVendor12Title=ವಿವಾದ ಪರಿಹಾರ
policyVendor12Html=<p>ಪಕ್ಷಗಳು ಮೊದಲು ಸದ್ಭಾವನೆಯ ಚರ್ಚೆ ಮತ್ತು ಸ್ಟೇವೃಕ್ಷ ದೂರು ಪ್ರಕ್ರಿಯೆಯ ಮೂಲಕ ವಿವಾದಗಳನ್ನು ಪರಿಹರಿಸಲು ಪ್ರಯತ್ನಿಸಬೇಕು.</p><p>ಯಾವುದೇ ಮಧ್ಯಸ್ಥಿಕೆ ಅಥವಾ ನ್ಯಾಯಾಲಯದ ಕಾರ್ಯವಿಧಾನಗಳು ಅನ್ವಯವಾಗುವ ಕಾನೂನು ಮತ್ತು ಯಾವುದೇ ಮಾನ್ಯ ವಿವಾದ-ಪರಿಹಾರ ಒಪ್ಪಂದಕ್ಕೆ ಒಳಪಟ್ಟಿರುತ್ತವೆ.</p>
policyVendor13Title=ಒಪ್ಪಂದಕ್ಕೆ ಬದಲಾವಣೆಗಳು
policyVendor13Html=<p>ಕಮಿಷನ್ ಮತ್ತು ಇತ್ಯರ್ಥ ವ್ಯವಸ್ಥೆಗಳು ಸೇರಿದಂತೆ ಪ್ರಮುಖ ವಾಣಿಜ್ಯ ಷರತ್ತುಗಳ ಬದಲಾವಣೆಗಳನ್ನು ಅನ್ವಯವಾಗುವ ಒಪ್ಪಂದ ಮತ್ತು ಕಾನೂನಿನಿಂದ ಅಗತ್ಯವಿರುವ ರೀತಿಯಲ್ಲಿ ತಿಳಿಸಲಾಗುತ್ತದೆ ಮತ್ತು ಸ್ವೀಕರಿಸಲಾಗುತ್ತದೆ.</p><p>ಒಪ್ಪಂದ ಮತ್ತು ಅನ್ವಯವಾಗುವ ಕಾನೂನಿನಿಂದ ಅನುಮತಿಸಲಾದಂತೆ ನವೀಕರಿಸಿದ ವೇದಿಕೆ ನೀತಿಗಳು ಅನ್ವಯವಾಗಬಹುದು.</p>
policyVendor14Title=ವ್ಯಾಪಾರಿ ಸ್ವೀಕಾರ
policyVendor14Html=<p>ಪ್ರಕಟಣೆಗಾಗಿ ಆಸ್ತಿಯನ್ನು ಸಲ್ಲಿಸುವ ಮೊದಲು, ವ್ಯಾಪಾರಿ ಈ ಕೆಳಗಿನವನ್ನು ದೃಢೀಕರಿಸಬೇಕು:</p><ul><li>ಆಸ್ತಿಯನ್ನು ಪಟ್ಟಿ ಮಾಡಲು ಮತ್ತು ನಡೆಸಲು ಅವನಿಗೆ ಅಧಿಕಾರವಿದೆ.</li><li>ನಿಖರವಾದ ಮಾಹಿತಿ ಮತ್ತು ಪೂರಕ ದಾಖಲೆಗಳನ್ನು ಒದಗಿಸಿದ್ದಾನೆ.</li><li>ಅನ್ವಯವಾಗುವ ವಾಣಿಜ್ಯ ಷರತ್ತುಗಳನ್ನು ಪರಿಶೀಲಿಸಿದ್ದಾನೆ.</li><li>ಬುಕಿಂಗ್, ರದ್ದತಿ, ಮರುಪಾವತಿ, ಗೋಪ್ಯತೆ ಮತ್ತು ಇತ್ಯರ್ಥ ಬಾಧ್ಯತೆಗಳನ್ನು ಅರ್ಥಮಾಡಿಕೊಂಡಿದ್ದಾನೆ.</li><li>ಈ ವ್ಯಾಪಾರಿ ಒಪ್ಪಂದ ಮತ್ತು ಅನ್ವಯವಾಗುವ ಕಾನೂನನ್ನು ಪಾಲಿಸಲು ಒಪ್ಪುತ್ತಾನೆ.</li></ul><div class='contact-card'><h3>ಸ್ವೀಕಾರ</h3><p><strong>ವ್ಯಾಪಾರಿ / ವ್ಯಾಪಾರದ ಹೆಸರು:</strong> [ವ್ಯಾಪಾರಿ ಹೆಸರು]<br><strong>ಅಧಿಕೃತ ಪ್ರತಿನಿಧಿ:</strong> [ಹೆಸರು]<br><strong>ಆಸ್ತಿಯ ಹೆಸರು(ಗಳು):</strong> [ಆಸ್ತಿಯ ಹೆಸರು(ಗಳು)]<br><strong>ಸ್ವೀಕಾರದ ದಿನಾಂಕ:</strong> [ದಿನಾಂಕ]<br><strong>ಎಲೆಕ್ಟ್ರಾನಿಕ್ ಸ್ವೀಕಾರ / ಸಹಿ:</strong> [ಸಂರಚಿತ ಸ್ವೀಕಾರ ವಿಧಾನ]</p></div>

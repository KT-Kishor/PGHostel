tour_desc_room=ಶಾಖೆ ಕೋಡ್‌ಗಳು ಮತ್ತು ಹಾಸಿಗೆ ಪ್ರಕಾರಗಳನ್ನು ನಿಯೋಜಿಸುವ ಮೂಲಕ ಕೊಠಡಿ ಸಂಗ್ರಹವನ್ನು ಹೊಂದಿಸಿ ಮತ್ತು ಸ್ಥಳೀಯ ಕರೆನ್ಸಿಯಲ್ಲಿ ದೈನಂದಿನ, ಮಾಸಿಕ ಮತ್ತು ವಾರ್ಷಿಕ ಹಂತದ ಬೆಲೆಗಳನ್ನು ನಿರ್ಧರಿಸಿ
tour_desc_facilities=ಶಾಖೆ ಆಧಾರಿತ ಸೌಲಭ್ಯಗಳನ್ನು ನಿರ್ವಹಿಸಿ: ಪ್ರಕಾರಗಳನ್ನು ನಿರ್ಧರಿಸಿ, ಫೋಟೋಗಳನ್ನು ಅಪ್‌ಲೋಡ್ ಮಾಡಿ ಮತ್ತು ಗಂಟೆಯಿಂದ ವಾರ್ಷಿಕ ಹಂತದವರೆಗೆ ಹೊಂದಿಕೊಳ್ಳುವ ಬೆಲೆಗಳನ್ನು ನಿಗದಿಪಡಿಸಿ
tour_desc_hostelFeatures=ಶಾಖೆ ಆಧಾರಿತ ಸೌಲಭ್ಯಗಳನ್ನು ಪ್ರದರ್ಶಿಸಿ: ಸೌಲಭ್ಯ ಪ್ರಕಾರಗಳು, ವಿವರವಾದ ವಿವರಣೆಗಳು ಮತ್ತು ನಿವಾಸಿಗಳಿಗಾಗಿ ಉತ್ತಮ ಗುಣಮಟ್ಟದ ಚಿತ್ರಗಳನ್ನು ನಿರ್ವಹಿಸಿ.
tour_desc_coupon=ರಿಯಾಯಿತಿ ಕೂಪನ್‌ಗಳನ್ನು ರಚಿಸಿ ಮತ್ತು ನಿರ್ವಹಿಸಿ. ಮಾನ್ಯತಾ ಅವಧಿ, ರಿಯಾಯಿತಿ ಮೌಲ್ಯಗಳು, ಬಳಕೆ ಮಿತಿಗಳನ್ನು ಹೊಂದಿಸಿ ಮತ್ತು ಕೂಪನ್‌ಗಳನ್ನು ಹಂಚಿಕೊಳ್ಳಿ
tour_desc_staff=ನಿರ್ದಿಷ್ಟ ಶಾಖೆ ಪಾತ್ರಗಳು, ಸಂಪರ್ಕ ವಿವರಗಳು ಮತ್ತು ಪಾತ್ರ ಆಧಾರಿತ ಪ್ರವೇಶ ಅನುಮತಿಗಳೊಂದಿಗೆ ಸಿಬ್ಬಂದಿ ಪ್ರೊಫೈಲ್‌ಗಳನ್ನು ನೋಂದಾಯಿಸಿ.
tour_desc_vendor=ಮಾರಾಟಗಾರರ ಪ್ರೊಫೈಲ್‌ಗಳನ್ನು ನೋಂದಾಯಿಸಿ ಮತ್ತು ನಿರ್ವಹಿಸಿ, ಸಂಪರ್ಕ ವಿವರಗಳು, ಸ್ಥಳ ಮಾಹಿತಿ ಮತ್ತು ಕಡ್ಡಾಯ ವ್ಯವಹಾರ ಪರಿಶೀಲನಾ ದಾಖಲೆಗಳನ್ನು ಒಳಗೊಂಡಂತೆ
tour_desc_support=ಗ್ರಾಹಕರ ಬೆಂಬಲ ವಿನಂತಿಗಳನ್ನು ಪರಿಶೀಲಿಸಿ, ಸಮಸ್ಯೆಯ ಪ್ರಕಾರ ಮತ್ತು ಸ್ಥಿತಿಯನ್ನು ಟ್ರ್ಯಾಕ್ ಮಾಡಿ ಮತ್ತು ನಿವಾಸಿಗಳು ವರದಿ ಮಾಡಿದ ಸಮಸ್ಯೆಗಳನ್ನು ಒಂದೇ ಸ್ಥಳದಿಂದ ಪರಿಹರಿಸಿ.
tour_desc_bug=ಹಾಸ್ಟೆಲ್‌ನ ವಿವಿಧ ಮಾಡ್ಯೂಲ್‌ಗಳಲ್ಲಿ ವರದಿಯಾದ ಅಪ್ಲಿಕೇಶನ್ ಬಗ್‌ಗಳನ್ನು ದಾಖಲಿಸಿ ಮತ್ತು ಟ್ರ್ಯಾಕ್ ಮಾಡಿ, Open ನಿಂದ Resolved ವರೆಗೆ ಸ್ಥಿತಿ ಮತ್ತು ಸ್ಕ್ರೀನ್‌ಶಾಟ್‌ಗಳೊಂದಿಗೆ.

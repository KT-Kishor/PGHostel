# --- Card 8: Staff Management ---
topic_staffManagement_title=ಸಿಬ್ಬಂದಿ ನಿರ್ವಹಣೆ
topic_staffManagement_desc=ಅಡ್ಮಿನ್ ಆಸ್ತಿಯ ಅವಶ್ಯಕತೆಗಳ ಆಧಾರದ ಮೇಲೆ ಪಾತ್ರಗಳು ಮತ್ತು ಜವಾಬ್ದಾರಿಗಳನ್ನು ನಿಯೋಜಿಸುವ ಮೂಲಕ ಸಿಬ್ಬಂದಿ ಸದಸ್ಯರನ್ನು ರಚಿಸಬಹುದು ಮತ್ತು ನಿರ್ವಹಿಸಬಹುದು. ಪ್ರವೇಶವನ್ನು ಖಚಿತಪಡಿಸಿಕೊಳ್ಳಲು ಪ್ರತಿ ಸಿಬ್ಬಂದಿ ಸದಸ್ಯರನ್ನು ನಿರ್ದಿಷ್ಟ ಶಾಖೆಗೆ ನಿಯೋಜಿಸಬಹುದು. ಸಿಬ್ಬಂದಿ ತಮ್ಮ ರುಜುವಾತುಗಳನ್ನು ಬಳಸಿ ಲಾಗಿನ್ ಮಾಡಬಹುದು ಮತ್ತು ತಮ್ಮ ಪಾತ್ರಕ್ಕೆ ಅಧಿಕಾರ ನೀಡಲಾದ ವೈಶಿಷ್ಟ್ಯಗಳನ್ನು ಮಾತ್ರ ಪ್ರವೇಶಿಸಬಹುದು.

# --- Card 9: Admin Room Booking ---
topic_adminRoomBooking_title=ಅಡ್ಮಿನ್ ರೂಮ್ ಬುಕಿಂಗ್
topic_adminRoomBooking_desc=ಅಡ್ಮಿನ್ ರೂಮ್ ಬುಕಿಂಗ್ ವೈಶಿಷ್ಟ್ಯವು ಅಡ್ಮಿನ್‌ಗೆ ಗ್ರಾಹಕರಿಗಾಗಿ ಮತ್ತು ಸ್ವಯಂ-ಬುಕಿಂಗ್‌ಗಾಗಿ ಬುಕಿಂಗ್‌ಗಳನ್ನು ರಚಿಸಲು ಮತ್ತು ನಿರ್ವಹಿಸಲು ಅನುಮತಿಸುತ್ತದೆ. ಅಗತ್ಯ ಬುಕಿಂಗ್ ವಿವರಗಳನ್ನು ನಮೂದಿಸುವ ಮೂಲಕ ಮತ್ತು ಲಭ್ಯವಿರುವ ಕೊಠಡಿಗಳನ್ನು ಆಯ್ಕೆ ಮಾಡುವ ಮೂಲಕ ಅಡ್ಮಿನ್ ಹೊಸ ಗ್ರಾಹಕರಿಗೆ ಕೊಠಡಿಗಳನ್ನು ಬುಕ್ ಮಾಡಬಹುದು. ದಿನಾಂಕಗಳು, ಸೌಲಭ್ಯಗಳು, ಕೂಪನ್‌ಗಳು ಮತ್ತು ಜಿಎಸ್‌ಟಿ ಯನ್ನು ಅನ್ವಯಿಸಬಹುದು.


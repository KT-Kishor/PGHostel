# --- Card 15: Vendor Registration ---
topic_vendorRegistration_title=ವೆಂಡರ್ ನೋಂದಣಿ
topic_vendorRegistration_desc=ವೆಂಡರ್ ಸಿಸ್ಟಮ್ ಮೂಲಕ ನೋಂದಣಿ ವಿವರಗಳನ್ನು ಸಲ್ಲಿಸಬಹುದು ಮತ್ತು ನಿರ್ವಹಿಸಬಹುದು. ನೋಂದಣಿ ಸಮಯದಲ್ಲಿ ವ್ಯಾಪಾರ ಮಾಹಿತಿ, ಸಂಪರ್ಕ ವಿವರಗಳು ಮತ್ತು ಪರಿಶೀಲನಾ ದಾಖಲೆಗಳನ್ನು ಒದಗಿಸಬಹುದು. ಅನುಮೋದನೆಯ ನಂತರ, ಲಾಗಿನ್ ರುಜುವಾತುಗಳನ್ನು ಇಮೇಲ್‌ಗೆ ಕಳುಹಿಸಲಾಗುತ್ತದೆ.

# --- Card 16: Customer SignUp ---
topic_customerSignUp_title=ಗ್ರಾಹಕ ಸೈನ್-ಅಪ್
topic_customerSignUp_desc=ಗ್ರಾಹಕ ಸೈನ್-ಅಪ್ ಫಾರ್ಮ್ ಗ್ರಾಹಕರಿಗೆ ಹೆಸರು ಮತ್ತು ಮೊಬೈಲ್ ಸಂಖ್ಯೆಯಂತಹ ಮೂಲಭೂತ ವಿವರಗಳನ್ನು ಒದಗಿಸಲು ಅನುಮತಿಸುತ್ತದೆ. ಅಂತಿಮ ಹಂತದಲ್ಲಿ, ಗ್ರಾಹಕರು ತಮ್ಮ ಖಾತೆಗೆ ಸುರಕ್ಷಿತ ಪಾಸ್‌ವರ್ಡ್ ಅನ್ನು ಹೊಂದಿಸಬಹುದು ಮತ್ತು ಸಿಸ್ಟಮ್ ಅನ್ನು ಪ್ರವೇಶಿಸಲು ಖಾತೆಯನ್ನು ಯಶಸ್ವಿಯಾಗಿ ರಚಿಸಬಹುದು.

# --- Card 17: Set/Forgot Password ---
topic_setForgotPassword_title=ಪಾಸ್‌ವರ್ಡ್ ಹೊಂದಿಸಿ / ಮರೆತುಹೋಗಿದೆ
topic_setForgotPassword_desc=ಪಾಸ್‌ವರ್ಡ್ ಹೊಂದಿಸಿ/ಮರೆತುಹೋಗಿದೆ ವೈಶಿಷ್ಟ್ಯವು ಗ್ರಾಹಕರಿಗೆ ತಮ್ಮ ಖಾತೆಯ ಪಾಸ್‌ವರ್ಡ್ ಅನ್ನು ಸುರಕ್ಷಿತವಾಗಿ ರಚಿಸಲು ಅಥವಾ ಮರುಹೊಂದಿಸಲು ಅನುಮತಿಸುತ್ತದೆ. OTP ಸ್ವೀಕರಿಸಲು ಗ್ರಾಹಕರು ನೋಂದಾಯಿತ ಇಮೇಲ್ ವಿಳಾಸವನ್ನು ನಮೂದಿಸಬೇಕಾಗುತ್ತದೆ. ಪರಿಶೀಲನೆಯ ನಂತರ ಹೊಸ ಪಾಸ್‌ವರ್ಡ್ ಹೊಂದಿಸಬಹುದು.

# --- Card 18: Create Booking ---
topic_createBooking_title=ಬುಕಿಂಗ್ ರಚಿಸಿ
topic_createBooking_desc=ಬುಕಿಂಗ್ ರಚನೆ ವೈಶಿಷ್ಟ್ಯವು ಗ್ರಾಹಕರಿಗೆ ಆಸ್ತಿಯನ್ನು ಆಯ್ಕೆ ಮಾಡಲು ಮತ್ತು ಬುಕಿಂಗ್ ಮಾಡುವ ಮೊದಲು ತಮ್ಮ ಆದ್ಯತೆಯ ಬೆಡ್ ಪ್ರಕಾರವನ್ನು ಆಯ್ಕೆ ಮಾಡಲು ಅನುಮತಿಸುತ್ತದೆ. ಗ್ರಾಹಕರು ಬುಕಿಂಗ್ ದಿನಾಂಕ, ಸದಸ್ಯರ ಸಂಖ್ಯೆ, ಹೆಚ್ಚುವರಿ ಸೌಲಭ್ಯಗಳನ್ನು ಆಯ್ಕೆ ಮಾಡಬಹುದು ಮತ್ತು ಕೂಪನ್‌ಗಳನ್ನು ಅನ್ವಯಿಸಬಹುದು.

# --- Card 19: Manage Booking ---

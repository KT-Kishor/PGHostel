tour_desc_facilities=ಶಾಖೆ ಆಧಾರಿತ ಸೌಲಭ್ಯಗಳನ್ನು ನಿರ್ವಹಿಸಿ: ಪ್ರಕಾರಗಳನ್ನು ನಿರ್ಧರಿಸಿ, ಫೋಟೋಗಳನ್ನು ಅಪ್‌ಲೋಡ್ ಮಾಡಿ ಮತ್ತು ಗಂಟೆಯಿಂದ ವಾರ್ಷಿಕ ಹಂತದವರೆಗೆ ಹೊಂದಿಕೊಳ್ಳುವ ಬೆಲೆಗಳನ್ನು ನಿಗದಿಪಡಿಸಿ
tour_desc_hostelFeatures=ಶಾಖೆ ಆಧಾರಿತ ಸೌಲಭ್ಯಗಳನ್ನು ಪ್ರದರ್ಶಿಸಿ: ಸೌಲಭ್ಯ ಪ್ರಕಾರಗಳು, ವಿವರವಾದ ವಿವರಣೆಗಳು ಮತ್ತು ನಿವಾಸಿಗಳಿಗಾಗಿ ಉತ್ತಮ ಗುಣಮಟ್ಟದ ಚಿತ್ರಗಳನ್ನು ನಿರ್ವಹಿಸಿ.

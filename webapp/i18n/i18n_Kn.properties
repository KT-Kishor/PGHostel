tour_desc_customer=ಅತಿಥಿಗಳ ಸಂಪೂರ್ಣ ಜೀವನಚಕ್ರವನ್ನು ನಿರ್ವಹಿಸಿ: ಬುಕಿಂಗ್‌ಗಳನ್ನು ನಿರ್ವಹಿಸಿ, ಕೊಠಡಿಗಳನ್ನು ನಿಯೋಜಿಸಿ ಅಥವಾ ಬದಲಾಯಿಸಿ ಮತ್ತು ವಾಸ್ತವ್ಯದ ವಿವರಗಳು ಹಾಗೂ ಪರಿಶೀಲನಾ ದಾಖಲೆಗಳೊಂದಿಗೆ ಗ್ರಾಹಕರ ಪ್ರೊಫೈಲ್‌ಗಳನ್ನು ನಿರ್ವಹಿಸಿ.
tour_desc_invoice=ಜಿಎಸ್‌ಟಿ ವಿವರಗಳು, SAC ಕೋಡ್‌ಗಳು ಮತ್ತು ಬುಕಿಂಗ್‌ಗಳ ಐಟಂವಾರು ಬೆಲೆ ವಿಭಜನೆಯೊಂದಿಗೆ ತೆರಿಗೆ ನಿಯಮಗಳಿಗೆ ಅನುಗುಣವಾದ ಇನ್‌ವಾಯ್ಸ್‌ಗಳನ್ನು ರಚಿಸಿ
tour_desc_deposit=ಭದ್ರತಾ ಠೇವಣಿ ಸಂಗ್ರಹಣೆಗಳನ್ನು ಟ್ರ್ಯಾಕ್ ಮಾಡಿ ಮತ್ತು ವಿವರವಾದ ವಹಿವಾಟು ದಾಖಲೆಗಳು ಹಾಗೂ ಹಿಂತಿರುಗಿಸುವ ವಿಧಾನಗಳೊಂದಿಗೆ ಮರುಪಾವತಿಗಳನ್ನು ಪ್ರಕ್ರಿಯೆಗೊಳಿಸಿ
tour_desc_payment=ವಹಿವಾಟು ಐಡಿಗಳು, ಪಾವತಿ ವಿಧಾನಗಳು ಮತ್ತು ಬ್ಯಾಂಕ್ ವಿವರಗಳನ್ನು ಒಳಗೊಂಡಂತೆ ಎಲ್ಲಾ ಗ್ರಾಹಕರ ಪಾವತಿ ಇತಿಹಾಸಗಳನ್ನು ಮೇಲ್ವಿಚಾರಣೆ ಮಾಡಿ ಮತ್ತು ರಫ್ತು ಮಾಡಿ
tour_desc_damage=ಆಸ್ತಿ ಹಾನಿಗಳನ್ನು ವರದಿ ಮಾಡಿ, ದುರಸ್ತಿ ವೆಚ್ಚಗಳನ್ನು ಲೆಕ್ಕಹಾಕಿ ಮತ್ತು ವಿವರವಾದ ಐಟಂ ದಾಖಲೆಗಳೊಂದಿಗೆ ನಿವಾಸಿಗಳಿಂದ ಮರುಪಡೆಯುವಿಕೆಯನ್ನು ಟ್ರ್ಯಾಕ್ ಮಾಡಿ
tour_desc_complaint=ನಿವಾಸಿಗಳ ದೂರುಗಳನ್ನು ಮೇಲ್ವಿಚಾರಣೆ ಮಾಡಿ, ಪರಿಹಾರಕ್ಕಾಗಿ ಸಿಬ್ಬಂದಿಯನ್ನು ನಿಯೋಜಿಸಿ ಮತ್ತು ದೃಶ್ಯ ಸಾಕ್ಷ್ಯಗಳೊಂದಿಗೆ 'Open' ನಿಂದ 'Resolved' ವರೆಗೆ ಸ್ಥಿತಿಯನ್ನು ಟ್ರ್ಯಾಕ್ ಮಾಡಿ
tour_desc_customerReview=ಸ್ವಚ್ಛತೆ, ಸಿಬ್ಬಂದಿ ಸೇವೆ ಮತ್ತು ಸೌಲಭ್ಯಗಳ ವಿವರವಾದ ರೇಟಿಂಗ್‌ಗಳೊಂದಿಗೆ ನಿವಾಸಿಗಳ ಪ್ರತಿಕ್ರಿಯೆಯನ್ನು ವಿಶ್ಲೇಷಿಸಿ ಮತ್ತು ಹಾಸ್ಟೆಲ್ ಗುಣಮಟ್ಟವನ್ನು ಸುಧಾರಿಸಿ
tour_desc_bookingDashboard=ಎಲ್ಲಾ ಬುಕಿಂಗ್‌ಗಳ ದೃಶ್ಯ ಅವಲೋಕನ — ಆಕ್ಯುಪೆನ್ಸಿ ಪ್ರವೃತ್ತಿಗಳು, ಚೆಕ್-ಇನ್/ಔಟ್ ವಿಶ್ಲೇಷಣೆ ಮತ್ತು ಕೊಠಡಿ ಲಭ್ಯತೆ.
tour_desc_paymentDashboard=ಪಾವತಿ ಇತಿಹಾಸ, ಆದಾಯದ ಪ್ರವೃತ್ತಿಗಳು ಮತ್ತು ಬಾಕಿ ಮೊತ್ತಗಳ ಗ್ರಾಫಿಕಲ್ ಸಾರಾಂಶ.
tour_desc_complainDashboard=ಎಲ್ಲಾ ದೂರುಗಳ ಡ್ಯಾಶ್‌ಬೋರ್ಡ್ ವೀಕ್ಷಣೆ — ಸ್ಥಿತಿ ವಿಭಜನೆ, ಪರಿಹಾರ ಪ್ರವೃತ್ತಿಗಳು ಮತ್ತು ತೆರೆದ ಪ್ರಕರಣಗಳು.

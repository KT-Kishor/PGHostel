# ─── Tour Guide - FrontOfficeEmployee View-Only descriptions (per tile) ──────
tour_desc_branch_view=ಶಾಖೆಯ ಹೆಸರು, ಸ್ಥಳ, ಸಂಪರ್ಕ ಮಾಹಿತಿ ಮತ್ತು ನಿಯೋಜಿಸಲಾದ ನಿರ್ವಾಹಕರಂತಹ ಎಲ್ಲಾ ಶಾಖೆ ವಿವರಗಳನ್ನು ವೀಕ್ಷಿಸಿ. ನೀವು ಶಾಖೆಗಳನ್ನು ಸೇರಿಸಲು, ತಿದ್ದುಪಡಿ ಮಾಡಲು ಅಥವಾ ಅಳಿಸಲು ಸಾಧ್ಯವಿಲ್ಲ.
tour_desc_bed_view=ಎಲ್ಲಾ ಹೊಂದಿಸಲಾದ ಹಾಸಿಗೆ ಪ್ರಕಾರಗಳು ಮತ್ತು ಅವುಗಳ ಬೆಲೆಗಳನ್ನು ವೀಕ್ಷಿಸಿ. ನೀವು ಹೊಸ ಹಾಸಿಗೆ ಪ್ರಕಾರಗಳನ್ನು ರಚಿಸಲು ಅಥವಾ ಅಸ್ತಿತ್ವದಲ್ಲಿರುವವುಗಳನ್ನು ಬದಲಾಯಿಸಲು ಸಾಧ್ಯವಿಲ್ಲ.
tour_desc_room_view=ಶಾಖೆಯಾದ್ಯಂತ ಕೊಠಡಿ ಪಟ್ಟಿ, ನಿಯೋಜಿಸಲಾದ ಹಾಸಿಗೆ ಪ್ರಕಾರಗಳು, ಮಹಡಿ ವಿವರಗಳು ಮತ್ತು ಆಕ್ಯುಪೆನ್ಸಿ ಸ್ಥಿತಿಯನ್ನು ವೀಕ್ಷಿಸಿ. ನೀವು ಕೊಠಡಿ ದಾಖಲೆಗಳನ್ನು ಸೇರಿಸಲು ಅಥವಾ ತಿದ್ದುಪಡಿ ಮಾಡಲು ಸಾಧ್ಯವಿಲ್ಲ.
tour_desc_facilities_view=ಲಾಂಡ್ರಿ, ಊಟ ಮತ್ತು ಜಿಮ್‌ನಂತಹ ನಿವಾಸಿಗಳಿಗೆ ನೀಡಲಾಗುವ ಹೆಚ್ಚುವರಿ ಸೌಲಭ್ಯಗಳನ್ನು ವೀಕ್ಷಿಸಿ. ನೀವು ಸೌಲಭ್ಯ ದಾಖಲೆಗಳನ್ನು ಸೇರಿಸಲು ಅಥವಾ ಬದಲಾಯಿಸಲು ಸಾಧ್ಯವಿಲ್ಲ.
tour_desc_hostelFeatures_view=ಹೊಂದಿಸಲಾದ ಮತ್ತು ನಿವಾಸಿಗಳಿಗೆ ಪ್ರದರ್ಶಿಸಲಾದ ಹಾಸ್ಟೆಲ್ ಸೌಲಭ್ಯಗಳನ್ನು ವೀಕ್ಷಿಸಿ. ನೀವು ಯಾವುದೇ ಹಾಸ್ಟೆಲ್ ಸೌಲಭ್ಯಗಳನ್ನು ಸೇರಿಸಲು, ತಿದ್ದುಪಡಿ ಮಾಡಲು ಅಥವಾ ತೆಗೆದುಹಾಕಲು ಸಾಧ್ಯವಿಲ್ಲ.
tour_desc_coupon_view=ಎಲ್ಲಾ ರಿಯಾಯಿತಿ ಕೂಪನ್‌ಗಳು, ಅವುಗಳ ಮಾನ್ಯತಾ ದಿನಾಂಕಗಳು ಮತ್ತು ರಿಯಾಯಿತಿ ಮೌಲ್ಯಗಳನ್ನು ವೀಕ್ಷಿಸಿ ಮತ್ತು ಕೂಪನ್ ಅನ್ನು ಹಂಚಿಕೊಳ್ಳಬಹುದು.


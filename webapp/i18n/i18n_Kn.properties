tour_desc_complaint_view=ನಿವಾಸಿಗಳು ದಾಖಲಿಸಿದ ದೂರುಗಳನ್ನು ವೀಕ್ಷಿಸಿ — ದೂರು ಪ್ರಕಾರ, ವಿವರಣೆ, ದಿನಾಂಕ ಮತ್ತು ಪ್ರಸ್ತುತ ಸ್ಥಿತಿ. ನೀವು ದೂರು ದಾಖಲಿಸಲು, ನವೀಕರಿಸಲು ಅಥವಾ ಪರಿಹರಿಸಲು ಸಾಧ್ಯವಿಲ್ಲ.

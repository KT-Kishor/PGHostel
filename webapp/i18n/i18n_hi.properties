tour_desc_coupon=डिस्काउंट कूपन बनाएँ और प्रबंधित करें। वैधता अवधि, छूट मूल्य, उपयोग सीमाएँ निर्धारित करें और कूपन साझा करें।
tour_desc_staff=विशिष्ट शाखा भूमिकाओं, संपर्क विवरण और भूमिका-आधारित पहुँच अनुमतियों के साथ कर्मचारी प्रोफ़ाइल पंजीकृत करें।
tour_desc_vendor=विक्रेता प्रोफ़ाइल पंजीकृत और प्रबंधित करें, जिसमें संपर्क विवरण, स्थान की जानकारी और अनिवार्य व्यावसायिक सत्यापन दस्तावेज़ शामिल हैं।
tour_desc_support=ग्राहक सहायता अनुरोधों की समीक्षा करें, समस्या के प्रकार और स्थिति को ट्रैक करें और निवासियों द्वारा रिपोर्ट की गई समस्याओं को एक ही स्थान से हल करें।
tour_desc_bug=हॉस्टल के विभिन्न मॉड्यूल में रिपोर्ट किए गए एप्लिकेशन बग दर्ज और ट्रैक करें, Open से Resolved तक स्थिति और स्क्रीनशॉट के साथ।
tour_desc_ads=निवासियों और आगंतुकों को दिखाए जाने वाले प्रचारात्मक विज्ञापन बनाएँ और प्रबंधित करें, शेड्यूल और दृश्यता नियंत्रण के साथ।
tour_desc_book=शाखा, कमरे का प्रकार, प्रवास की तारीखें और अतिथि विवरण एक ही प्रक्रिया में चुनकर वॉक-इन या सीधे ग्राहकों के लिए जल्दी से बुकिंग बनाएँ।
tour_desc_customer=अतिथियों का पूरा जीवनचक्र प्रबंधित करें: बुकिंग प्रबंधित करें, कमरे आवंटित या बदलें और प्रवास विवरण तथा सत्यापन दस्तावेज़ों के साथ ग्राहक प्रोफ़ाइल प्रबंधित करें।
tour_desc_invoice=GST विवरण, SAC कोड और बुकिंग के आइटम-वार मूल्य विभाजन के साथ कर-अनुरूप इनवॉइस बनाएँ।
tour_desc_deposit=सुरक्षा जमा संग्रह को ट्रैक करें और विस्तृत लेनदेन रिकॉर्ड तथा वापसी विधियों के साथ रिफंड संसाधित करें।
tour_desc_payment=लेनदेन ID, भुगतान विधियों और बैंक विवरण सहित सभी ग्राहकों के भुगतान इतिहास की निगरानी और निर्यात करें।
tour_desc_damage=संपत्ति की क्षति की रिपोर्ट करें, मरम्मत लागत की गणना करें और विस्तृत आइटम रिकॉर्ड के साथ निवासियों से वसूली ट्रैक करें।
tour_desc_complaint=निवासियों की शिकायतों की निगरानी करें, समाधान के लिए कर्मचारियों को आवंटित करें और दृश्य प्रमाण के साथ 'Open' से 'Resolved' तक स्थिति ट्रैक करें।
tour_desc_customerReview=स्वच्छता, कर्मचारी सेवा और सुविधाओं की विस्तृत रेटिंग के साथ निवासियों की प्रतिक्रिया का विश्लेषण करें और हॉस्टल की गुणवत्ता में सुधार करें।
tour_desc_bookingDashboard=सभी बुकिंग का दृश्य अवलोकन — ऑक्यूपेंसी रुझान, चेक-इन/आउट विश्लेषण और कमरे की उपलब्धता।
tour_desc_paymentDashboard=भुगतान इतिहास, राजस्व रुझान और लंबित राशियों का ग्राफ़िकल सारांश।
tour_desc_complainDashboard=सभी शिकायतों का डैशबोर्ड दृश्य — स्थिति विभाजन, समाधान रुझान और खुले मामले।
tour_desc_damageDashboard=क्षति रिपोर्ट का डैशबोर्ड दृश्य — गंभीरता विभाजन और समाधान ट्रैकिंग।

# ─── Tour Guide - FrontOfficeEmployee View-Only descriptions (per tile) ──────
tour_desc_branch_view=शाखा का नाम, स्थान, संपर्क जानकारी और आवंटित प्रबंधक जैसी सभी शाखा जानकारी देखें। आप शाखाएँ जोड़, संपादित या हटा नहीं सकते।
tour_desc_bed_view=सभी कॉन्फ़िगर किए गए बिस्तर प्रकार और उनकी कीमतें देखें। आप नए बिस्तर प्रकार बना या मौजूदा प्रकार बदल नहीं सकते।
tour_desc_room_view=शाखा-वार कमरे की सूची, आवंटित बिस्तर प्रकार, मंज़िल विवरण और ऑक्यूपेंसी स्थिति देखें। आप कमरे के रिकॉर्ड जोड़ या संपादित नहीं कर सकते।
tour_desc_facilities_view=निवासियों को दी जाने वाली अतिरिक्त सुविधाएँ जैसे लॉन्ड्री, भोजन और जिम देखें। आप सुविधा रिकॉर्ड जोड़ या बदल नहीं सकते।
tour_desc_hostelFeatures_view=कॉन्फ़िगर की गई और निवासियों को दिखाई जाने वाली हॉस्टल सुविधाएँ देखें। आप कोई हॉस्टल सुविधा जोड़, संपादित या हटा नहीं सकते।
tour_desc_coupon_view=सभी डिस्काउंट कूपन, उनकी वैधता तिथियाँ और छूट मूल्य देखें तथा कूपन साझा कर सकते हैं।

# ─── Tour Guide - HouseKeeping View-Only descriptions ────────────────────────
tour_desc_complaint_view=निवासियों द्वारा दर्ज शिकायतें देखें — शिकायत का प्रकार, विवरण, तारीख और वर्तमान स्थिति। आप शिकायत दर्ज, अपडेट या हल नहीं कर सकते।
tour_desc_complainDashboard_view=खुली, प्रगति में और हल की गई शिकायतों की संख्या तथा ट्रेंड चार्ट वाला शिकायत डैशबोर्ड देखें। यहाँ से कोई शिकायत रिकॉर्ड बदला नहीं जा सकता।


# --- General UI Labels ---
cardMetaDemoPdf=डेमो · PDF गाइड

# --- Card 1: Manage Vendors ---
topic_manageVendors_title=वेंडर प्रबंधन
topic_manageVendors_desc=वेंडर "वेंडर पंजीकरण" बटन के माध्यम से पंजीकरण कर सकते हैं और आवश्यक कंपनी और संपर्क विवरण जमा कर सकते हैं। सुपर एडमिन सिस्टम के माध्यम से जमा की गई पूरी वेंडर जानकारी की समीक्षा और सत्यापन कर सकता है। सुपर एडमिन विवरण और सत्यापन आवश्यकताओं के आधार पर वेंडरों को स्वीकृत या अस्वीकृत कर सकता है।

# --- Card 2: Branch Management ---
topic_branchManagement_title=शाखा प्रबंधन
topic_branchManagement_desc=एडमिन हॉस्टल, पीजी और होटल जैसे विभिन्न शाखा प्रकार बनाकर कई शाखाओं का प्रबंधन कर सकता है। शाखा बनाते समय एडमिन लागू जीएसटी जानकारी सहित सभी आवश्यक विवरण दर्ज कर सकता है। एडमिन रिपोर्टिंग और रिकॉर्ड रखने के लिए एक्सेल प्रारूप में पूरा शाखा डेटा डाउनलोड कर सकता है।

# --- Card 3: Bed Management ---
topic_bedManagement_title=बेड प्रबंधन
topic_bedManagement_desc=एडमिन सिंगल बेड, डबल बेड और अनुकूलित बेड कॉन्फ़िगरेशन जैसे बेड प्रकार बना और प्रबंधित कर सकता है। बेड प्रकार बनाते समय एडमिन आवश्यक विवरण प्रदान कर सकता है और चित्र अपलोड कर सकता है। प्रत्येक बेड प्रकार के लिए उपलब्ध कमरों की संख्या और अधिकतम क्षमता परिभाषित की जा सकती है।

# --- Card 4: Room Management ---
topic_roomManagement_title=कमरा प्रबंधन
topic_roomManagement_desc=एडमिन कमरे के नंबर आवंटित करके और प्रत्येक संपत्ति के लिए आवश्यक कमरों की संख्या परिभाषित करके कमरे बना और प्रबंधित कर सकता है। एडमिन चयनित कमरे या कमरे के प्रकार के आधार पर कीमतें निर्धारित कर सकता है। कमरे के विवरण, उपलब्धता और मूल्य निर्धारण को जब भी आवश्यक हो अपडेट किया जा सकता है।

# --- Card 5: Facility Management ---
topic_facilityManagement_title=सुविधा प्रबंधन
topic_facilityManagement_desc=एडमिन विभिन्न सुविधाएं बना और प्रबंधित कर सकता है और प्रत्येक सुविधा के लिए लागू मूल्य निर्धारण परिभाषित कर सकता है। उपलब्ध सेवाओं का अवलोकन प्रदान करने के लिए एडमिन छवियों और विवरणों को जोड़ सकता है। मूल्य निर्धारण दैनिक, मासिक या वार्षिक दरों के आधार पर कॉन्फ़िगर किया जा सकता है।

# --- Card 6: Amenities Management ---
topic_amenitiesManagement_title=सुविधाएं (Amenities) प्रबंधन
topic_amenitiesManagement_desc=एडमिन प्रत्येक संपत्ति में उपलब्ध विभिन्न सुविधाओं को बना और प्रबंधित कर सकता है। एडमिन प्रासंगिक छवियां जोड़ सकता है और विस्तृत जानकारी प्रदान कर सकता है। प्रणाली एडमिन को किसी विशेष संपत्ति में उपलब्ध सुविधाओं की संख्या निर्दिष्ट करने की अनुमति देती है।

# --- Card 7: Coupon Management ---
topic_couponManagement_title=कूपन प्रबंधन
topic_couponManagement_desc=एडमिन कूपन का नाम, छूट मान, अधिकतम छूट सीमा और उपयोग सीमा परिभाषित करके कूपन बना और प्रबंधित कर सकता है। एडमिन न्यूनतम ऑर्डर मूल्य कॉन्फ़िगर कर सकता है और समाप्ति तिथि निर्धारित कर सकता है। कूपन व्हाट्सएप और ईमेल के माध्यम से ग्राहकों के साथ साझा किए जा सकते हैं।

# --- Card 8: Staff Management ---
topic_staffManagement_title=स्टाफ प्रबंधन
topic_staffManagement_desc=एडमिन संपत्ति की आवश्यकताओं के आधार पर भूमिकाएं और जिम्मेदारियां सौंपकर कर्मचारियों को बना और प्रबंधित कर सकता है। पहुंच सुनिश्चित करने के लिए प्रत्येक कर्मचारी को एक शाखा में सौंपा जा सकता है। कर्मचारी अपनी साख (credentials) का उपयोग करके लॉगिन कर सकते हैं और केवल अधिकृत सुविधाओं तक पहुंच सकते हैं।

# --- Card 9: Admin Room Booking ---
topic_adminRoomBooking_title=एडमिन रूम बुकिंग
topic_adminRoomBooking_desc=एडमिन रूम बुकिंग सुविधा एडमिन को ग्राहकों के लिए और स्वयं बुकिंग के लिए बुकिंग बनाने और प्रबंधित करने की अनुमति देती है। एडमिन आवश्यक विवरण दर्ज करके और उपलब्ध कमरों का चयन करके नए ग्राहकों के लिए कमरे बुक कर सकता है। तिथियां, सुविधाएं, कूपन और जीएसटी लागू किए जा सकते हैं।

# --- Card 10: Admin Manage Bookings ---
topic_adminManageBookings_title=एडमिन बुकिंग प्रबंधन
topic_adminManageBookings_desc=एडमिन विभिन्न संपत्तियों में ग्राहकों द्वारा की गई सभी बुकिंग देख और प्रबंधित कर सकता है। परिचालन आवश्यकताओं के आधार पर बुकिंग की पुष्टि, अस्वीकार या रद्द की जा सकती है। एडमिन ग्राहकों को उपलब्ध कमरे आवंटित कर सकता है और एक्सेल डेटा डाउनलोड कर सकता है।

# --- Card 11: Invoice Management ---
topic_invoiceManagement_title=इनवॉइस प्रबंधन
topic_invoiceManagement_desc=एडमिन ग्राहक आवश्यकताओं और बुकिंग विवरणों के आधार पर इनवॉइस बना और प्रबंधित कर सकता है। मासिक, वार्षिक या संपूर्ण बुकिंग अवधि के लिए इनवॉइस उत्पन्न किए जा सकते हैं। पूर्ण इनवॉइस साझा करने और रिकॉर्ड रखने के लिए पीडीएफ प्रारूप में डाउनलोड किए जा सकते हैं।

# --- Card 12: Deposit Details ---
topic_depositDetails_title=डिपॉजिट विवरण
topic_depositDetails_desc=एडमिन कमरा आवंटन के दौरान ग्राहकों से एकत्र किए गए सभी डिपॉजिट विवरण देख और प्रबंधित कर सकता है। प्रणाली आसानी से ट्रैकिंग के लिए ग्राहक विवरण के साथ जमा राशि रिकॉर्ड करती है। लागू होने पर एडमिन ग्राहक को जमा राशि की वापसी या रिफंड को संसाधित कर सकता है।

# --- Card 13: Damage Details ---
topic_damageDetails_title=नुकसान (Damage) विवरण
topic_damageDetails_desc=जब कोई ग्राहक या छात्र किसी संपत्ति या सुविधा को नुकसान पहुंचाता है तो एडमिन नुकसान के विवरण को रिकॉर्ड और प्रबंधित कर सकता है। वस्तु के विवरण, विवरण और लागत को जोड़कर नुकसान का रिकॉर्ड बनाया जा सकता है। प्रणाली कुल लागत दर्शाने वाली एक पीडीएफ रिपोर्ट बना सकती है।

# --- Card 14: Complaint Details ---
topic_complaintDetails_title=शिकायत विवरण
topic_complaintDetails_desc=एडमिन ग्राहकों या छात्रों द्वारा दर्ज की गई सभी शिकायतों को देख और प्रबंधित कर सकता है। समस्या को समझने के लिए प्रत्येक शिकायत के साथ जमा की गई छवियों और संलग्नकों की समीक्षा की जा सकती है। जांच और समाधान के लिए शिकायतें उपयुक्त कर्मचारी को सौंपी जा सकती हैं।

# --- Card 15: Vendor Registration ---
topic_vendorRegistration_title=वेंडर पंजीकरण
topic_vendorRegistration_desc=वेंडर प्रणाली के माध्यम से पंजीकरण विवरण जमा और प्रबंधित कर सकता है। वेंडर पंजीकरण के दौरान आवश्यक व्यवसाय जानकारी, संपर्क विवरण और सत्यापन दस्तावेज प्रदान कर सकता है। स्वीकृति के बाद, लॉगिन क्रेडेंशियल ईमेल पर भेजे जाएंगे।

# --- Card 16: Customer SignUp ---
topic_customerSignUp_title=ग्राहक साइन-अप
topic_customerSignUp_desc=ग्राहक साइन-अप फॉर्म ग्राहकों को नाम और मोबाइल नंबर जैसे बुनियादी विवरण प्रदान करने की अनुमति देता है। अंतिम चरण में, ग्राहक अपने खाते के लिए एक सुरक्षित पासवर्ड सेट कर सकते हैं और सिस्टम तक पहुंचने और अपने प्रोफाइल को प्रबंधित करने के लिए सफलतापूर्वक खाता बना सकते हैं।

# --- Card 17: Set/Forgot Password ---
topic_setForgotPassword_title=पासवर्ड सेट / भूल गए
topic_setForgotPassword_desc=पासवर्ड सेट/भूल गए सुविधा ग्राहकों को अपने खाते का पासवर्ड सुरक्षित रूप से बनाने या रीसेट करने की अनुमति देती है। ओटीपी प्राप्त करने के लिए ग्राहकों को अपना पंजीकृत ईमेल पता दर्ज करना होगा। ओटीपी सत्यापन के बाद नया पासवर्ड सेट किया जा सकता है।

# --- Card 18: Create Booking ---
topic_createBooking_title=बुकिंग बनाएं
topic_createBooking_desc=क्रिएट बुकिंग सुविधा ग्राहकों को बुकिंग पेज पर जाने से पहले संपत्ति का चयन करने और अपने पसंदीदा बेड प्रकार को चुनने की अनुमति देती है। ग्राहक बुकिंग की तिथि, सदस्यों की संख्या, अतिरिक्त सुविधाएं और कूपन चुन सकते हैं।


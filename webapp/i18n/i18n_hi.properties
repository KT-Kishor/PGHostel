# Policies - Terms & Conditions
policyTermsTitle=नियम एवं शर्तें
policyTermsSubtitle=अतिथियों और संपत्ति भागीदारों के लिए स्टेवृक्ष के उपयोग के नियम।
policyTermsKp1=स्टेवृक्ष एक मध्यस्थ मार्केटप्लेस है; आवास अनुबंध ग्राहक और विक्रेता के बीच होता है।
policyTermsKp2=बुकिंग तभी पुष्ट मानी जाती है जब सफल भुगतान के बाद प्लेटफ़ॉर्म पुष्टि जारी करता है।
policyTermsKp3=प्रत्येक विक्रेता प्रत्येक लिस्टिंग के लिए अपनी रद्दीकरण, वापसी, पुनर्निर्धारण और नो-शो नीति स्वयं निर्धारित करता है।
policyTerms1Title=परिचय और स्वीकृति
policyTerms1Html=<p>ये नियम एवं शर्तें (“शर्तें”) स्टेवृक्ष (स्टेवृक्ष, “हम”, “हमें”, या “हमारा”) द्वारा संचालित वेबसाइट, मोबाइल एप्लिकेशन और संबंधित सेवाओं (सामूहिक रूप से “प्लेटफ़ॉर्म”) तक पहुँच और उसके उपयोग को नियंत्रित करती हैं। स्टेवृक्ष भारत के कानूनों के अंतर्गत संगठित एक कंपनी/प्रोप्राइटरशिप है, जिसका पंजीकृत कार्यालय 111, कल्पवृक्ष करेकल लेआउट, रेलवे पुल के पास, कलबुर्गी, कर्नाटक – 585102 पर है।</p><p>यह प्लेटफ़ॉर्म (a) होटलों, पेइंग-गेस्ट (PG) आवासों, हॉस्टलों, सर्विस अपार्टमेंटों और किराये की संपत्तियों के मालिकों, प्रबंधकों या संचालकों (“विक्रेता”) को बुकिंग के लिए अपनी संपत्तियाँ सूचीबद्ध करने तथा (b) आम जनता (“ग्राहक”, “उपयोगकर्ता”, या “आप”) को ऐसी संपत्तियों में ठहरने की खोज, बुकिंग और भुगतान करने में सक्षम बनाता है।</p><p>विक्रेता के रूप में पंजीकरण करके, ग्राहक खाता बनाकर, प्लेटफ़ॉर्म ब्राउज़ करके या बुकिंग करके, आप इन शर्तों, हमारी गोपनीयता नीति और यहाँ उल्लिखित किसी भी अतिरिक्त नीति से बंधे रहने के लिए सहमत होते हैं। यदि आप सहमत नहीं हैं, तो आपको प्लेटफ़ॉर्म का उपयोग नहीं करना चाहिए।</p>
policyTerms2Title=परिभाषाएँ
policyTerms2Html=<dl class='def'><dt>लिस्टिंग</dt><dd>प्लेटफ़ॉर्म पर विक्रेता द्वारा विज्ञापित कोई भी संपत्ति, कमरा, बेड या इकाई।</dd><dt>बुकिंग</dt><dd>प्लेटफ़ॉर्म के माध्यम से ग्राहक द्वारा लिस्टिंग के लिए की गई पुष्ट आरक्षण।</dd><dt>विक्रेता सामग्री</dt><dd>विक्रेता द्वारा अपलोड या प्रदान की गई सभी तस्वीरें, विवरण, मूल्य निर्धारण, उपलब्धता, नीतियाँ और अन्य जानकारी।</dd><dt>बुकिंग राशि</dt><dd>बुकिंग के लिए ग्राहक द्वारा देय कुल राशि, जिसमें लागू कर और प्लेटफ़ॉर्म शुल्क शामिल हैं।</dd><dt>लागू कानून</dt><dd>भारत गणराज्य के कानून, जिनमें सूचना प्रौद्योगिकी अधिनियम, 2000 (Information Technology Act, 2000), उपभोक्ता संरक्षण अधिनियम, 2019 (Consumer Protection Act, 2019) एवं उसके अंतर्गत बने नियम तथा लागू राज्य के दुकान एवं स्थापना, पर्यटन और नगरपालिका नियम शामिल हैं, किंतु इन्हीं तक सीमित नहीं।</dd></dl>
policyTerms3Title=स्टेवृक्ष की भूमिका — केवल मध्यस्थ प्लेटफ़ॉर्म
policyTerms3Html=<p>स्टेवृक्ष एक ऑनलाइन मार्केटप्लेस और मध्यस्थ है जो ग्राहकों को विक्रेताओं से जोड़ता है। स्टेवृक्ष प्लेटफ़ॉर्म पर सूचीबद्ध किसी भी होटल, PG, हॉस्टल, सर्विस अपार्टमेंट या किराये की संपत्ति का स्वामी नहीं है, न ही उसका संचालन, प्रबंधन या नियंत्रण करता है, और बुकिंग की पुष्टि पर विक्रेता तथा ग्राहक के बीच बने आवास या आतिथ्य अनुबंध का पक्षकार नहीं है।</p><p>स्टेवृक्ष सूचना प्रौद्योगिकी अधिनियम, 2000 की धारा 2(1)(w) के अर्थ में “मध्यस्थ” के रूप में कार्य करता है तथा कानून द्वारा अनुमत पूरी सीमा तक विक्रेता सामग्री और किसी भी लिस्टिंग के प्रदर्शन, सुरक्षा, वैधता और गुणवत्ता के लिए सभी दायित्वों से इनकार करता है।</p><p>प्लेटफ़ॉर्म पर कुछ भी किसी विक्रेता, लिस्टिंग या संपत्ति के संबंध में स्टेवृक्ष द्वारा किया गया समर्थन, वारंटी या गारंटी नहीं है।</p>
policyTerms4Title=विक्रेता पंजीकरण और पात्रता
policyTerms4Html=<p>संपत्ति सूचीबद्ध करने के लिए विक्रेता को पंजीकरण पूरा करना होगा और सटीक, अद्यतन तथा पूर्ण जानकारी देनी होगी, जिसमें निम्नलिखित शामिल हैं:</p><ul><li>मालिक/अधिकृत हस्ताक्षरकर्ता का सरकार द्वारा जारी वैध पहचान और पते का प्रमाण;</li><li>संपत्ति का स्वामित्व, पट्टा या उसे संचालित करने और किराए पर देने का अधिकार का प्रमाण;</li><li>संपत्ति को होटल, PG, हॉस्टल, सर्विस अपार्टमेंट या किराये के आवास के रूप में संचालित करने के लिए लागू कानून के अंतर्गत आवश्यक सभी लाइसेंस, पंजीकरण, अनुमतियाँ और प्रमाणपत्र (जहाँ लागू हो, व्यापार लाइसेंस, पुलिस/PG पंजीकरण, अग्नि सुरक्षा NOC, GST पंजीकरण और नगरपालिका स्वास्थ्य/आवास अनुमतियाँ सहित);</li><li>भुगतान के निपटान के लिए बैंक खाता तथा PAN/GST विवरण।</li></ul><p>स्टेवृक्ष अपने पूर्ण विवेक से किसी भी समय, सूचना के साथ या बिना, किसी विक्रेता या लिस्टिंग का सत्यापन, निलंबन, अस्वीकृति या सूची से हटाना कर सकता है, तथा पृष्ठभूमि जाँच कराने का उस पर कोई दायित्व नहीं है; स्टेवृक्ष द्वारा की गई कोई भी जाँच विक्रेता के अनुपालन या उपयुक्तता की वारंटी नहीं मानी जाएगी।</p>
policyTerms5Title=विक्रेता की जिम्मेदारियाँ — पूर्ण जिम्मेदारी विक्रेता की
policyTerms5Html=<p>संपत्ति, लिस्टिंग और ग्राहक के ठहरने के अनुभव के लिए पूर्ण और एकमात्र जिम्मेदारी विक्रेता की है। ऊपर कही गई बातों को सीमित किए बिना, विक्रेता विशेष रूप से निम्नलिखित के लिए उत्तरदायी होगा:</p><ul><li>तस्वीरों, कमरे के विवरण, सुविधाओं, मूल्य निर्धारण, उपलब्धता और गृह नियमों सहित सभी लिस्टिंग जानकारी की सटीकता;</li><li>संपत्ति के संचालन के लिए लागू कानून द्वारा आवश्यक सभी लाइसेंस, अनुमतियाँ, पंजीकरण, बीमा और स्वीकृतियाँ प्राप्त करना और बनाए रखना;</li><li>संपत्ति की शारीरिक सुरक्षा, संरक्षा, स्वच्छता, अग्नि सुरक्षा और संरचनात्मक मजबूती;</li><li>विक्रेता के कर्मचारियों, सुरक्षा कर्मियों और प्रतिनिधियों का आचरण, पृष्ठभूमि सत्यापन और पर्यवेक्षण;</li><li>बुकिंग के समय प्लेटफ़ॉर्म पर दिखाई गई कीमत, तिथियों और शर्तों पर पुष्ट बुकिंग का पालन;</li><li>ठहरने पर GST या अन्य वैधानिक उपकरों के संग्रह और जमा सहित सभी लागू कर कानूनों का अनुपालन;</li><li>संपत्ति पर या उसके आसपास किसी भी प्रकार से होने वाली चोट, बीमारी, हानि, चोरी, संपत्ति की क्षति या मृत्यु;</li><li>संपत्ति की गुणवत्ता, स्थिति या उपयुक्तता के संबंध में ग्राहकों के साथ विवादों का समाधान;</li><li>स्थानीय पुलिस, नगरपालिका और पर्यटन विभाग की रिपोर्टिंग तथा अतिथि पंजीकरण संबंधी सभी आवश्यकताओं का अनुपालन।</li></ul><p>विक्रेता स्वीकार करता है और सहमत होता है कि इस धारा 5 में सूचीबद्ध किसी भी विषय के लिए स्टेवृक्ष की कोई जिम्मेदारी या दायित्व नहीं है, और ऐसा संपूर्ण दायित्व केवल विक्रेता पर है।</p>
policyTerms6Title=बुकिंग और भुगतान
policyTerms6Html=<p><strong>बुकिंग की पुष्टि।</strong> बुकिंग केवल सफल भुगतान के बाद प्लेटफ़ॉर्म द्वारा पुष्टि जारी किए जाने पर ही पुष्ट होती है। विक्रेता सहमत है कि वह प्रत्येक पुष्ट बुकिंग को बुकिंग के समय प्रदर्शित कीमत और शर्तों पर, विक्रेता की घोषित नीतियों के अधीन, पूरा करेगा।</p><p><strong>भुगतान संग्रह।</strong> स्टेवृक्ष विक्रेता की ओर से, इसी प्रयोजन के लिए सीमित संग्रह एजेंट के रूप में कार्य करते हुए, प्लेटफ़ॉर्म के निर्धारित भुगतान गेटवे के माध्यम से ग्राहक से बुकिंग राशि एकत्र करता है। स्टेवृक्ष द्वारा भुगतान प्राप्त करना विक्रेता की ओर से प्राप्ति माना जाएगा।</p><p><strong>निपटान और कमीशन।</strong> स्टेवृक्ष बुकिंग राशि से अपना तय कमीशन/सेवा शुल्क काटेगा और शेष राशि विक्रेता अनुबंध में निर्दिष्ट समय-सीमा के भीतर (सामान्यतः चेक-इन/सेवा पूर्ण होने के 30 दिनों के भीतर, बशर्ते कोई वैध विवाद या चार्जबैक लंबित न हो) विक्रेता के पंजीकृत बैंक खाते में भेजेगा।</p><p><strong>कर।</strong> आवास/सेवा पर सभी लागू कर (GST सहित) विक्रेता की जिम्मेदारी है कि वह उनका लेखा-जोखा रखे और संबंधित प्राधिकरणों को जमा करे, जब तक कि लागू कानून के अंतर्गत मार्केटप्लेस सुविधाकर्ता के रूप में स्टेवृक्ष पर कोई अन्य दायित्व न हो।</p><p><strong>भुगतान विफलता और धोखाधड़ी।</strong> ग्राहक के बैंक, भुगतान गेटवे, नेटवर्क समस्याओं या किसी तीसरे पक्ष की धोखाधड़ी गतिविधि के कारण भुगतान में किसी विलंब, विफलता या उत्क्रमण के लिए स्टेवृक्ष उत्तरदायी नहीं है।</p>
policyTerms7Title=रद्दीकरण, वापसी और नो-शो नीति
policyTerms7Html=<p>प्रत्येक विक्रेता प्रत्येक लिस्टिंग के लिए अपनी रद्दीकरण, वापसी, पुनर्निर्धारण और नो-शो नीति निर्धारित करेगा, जिसे बुकिंग से पहले ग्राहक को दिखाया जाएगा। बुकिंग पूरी करके ग्राहक उस लिस्टिंग के लिए विशिष्ट विक्रेता की नीति से बंधे रहने के लिए सहमत होता है।</p><p>किसी भी वापसी को संसाधित करने में स्टेवृक्ष की भूमिका विक्रेता की घोषित नीति के अनुसार और वापसी के लिए विक्रेता के अधिकृत होने या उत्तरदायी होने के अधीन, पहले से एकत्र की गई राशि लौटाने की सुविधा देने तक सीमित है। विक्रेता को पहले से निपटाई गई किसी राशि को वापस करने का स्टेवृक्ष पर कोई दायित्व नहीं है, सिवाय विक्रेता से उसे वसूल करने के।</p><p>विक्रेता द्वारा अपनी रद्दीकरण या वापसी नीति का पालन करने से इनकार या विफलता के लिए स्टेवृक्ष उत्तरदायी नहीं होगा; ऐसी विफलता केवल ग्राहक और विक्रेता के बीच का विषय है, और इससे धारा 17 के अंतर्गत विक्रेता के विरुद्ध कार्रवाई करने के स्टेवृक्ष के अधिकार पर कोई प्रभाव नहीं पड़ेगा।</p>
policyTerms8Title=विक्रेता द्वारा क्षतिपूर्ति
policyTerms8Html=<p>विक्रेता सहमत है कि वह स्टेवृक्ष तथा उसके निदेशकों, अधिकारियों, कर्मचारियों और सहयोगियों को निम्नलिखित से उत्पन्न या उससे संबंधित सभी दावों, मांगों, हानियों, क्षतियों, दायित्वों, लागतों और व्ययों (उचित विधिक शुल्क सहित) से क्षतिपूर्ति देगा, बचाव करेगा और मुक्त रखेगा:</p><ul><li>कोई भी गलत, भ्रामक या अनधिकृत लिस्टिंग जानकारी;</li><li>विक्रेता द्वारा आवश्यक किसी लाइसेंस, अनुमति या पंजीकरण को रखने या बनाए रखने में विफलता;</li><li>संपत्ति पर या उससे जुड़े रूप में होने वाली कोई चोट, हानि, मृत्यु, चोरी या क्षति;</li><li>इन शर्तों, लागू कानून या किसी तीसरे पक्ष के अधिकार का विक्रेता द्वारा उल्लंघन;</li><li>विक्रेता और ग्राहक के बीच कोई विवाद।</li></ul>
policyTerms9Title=ग्राहक के दायित्व
policyTerms9Html=<p>ग्राहक सहमत होते हैं कि वे:</p><ul><li>सटीक पहचान और बुकिंग जानकारी प्रदान करेंगे;</li><li>जिस विक्रेता की संपत्ति वे बुक करते हैं, उसके गृह नियमों, चेक-इन/चेक-आउट समय और नीतियों का पालन करेंगे;</li><li>विक्रेताओं, कर्मचारियों और अन्य अतिथियों के प्रति कानूनसम्मत और सम्मानजनक व्यवहार करेंगे;</li><li>संपत्ति को स्वयं पहुँचाई गई किसी क्षति के लिए उत्तरदायी होंगे, जो सीधे विक्रेता को देय होगी;</li><li>प्लेटफ़ॉर्म का किसी भी अवैध, धोखाधड़ीपूर्ण या अनधिकृत उद्देश्य के लिए उपयोग नहीं करेंगे (शुल्क बचाने के लिए प्लेटफ़ॉर्म को दरकिनार कर विक्रेता से सीधे बुकिंग करना सहित)।</li></ul><p>ग्राहक इस धारा के अपने उल्लंघन या प्लेटफ़ॉर्म के किसी दुरुपयोग से उत्पन्न किसी भी हानि के लिए स्टेवृक्ष को क्षतिपूर्ति देने के लिए सहमत है।</p>
policyTerms10Title=दायित्व की सीमा
policyTerms10Html=<p>प्लेटफ़ॉर्म और सभी लिस्टिंग “जैसा है” और “जैसा उपलब्ध है” के आधार पर प्रदान किए जाते हैं। स्टेवृक्ष किसी भी लिस्टिंग या विक्रेता की सटीकता, गुणवत्ता, सुरक्षा, वैधता या उपयुक्तता के संबंध में कोई स्पष्ट या निहित वारंटी नहीं देता।</p><p>लागू कानून द्वारा अनुमत अधिकतम सीमा तक, स्टेवृक्ष किसी भी प्रत्यक्ष, अप्रत्यक्ष, आकस्मिक, विशेष या परिणामी क्षति के लिए उत्तरदायी नहीं होगा, जिसमें व्यक्तिगत चोट, मृत्यु, संपत्ति की क्षति, ठहरने की हानि या विक्रेता की चूक से उत्पन्न हानि शामिल है, किंतु इन्हीं तक सीमित नहीं, जो किसी बुकिंग या प्लेटफ़ॉर्म के उपयोग से उत्पन्न या उससे जुड़ी हो।</p><p>जहाँ लागू कानून के अंतर्गत स्टेवृक्ष के किसी दायित्व को बाहर नहीं रखा जा सकता, वहाँ ऐसा दायित्व कुल मिलाकर उस विशिष्ट बुकिंग के संबंध में स्टेवृक्ष द्वारा वास्तव में रखे गए प्लेटफ़ॉर्म शुल्क/कमीशन तक सीमित होगा जिससे दावा उत्पन्न हुआ है।</p>
policyTerms11Title=समीक्षाएँ और रेटिंग
policyTerms11Html=<p>ग्राहक अपने ठहराव की ईमानदार समीक्षाएँ प्रस्तुत कर सकते हैं। स्टेवृक्ष उन समीक्षाओं को नियंत्रित, हटा या प्रकाशित करने से मना कर सकता है जो अवैध, मानहानिकारक, धोखाधड़ीपूर्ण या इन शर्तों का उल्लंघन करती हैं, परंतु प्रत्येक समीक्षा के सत्यापन के लिए वह बाध्य नहीं है और उपयोगकर्ता द्वारा प्रस्तुत समीक्षाओं की सामग्री के लिए उत्तरदायी नहीं है।</p>
policyTerms12Title=निलंबन और समाप्ति
policyTerms12Html=<p>स्टेवृक्ष इन शर्तों के उल्लंघन, धोखाधड़ी गतिविधि, बार-बार ग्राहक शिकायतों, आवश्यक लाइसेंस बनाए न रखने, या ऐसे किसी भी आचरण के आधार पर, जिसे स्टेवृक्ष उचित रूप से प्लेटफ़ॉर्म, अन्य उपयोगकर्ताओं या स्टेवृक्ष की प्रतिष्ठा के लिए हानिकारक मानता है, सूचना के साथ या बिना, किसी विक्रेता या ग्राहक की प्लेटफ़ॉर्म तक पहुँच को निलंबित, प्रतिबंधित या समाप्त कर सकता है।</p><p>शिकायत, चार्जबैक या संदिग्ध धोखाधड़ी की जाँच लंबित रहने तक विक्रेता को देय किसी भी राशि को रोका जा सकता है।</p>
policyTerms13Title=बौद्धिक संपदा
policyTerms13Html=<p>प्लेटफ़ॉर्म, उसका डिज़ाइन, लोगो, ट्रेडमार्क और अंतर्निहित सॉफ़्टवेयर स्टेवृक्ष या उसके लाइसेंसधारकों की अनन्य संपत्ति हैं। विक्रेता स्टेवृक्ष को प्लेटफ़ॉर्म के संचालन और प्रचार के प्रयोजन से विक्रेता सामग्री का प्लेटफ़ॉर्म पर और उसके विपणन में उपयोग, पुनरुत्पादन और प्रदर्शन करने के लिए एक गैर-अनन्य, रॉयल्टी-मुक्त लाइसेंस प्रदान करता है।</p>
policyTerms14Title=डेटा गोपनीयता
policyTerms14Html=<p>विक्रेताओं और ग्राहकों से एकत्र किया गया व्यक्तिगत डेटा स्टेवृक्ष की <a href='#Policies/privacy'>गोपनीयता नीति</a> और लागू कानून, जिसमें डिजिटल व्यक्तिगत डेटा संरक्षण अधिनियम, 2023 (Digital Personal Data Protection Act, 2023) शामिल है, के अनुसार संसाधित किया जाता है। प्लेटफ़ॉर्म का उपयोग करके आप ऐसे संसाधन के लिए सहमति देते हैं।</p>
policyTerms15Title=फ़ोर्स मेज्योर (अप्रत्याशित परिस्थितियाँ)
policyTerms15Html=<p>स्टेवृक्ष अपने उचित नियंत्रण से परे की घटनाओं के कारण होने वाली किसी भी विफलता या विलंब के लिए उत्तरदायी नहीं होगा, जिनमें प्राकृतिक आपदाएँ, महामारियाँ, सरकारी आदेश, इंटरनेट या भुगतान गेटवे में व्यवधान, हड़तालें या नागरिक अशांति शामिल हैं।</p>
policyTerms16Title=शासी कानून और विवाद समाधान
policyTerms16Html=<p>ये शर्तें भारत के कानूनों द्वारा शासित और उनके अनुसार व्याख्यायित होंगी।</p><p>इन शर्तों से उत्पन्न या इनसे संबंधित कोई भी विवाद पहले धारा 17 की शिकायत निवारण व्यवस्था के माध्यम से सौहार्दपूर्वक हल करने का प्रयास किया जाएगा। 30 दिनों के भीतर सौहार्दपूर्ण समाधान न होने पर, विवाद को मध्यस्थता और सुलह अधिनियम, 1996 (Arbitration and Conciliation Act, 1996) के अंतर्गत मध्यस्थता द्वारा अंतिम रूप से निपटाया जाएगा, जिसका स्थान कलबुर्गी होगा और कार्यवाही स्टेवृक्ष द्वारा नियुक्त एकमात्र मध्यस्थ के समक्ष अंग्रेज़ी में होगी।</p><p>उपरोक्त के अधीन, कलबुर्गी, कर्नाटक के न्यायालयों को अनन्य क्षेत्राधिकार होगा।</p>
policyTerms17Title=शिकायत निवारण अधिकारी
policyTerms17Html=<p>सूचना प्रौद्योगिकी अधिनियम, 2000 तथा उपभोक्ता संरक्षण (ई-कॉमर्स) नियम, 2020 के अनुसार शिकायत अधिकारी का विवरण निम्नलिखित है:</p><div class='contact-card'><h3>शिकायत अधिकारी</h3><p><strong>नाम:</strong> शिकायत टीम<br><strong>पद:</strong> शिकायत अधिकारी<br><strong>ईमेल:</strong> <a href='mailto:admin@stayvriksha.in'>admin@stayvriksha.in</a><br><strong>पता:</strong> 111, कल्पवृक्ष करेकल लेआउट, रेलवे पुल के पास, कलबुर्गी, कर्नाटक – 585102</p><p><strong>प्रतिक्रिया समय-सीमा:</strong> 48 घंटे के भीतर पावती; शिकायत प्राप्त होने के 30 दिनों के भीतर समाधान।</p></div>
policyTerms18Title=संशोधन
policyTerms18Html=<p>स्टेवृक्ष किसी भी समय संशोधित शर्तों को अद्यतन “अंतिम अद्यतन” दिनांक के साथ प्लेटफ़ॉर्म पर प्रकाशित करके इन शर्तों को संशोधित कर सकता है। ऐसे परिवर्तनों के बाद प्लेटफ़ॉर्म का निरंतर उपयोग संशोधित शर्तों की स्वीकृति माना जाएगा।</p>
policyTerms19Title=पृथक्करणीयता और संपूर्ण अनुबंध
policyTerms19Html=<p>यदि इन शर्तों का कोई प्रावधान अवैध या अप्रवर्तनीय ठहराया जाता है, तो शेष प्रावधान पूर्ण रूप से प्रभावी बने रहेंगे। ये शर्तें, गोपनीयता नीति और किसी भी विक्रेता अनुबंध के साथ मिलकर, उनके विषय के संबंध में पक्षकारों के बीच संपूर्ण अनुबंध का निर्माण करती हैं।</p>
policyTerms20Title=संपर्क
policyTerms20Html=<p>इन शर्तों के संबंध में किसी भी प्रश्न के लिए कृपया संपर्क करें:</p><div class='contact-card'><h3>स्टेवृक्ष</h3><p>ईमेल: <a href='mailto:admin@stayvriksha.in'>admin@stayvriksha.in</a></p><p>पता: 111, कल्पवृक्ष करेकल लेआउट, रेलवे पुल के पास, कलबुर्गी, कर्नाटक – 585102</p></div>

# Policies - Privacy Policy
policyPrivacyTitle=गोपनीयता नीति
policyPrivacySubtitle=हम व्यक्तिगत जानकारी कैसे एकत्र, उपयोग, साझा, संग्रह और सुरक्षित करते हैं।
policyPrivacy1Title=परिचय
policyPrivacy1Html=<p>स्टेवृक्ष ग्राहकों, संपत्ति विक्रेताओं और हमारी वेबसाइट के आगंतुकों की गोपनीयता का सम्मान करता है।</p><p>यह गोपनीयता नीति बताती है कि जब आप हमारे प्लेटफ़ॉर्म पर जाते हैं, खाता बनाते हैं, आवास बुक करते हैं, संपत्ति पंजीकृत करते हैं या हमसे संपर्क करते हैं, तो हम व्यक्तिगत जानकारी कैसे एकत्र, उपयोग, साझा, संग्रह और सुरक्षित करते हैं।</p>
policyPrivacy2Title=हम कौन-सी जानकारी एकत्र कर सकते हैं
policyPrivacy2Html=<p>प्लेटफ़ॉर्म का आप कैसे उपयोग करते हैं, इसके आधार पर हम निम्नलिखित श्रेणियों की जानकारी एकत्र कर सकते हैं:</p><h3>क. खाता और संपर्क जानकारी</h3><ul><li>नाम, ईमेल पता, फ़ोन नंबर और खाता क्रेडेंशियल।</li><li>संचार प्राथमिकताएँ और सहायता पत्राचार।</li></ul><h3>ख. बुकिंग जानकारी</h3><ul><li>संपत्ति, कमरा और बुकिंग संदर्भ।</li><li>चेक-इन और चेक-आउट तिथियाँ, अतिथियों की संख्या, बुकिंग स्थिति और रद्दीकरण रिकॉर्ड।</li><li>विशेष अनुरोध या वह जानकारी जो आप प्रदान करना चुनते हैं।</li></ul><h3>ग. भुगतान जानकारी</h3><ul><li>लेनदेन संदर्भ, भुगतान स्थिति, राशि और वापसी जानकारी।</li><li>भुगतान तीसरे पक्ष के भुगतान सेवा प्रदाताओं द्वारा संसाधित किए जा सकते हैं। जब तक विशेष रूप से अधिकृत न हो और लागू सुरक्षा आवश्यकताओं का अनुपालन न हो, हम पूर्ण कार्ड क्रेडेंशियल एकत्र या संग्रहित नहीं करेंगे।</li></ul><h3>घ. विक्रेता जानकारी</h3><ul><li>व्यवसाय और संपत्ति का विवरण।</li><li>मालिक या अधिकृत प्रतिनिधि की जानकारी।</li><li>आवश्यक होने पर पहचान, पता, स्वामित्व या संचालन प्राधिकार दस्तावेज़, लाइसेंस, कर जानकारी और बैंक निपटान विवरण।</li></ul><h3>ङ. तकनीकी जानकारी</h3><ul><li>एकत्र किए जाने पर IP पता, ब्राउज़र या डिवाइस जानकारी, लॉग डेटा और वेबसाइट उपयोग जानकारी।</li><li>उपयोग किए जाने पर कुकीज़ और समान तकनीकें।</li></ul><p>हम केवल वही जानकारी एकत्र करते हैं जो हमारे घोषित प्रयोजनों और लागू कानूनी दायित्वों के लिए उचित रूप से आवश्यक है।</p>
policyPrivacy3Title=हम जानकारी का उपयोग कैसे करते हैं
policyPrivacy3Html=<p>हम व्यक्तिगत जानकारी का उपयोग निम्नलिखित के लिए कर सकते हैं:</p><ul><li>ग्राहक और विक्रेता खाते बनाना और उनका प्रबंधन करना।</li><li>आवास बुकिंग की खोज, आरक्षण, पुष्टि और प्रबंधन करना।</li><li>भुगतान प्रसंस्करण, वापसी और विक्रेता निपटान की सुविधा देना।</li><li>बुकिंग पुष्टि, रद्दीकरण, अनुस्मारक और सेवा अपडेट संप्रेषित करना।</li><li>विक्रेता और संपत्ति की जानकारी सत्यापित करना।</li><li>शिकायतों, सहायता अनुरोधों और विवादों का उत्तर देना।</li><li>धोखाधड़ी, दुरुपयोग, अनधिकृत पहुँच और सुरक्षा खतरों का पता लगाना।</li><li>प्लेटफ़ॉर्म को बेहतर बनाना और सेवा के उपयोग को समझना।</li><li>कानूनी, नियामक, लेखा और रिकॉर्ड-रखरखाव दायित्वों को पूरा करना।</li><li>कानून द्वारा अनुमत होने पर और लागू प्राथमिकताओं के अनुसार प्रचारात्मक संचार भेजना।</li></ul>
policyPrivacy4Title=जानकारी कैसे साझा की जाती है
policyPrivacy4Html=<p>हम प्रासंगिक जानकारी निम्नलिखित के साथ साझा कर सकते हैं:</p><ul><li><strong>संपत्ति विक्रेता:</strong> बुकिंग पूरी करने के लिए आवश्यक जानकारी, जैसे अतिथि का नाम, बुकिंग विवरण, संपर्क विवरण और आवश्यक चेक-इन जानकारी।</li><li><strong>भुगतान सेवा प्रदाता:</strong> भुगतान, वापसी और लेनदेन सत्यापन के लिए आवश्यक जानकारी।</li><li><strong>प्रौद्योगिकी और सेवा प्रदाता:</strong> होस्टिंग, वेबसाइट रखरखाव, ग्राहक सहायता, संचार, विश्लेषिकी और सुरक्षा सेवा प्रदाता जिन्हें हम नियुक्त करते हैं।</li><li><strong>व्यावसायिक सलाहकार:</strong> आवश्यक होने पर विधिक, लेखा, अंकेक्षण या अनुपालन सलाहकार।</li><li><strong>सरकारी और नियामक प्राधिकरण:</strong> जहाँ कानून द्वारा प्रकटीकरण आवश्यक हो या अन्यथा विधिपूर्वक अनुमत हो।</li><li><strong>अन्य पक्ष:</strong> जहाँ धोखाधड़ी से निपटने, अधिकारों और सुरक्षा की रक्षा करने या उचित सुरक्षा उपायों के साथ लेनदेन करने के लिए आवश्यक हो।</li></ul><p>हम सेवा प्रदाताओं को लागू व्यवस्थाओं और कानून से परे असंबंधित प्रयोजनों के लिए व्यक्तिगत जानकारी का उपयोग करने का अधिकार नहीं देते।</p>
policyPrivacy5Title=कुकीज़ और समान तकनीकें
policyPrivacy5Html=<p>हमारी वेबसाइट सत्र बनाए रखने, प्राथमिकताएँ याद रखने, सुरक्षा का समर्थन करने या वेबसाइट उपयोग को समझने के लिए कुकीज़ या समान तकनीकों का उपयोग कर सकती है।</p><p>जहाँ लागू हो, आप अपने ब्राउज़र या उपलब्ध वेबसाइट सेटिंग्स के माध्यम से कुकीज़ नियंत्रित कर सकते हैं। कुछ कुकीज़ को अक्षम करने से प्लेटफ़ॉर्म के कुछ कार्य प्रभावित हो सकते हैं।</p><p>उपयोग की जाने वाली किसी भी विश्लेषिकी या विज्ञापन तकनीक का विवरण हमारे वास्तविक कार्यान्वयन के अनुसार प्रकट किया जाना चाहिए।</p>
policyPrivacy6Title=डेटा प्रतिधारण
policyPrivacy6Html=<p>हम व्यक्तिगत जानकारी केवल उतने समय तक रखते हैं जितना इस नीति में वर्णित प्रयोजनों के लिए उचित रूप से आवश्यक है, जिनमें सेवाएँ प्रदान करना, विवादों का समाधान, व्यावसायिक रिकॉर्ड बनाए रखना, धोखाधड़ी रोकना और कानूनी दायित्वों का अनुपालन शामिल है।</p><p>प्रतिधारण अवधि डेटा श्रेणी और लागू आवश्यकताओं के अनुसार भिन्न होती है। जिन जानकारियों की अब आवश्यकता नहीं है, उन्हें उपयुक्त और कानूनी रूप से अनुमत होने पर सुरक्षित रूप से हटाया या अनाम किया जाना चाहिए।</p>
policyPrivacy7Title=डेटा सुरक्षा
policyPrivacy7Html=<p>हम संसाधित की जाने वाली जानकारी और उसमें शामिल जोखिमों के अनुरूप उचित तकनीकी और संगठनात्मक सुरक्षा उपायों का उपयोग करते हैं।</p><p>ऑनलाइन संचरण या इलेक्ट्रॉनिक भंडारण की कोई भी विधि पूर्ण सुरक्षा की गारंटी नहीं दे सकती। यदि व्यक्तिगत डेटा का उल्लंघन होता है, तो हम लागू कानून के अनुसार प्रतिक्रिया देंगे और सूचनाएँ प्रदान करेंगे।</p>
policyPrivacy8Title=आपके गोपनीयता अधिकार और अनुरोध
policyPrivacy8Html=<p>लागू कानून के अधीन, आपको जानकारी तक पहुँच का अनुरोध करने, गलत जानकारी में सुधार या अद्यतन करने, पात्र जानकारी को हटाने, जहाँ संसाधन सहमति पर आधारित है वहाँ सहमति वापस लेने तथा शिकायत या उपचार प्रक्रियाओं के बारे में जानकारी पाने के अधिकार हो सकते हैं।</p><p>अनुरोध <a href='mailto:admin@stayvriksha.in'>admin@stayvriksha.in</a> पर भेजे जा सकते हैं।</p><p>अनुरोध संसाधित करने से पहले हमें आपकी पहचान सत्यापित करनी पड़ सकती है। कानूनी दायित्वों को पूरा करने या विवादों के समाधान के लिए कुछ जानकारी बनाए रखनी पड़ सकती है।</p>
policyPrivacy9Title=बच्चे और आवास बुकिंग
policyPrivacy9Html=<p>हमारा प्लेटफ़ॉर्म उन लोगों के लिए है जो कानूनी रूप से संबंधित सेवाओं का उपयोग करने में सक्षम हैं। बुकिंग करने वाले व्यक्ति को संपत्ति और कानून की लागू आयु, पहचान और रहने की क्षमता संबंधी आवश्यकताओं का पालन करना होगा।</p><p>जहाँ बच्चों की व्यक्तिगत जानकारी संसाधित की जाती है, स्टेवृक्ष लागू कानूनी आवश्यकताओं का पालन करेगा। विक्रेताओं को अतिथि जानकारी को असंबंधित प्रयोजनों के लिए एकत्र या उपयोग नहीं करना चाहिए।</p>
policyPrivacy10Title=तीसरे पक्ष की सेवाएँ और लिंक
policyPrivacy10Html=<p>प्लेटफ़ॉर्म में तीसरे पक्ष की वेबसाइटों और भुगतान प्रदाताओं के लिंक या एकीकरण हो सकते हैं। उनकी गोपनीयता प्रथाएँ उनकी अपनी नीतियों द्वारा नियंत्रित होती हैं।</p><p>ग्राहकों और विक्रेताओं को उन सेवाओं का उपयोग करते समय प्रासंगिक तीसरे पक्ष की गोपनीयता जानकारी की समीक्षा करनी चाहिए।</p>
policyPrivacy11Title=इस नीति में परिवर्तन
policyPrivacy11Html=<p>हमारी सेवाओं, डेटा प्रथाओं या कानूनी दायित्वों में परिवर्तन होने पर हम इस गोपनीयता नीति को अद्यतन कर सकते हैं। संशोधित संस्करण अद्यतन दिनांक के साथ प्रकाशित किया जाएगा, और जहाँ आवश्यक हो वहाँ अतिरिक्त सूचना या सहमति प्रदान की जाएगी।</p>
policyPrivacy12Title=संपर्क और गोपनीयता शिकायतें
policyPrivacy12Html=<p>गोपनीयता संबंधी प्रश्नों या अनुरोधों के लिए संपर्क करें:</p><div class='contact-card'><h3>स्टेवृक्ष</h3><p><strong>ईमेल:</strong> <a href='mailto:admin@stayvriksha.in'>admin@stayvriksha.in</a></p><p><strong>पता:</strong> 111, कल्पवृक्ष करेकल लेआउट, रेलवे पुल के पास, कलबुर्गी, कर्नाटक – 585102</p></div>

# Policies - Cancellation & Refund
policyRefundTitle=रद्दीकरण एवं वापसी नीति
policyRefundSubtitle=बुकिंग रद्दीकरण, वापसी अनुरोध, पुनर्निर्धारण, नो-शो और भुगतान से जुड़े मुद्दों को कैसे संभाला जाता है।
policyRefund1Title=उद्देश्य
policyRefund1Html=<p>यह नीति बताती है कि स्टेवृक्ष पर बुकिंग रद्दीकरण, वापसी अनुरोध, पुनर्निर्धारण, नो-शो और भुगतान से संबंधित मुद्दों को कैसे संभाला जाता है।</p><p>स्टेवृक्ष ग्राहकों को आवास प्रदाताओं से जोड़ता है। रद्दीकरण और वापसी की शर्तें संपत्ति, कमरे के प्रकार, बुकिंग योजना और तिथियों के अनुसार भिन्न हो सकती हैं।</p>
policyRefund2Title=संपत्ति-विशिष्ट रद्दीकरण नियम
policyRefund2Html=<p>बुकिंग करने से पहले ग्राहकों को संबंधित संपत्ति या बुकिंग पृष्ठ पर दिखाई गई रद्दीकरण नीति की समीक्षा करनी चाहिए।</p><p>बुकिंग निम्न प्रकार की हो सकती है:</p><ul><li><strong>निःशुल्क रद्दीकरण:</strong> निर्दिष्ट समय-सीमा के भीतर, प्रदर्शित शर्तों के अधीन, बिना किसी रद्दीकरण शुल्क के रद्दीकरण की अनुमति होती है।</li><li><strong>आंशिक रूप से वापसी योग्य:</strong> प्रदर्शित नीति के अनुसार राशि का एक निर्दिष्ट हिस्सा वापस किया जा सकता है।</li><li><strong>वापसी न होने योग्य:</strong> स्वैच्छिक रद्दीकरण पर बुकिंग राशि वापस नहीं की जा सकती, सिवाय इसके कि विक्रेता की नीति या लागू कानून अन्यथा प्रावधान करे।</li></ul><p>ये नीति श्रेणियाँ हैं, इस बात की गारंटी नहीं कि प्रत्येक लिस्टिंग तीनों विकल्प प्रदान करती है। बुकिंग के लिए प्रदर्शित वास्तविक शर्तें लागू होंगी।</p>
policyRefund3Title=बुकिंग कैसे रद्द करें
policyRefund3Html=<p>ग्राहकों को अपने खाते में उपलब्ध रद्दीकरण विकल्प का उपयोग करना चाहिए या <a href='mailto:admin@stayvriksha.in'>admin@stayvriksha.in</a> पर स्टेवृक्ष सहायता से संपर्क करना चाहिए।</p><p>अनुरोध प्रस्तुत करते समय निम्नलिखित दें:</p><ul><li>बुकिंग संदर्भ संख्या।</li><li>पंजीकृत फ़ोन नंबर या ईमेल पता।</li><li>संपत्ति का नाम और ठहरने की तिथियाँ।</li><li>अनुरोध किए जाने पर रद्दीकरण का कारण।</li></ul><p>ग्राहकों को अपने रिकॉर्ड के लिए रद्दीकरण की पुष्टि संभाल कर रखनी चाहिए।</p><p>रद्दीकरण अनुरोध लागू बुकिंग शर्तों के अधीन है। पुष्टि प्रदान किए जाने तक ग्राहकों को यह नहीं मानना चाहिए कि बुकिंग रद्द हो गई है।</p>
policyRefund4Title=वापसी की पात्रता
policyRefund4Html=<p>वापसी की पात्रता संपत्ति-विशिष्ट रद्दीकरण नीति, बुकिंग शर्तों, रद्दीकरण के समय और लागू कानून पर निर्भर करती है।</p><p>जहाँ वापसी स्वीकृत होती है, वहाँ वापसी योग्य राशि की गणना लागू नीति के अनुसार की जाएगी, जिसमें बुकिंग से पहले बताए गए अनुमत रद्दीकरण शुल्क या वापसी न होने योग्य घटक शामिल होंगे।</p><p>वापसी उस स्थिति में भी विचारित की जा सकती है जब विक्रेता पुष्ट बुकिंग रद्द कर देता है, बुक किया गया आवास प्रदान नहीं कर पाता, या जहाँ संबंधित नीति या कानून के अंतर्गत कोई अन्य वापसी अधिकार लागू होता है।</p>
policyRefund5Title=विक्रेता द्वारा आरंभ किए गए रद्दीकरण
policyRefund5Html=<p>यदि कोई विक्रेता पुष्ट बुकिंग रद्द कर देता है या बुक किया गया आवास प्रदान नहीं कर पाता, तो स्टेवृक्ष ग्राहक की उपलब्ध समाधान प्रक्रिया में सहायता करेगा।</p><p>परिस्थितियों और लागू शर्तों के आधार पर इसमें वापसी या ग्राहक द्वारा स्वीकृत वैकल्पिक व्यवस्था शामिल हो सकती है।</p><p>विक्रेताओं को रद्दीकरण या महत्वपूर्ण परिवर्तनों की सूचना तुरंत स्टेवृक्ष को देनी चाहिए और प्रभावित बुकिंगों को सुलझाने में सहयोग करना चाहिए।</p>
policyRefund6Title=नो-शो और विलंबित आगमन
policyRefund6Html=<p>नो-शो तब होता है जब कोई ग्राहक लागू चेक-इन अवधि के भीतर नहीं पहुँचता और उसने विक्रेता द्वारा स्वीकृत कोई व्यवस्था नहीं की है।</p><p>नो-शो शुल्क और वापसी की पात्रता उस बुकिंग के लिए बताई गई रद्दीकरण और नो-शो शर्तों पर निर्भर करेगी।</p><p>देर से पहुँचने की संभावना वाले ग्राहकों को पहले से संपत्ति से संपर्क करना चाहिए। देर से आने पर आरक्षण स्वतः नहीं बढ़ता और न ही वापसी की गारंटी मिलती है।</p>
policyRefund7Title=जल्दी चेक-आउट और कम किया गया ठहराव
policyRefund7Html=<p>यदि कोई ग्राहक बुक किए गए प्रस्थान दिनांक से पहले चेक-आउट करता है, तो अप्रयुक्त रातों की किसी भी वापसी की निर्भरता संपत्ति-विशिष्ट नीति और लागू कानून पर होगी।</p><p>ग्राहकों को समीक्षा का अनुरोध करने के लिए विक्रेता और स्टेवृक्ष सहायता से संपर्क करना चाहिए।</p>
policyRefund8Title=वापसी प्रसंस्करण
policyRefund8Html=<p>वापसी स्वीकृत होने के बाद, स्टेवृक्ष या संबंधित भुगतान सेवा प्रदाता लागू भुगतान प्रक्रिया के अनुसार प्रसंस्करण आरंभ करेगा।</p><p>ग्राहक के खाते में राशि दिखाई देने में लगने वाला समय भुगतान विधि, बैंक, कार्ड जारीकर्ता या भुगतान प्रदाता पर निर्भर हो सकता है।</p><p>प्रकाशित प्रसंस्करण समय-सीमा: [अपनी सत्यापित वापसी आरंभ समय-सीमा और किसी भी संबंधित अपवाद को भरें।]</p><p>यदि निर्दिष्ट अवधि के भीतर वापसी दिखाई नहीं देती, तो ग्राहकों को अपने बुकिंग संदर्भ और लेनदेन विवरण के साथ <a href='mailto:admin@stayvriksha.in'>admin@stayvriksha.in</a> पर संपर्क करना चाहिए।</p>
policyRefund9Title=विफल, दोहरे या लंबित भुगतान
policyRefund9Html=<p>यदि राशि काट ली गई हो परंतु बुकिंग पुष्ट नहीं हुई हो, या यदि दोहरा भुगतान किया गया प्रतीत होता है, तो ग्राहकों को सहायता से संपर्क करना चाहिए और लेनदेन संदर्भ देना चाहिए।</p><p>स्टेवृक्ष संबंधित भुगतान प्रदाता के साथ लेनदेन की समीक्षा करेगा और समाधान बताएगा।</p><p>लंबित भुगतान अनिवार्यतः पूर्ण बुकिंग नहीं है। जहाँ संभव हो, ग्राहकों को बुकिंग स्थिति जाँचे बिना दूसरा भुगतान करने से बचना चाहिए।</p>
policyRefund10Title=वापसी की विधि
policyRefund10Html=<p>स्वीकृत वापसी सामान्यतः मूल भुगतान विधि में की जाएगी, जहाँ भुगतान प्रदाता द्वारा समर्थित हो और कानून द्वारा अनुमत हो।</p><p>यदि वह विधि उपलब्ध नहीं है, तो कोई भी वैकल्पिक वापसी व्यवस्था भुगतान प्रदाता की आवश्यकताओं और लागू कानून के अनुसार संभाली जाएगी।</p>
policyRefund11Title=विवाद और उपचार
policyRefund11Html=<p>यदि कोई ग्राहक रद्दीकरण शुल्क या वापसी निर्णय से सहमत नहीं है, तो वह बुकिंग संदर्भ और सहायक जानकारी के साथ <a href='mailto:admin@stayvriksha.in'>admin@stayvriksha.in</a> पर संपर्क कर सकता है।</p><p>स्टेवृक्ष अनुरोध की समीक्षा करेगा, आवश्यक होने पर विक्रेता या भुगतान प्रदाता से परामर्श करेगा और लागू समय-सीमा के भीतर परिणाम बताएगा।</p><p>इस नीति में कुछ भी लागू कानून के अंतर्गत उपलब्ध अधिकारों या उपचारों को सीमित नहीं करता।</p>
policyRefund12Title=हमसे संपर्क करें
policyRefund12Html=<p>रद्दीकरण या वापसी सहायता के लिए:</p><div class='contact-card'><h3>स्टेवृक्ष सहायता</h3><p><strong>ईमेल:</strong> <a href='mailto:admin@stayvriksha.in'>admin@stayvriksha.in</a></p><p><strong>पता:</strong> 111, कल्पवृक्ष करेकल लेआउट, रेलवे पुल के पास, कलबुर्गी, कर्नाटक – 585102</p></div>

# Policies - Vendor Agreement
policyVendorTitle=विक्रेता अनुबंध
policyVendorSubtitle=प्लेटफ़ॉर्म पर संपत्ति मालिकों, प्रबंधकों और अधिकृत आवास संचालकों की भागीदारी को नियंत्रित करने वाला अनुबंध।
policyVendorKp1=यह विक्रेता अनुबंध स्टेवृक्ष प्लेटफ़ॉर्म पर संपत्ति मालिकों, प्रबंधकों और अधिकृत आवास संचालकों (“विक्रेता”) की भागीदारी को नियंत्रित करता है।
policyVendorKp2=संपत्ति पंजीकृत करके या लागू विक्रेता शर्तों को इलेक्ट्रॉनिक रूप से स्वीकार करके, विक्रेता इस अनुबंध, स्टेवृक्ष की नियम एवं शर्तों तथा लागू कानूनों का अनुपालन करने के लिए सहमत होता है।
policyVendor1Title=पात्रता और पंजीकरण
policyVendor1Html=<p>विक्रेता पात्र होटलों, हॉस्टलों, PG आवासों, सर्विस अपार्टमेंटों और किराये की संपत्तियों को सूचीबद्ध करने के लिए आवेदन कर सकते हैं।</p><p>पंजीकरण के दौरान स्टेवृक्ष निम्नलिखित मांग सकता है:</p><ul><li>मालिक या अधिकृत प्रतिनिधि के सरकार द्वारा जारी पहचान और पता दस्तावेज़।</li><li>स्वामित्व, पट्टे, प्रबंधन प्राधिकार या संपत्ति संचालित करने और सूचीबद्ध करने की अनुमति का प्रमाण।</li><li>लागू लाइसेंस, पंजीकरण, अनुमतियाँ और सुरक्षा स्वीकृतियाँ।</li><li>आवश्यक होने पर व्यवसाय, PAN, GST और बैंक खाता विवरण।</li><li>सटीक संपत्ति जानकारी, कमरे का विवरण, तस्वीरें, सुविधाएँ और मूल्य निर्धारण।</li></ul><p>पंजीकरण और दस्तावेज़ जमा करने से स्वतः स्वीकृति की गारंटी नहीं मिलती। स्टेवृक्ष वैध परिचालन, सत्यापन, सुरक्षा या अनुपालन कारणों से अतिरिक्त जानकारी मांग सकता है या लिस्टिंग अस्वीकार कर सकता है।</p>
policyVendor2Title=लिस्टिंग की सटीकता
policyVendor2Html=<p>विक्रेता को यह सुनिश्चित करना होगा कि प्रत्येक लिस्टिंग सटीक, पूर्ण, अद्यतन और भ्रामक न हो।</p><p>विक्रेता निम्नलिखित के बारे में सही जानकारी बनाए रखने के लिए उत्तरदायी है:</p><ul><li>संपत्ति का नाम, स्थान और संपर्क विवरण।</li><li>कमरे के प्रकार, बेड की व्यवस्था, अधिकतम रहने की क्षमता और उपलब्धता।</li><li>सुविधाएँ, विशेषताएँ, सुगम्यता फ़ीचर और संपत्ति की तस्वीरें।</li><li>दरें, कर, अनिवार्य शुल्क, जमा राशि और अन्य लागू शुल्क।</li><li>चेक-इन/चेक-आउट समय, पहचान संबंधी आवश्यकताएँ और गृह नियम।</li><li>रद्दीकरण, वापसी, पुनर्निर्धारण और नो-शो शर्तें।</li></ul><p>महत्वपूर्ण परिवर्तनों को तुरंत अद्यतन किया जाना चाहिए। विक्रेताओं को ऐसी सुविधाओं, उपलब्धता या कीमतों का विज्ञापन नहीं करना चाहिए जिन्हें वे पूरा नहीं कर सकते।</p>
policyVendor3Title=कानूनी अनुपालन और संपत्ति मानक
policyVendor3Html=<p>संपत्ति और उसके संचालन पर लागू सभी स्वीकृतियाँ और पंजीकरण प्राप्त करना तथा बनाए रखना विक्रेता की जिम्मेदारी है।</p><p>संपत्ति और क्षेत्राधिकार के आधार पर इसमें संबंधित स्थानीय आवास, व्यापार, नगरपालिका, पुलिस, अग्नि सुरक्षा, पर्यटन और कर संबंधी आवश्यकताएँ शामिल हो सकती हैं।</p><p>विक्रेता को उचित स्वच्छता, सुरक्षा, अग्नि सुरक्षा, संरचनात्मक सुरक्षा और वैध संचालन स्थितियाँ बनाए रखनी होंगी।</p><p>स्टेवृक्ष द्वारा दस्तावेज़ों या किसी लिस्टिंग की समीक्षा निरीक्षण, प्रमाणन या कानून द्वारा लगाए गए दायित्वों का विकल्प नहीं है।</p>
policyVendor4Title=बुकिंग और अतिथि सेवा
policyVendor4Html=<p>विक्रेता को:</p><ul><li>विज्ञापित शर्तों के अनुसार पुष्ट बुकिंग का पालन करना होगा।</li><li>बुक किया गया आवास, कमरे की श्रेणी और घोषित सुविधाएँ प्रदान करनी होंगी।</li><li>सटीक उपलब्धता बनाए रखनी होगी और असंगत आरक्षण स्वीकार करने से बचना होगा।</li><li>चेक-इन निर्देश और महत्वपूर्ण परिवर्तन समय पर संप्रेषित करने होंगे।</li><li>अतिथियों के साथ निष्पक्ष और सम्मानजनक व्यवहार करना होगा।</li><li>शिकायतों का तुरंत समाधान करना होगा और मामला उठने पर स्टेवृक्ष के साथ सहयोग करना होगा।</li><li>यदि पुष्ट बुकिंग पूरी नहीं की जा सकती तो स्टेवृक्ष को तुरंत सूचित करना होगा।</li></ul><p>विक्रेता बिना बताए कोई अनिवार्य शुल्क नहीं लगा सकता या उचित कानूनी आधार और ग्राहक की आवश्यक सहमति के बिना तय बुकिंग शर्तों में महत्वपूर्ण परिवर्तन नहीं कर सकता।</p>
policyVendor5Title=मूल्य निर्धारण, कमीशन और भुगतान
policyVendor5Html=<p>विक्रेता सहमत है कि लागू कमीशन, प्लेटफ़ॉर्म सेवा शुल्क, कर, निपटान कार्यक्रम और भुगतान शर्तें विक्रेता द्वारा स्वीकृत व्यावसायिक शर्तों में निर्धारित की जाएँगी।</p><ul><li><strong>कमीशन दर:</strong> [सहमत दर या स्वीकृत व्यावसायिक अनुसूची का संदर्भ भरें।]</li><li><strong>निपटान समय-सीमा:</strong> [सहमत समय-सीमा और कोई भी लागू शर्तें भरें।]</li><li><strong>निपटान विधि:</strong> [समर्थित निपटान विधि भरें।]</li></ul><p>स्टेवृक्ष लागू अनुबंध और कानून द्वारा अधिकृत होने पर बुकिंग आय से सहमत शुल्क और अन्य उचित रूप से लगाए जाने योग्य राशियाँ काट सकता है।</p><p>निपटान भुगतान प्रदाता प्रसंस्करण, वापसी, चार्जबैक, धोखाधड़ी समीक्षा, अनसुलझे बुकिंग विवाद और लागू कानूनी आवश्यकताओं के अधीन हो सकते हैं। कोई भी रोकी गई राशि सहमत शर्तों और लागू कानून के अनुसार संभाली जानी चाहिए।</p><p>अपने लागू कर रिपोर्टिंग और भुगतान दायित्वों के लिए विक्रेता उत्तरदायी हैं, सिवाय उस स्थिति के जहाँ कानूनी दायित्व स्टेवृक्ष या किसी अन्य पक्ष पर लगाया गया हो।</p>
policyVendor6Title=रद्दीकरण, वापसी और नो-शो
policyVendor6Html=<p>विक्रेताओं को प्रत्येक लागू लिस्टिंग के लिए स्पष्ट और सटीक रद्दीकरण, वापसी, पुनर्निर्धारण और नो-शो शर्तें निर्धारित करनी होंगी।</p><p>ये शर्तें बुकिंग की पुष्टि से पहले ग्राहकों के लिए उपलब्ध कराई जानी चाहिए।</p><p>विक्रेताओं को स्वीकृत नीति और लागू कानून का पालन करना होगा, रद्दीकरण अनुरोधों की सूचना तुरंत स्टेवृक्ष को देनी होगी और वापसी प्रसंस्करण में सहयोग करना होगा।</p><p>यदि कोई विक्रेता पुष्ट बुकिंग रद्द करता है या किसी अतिथि को ठहरा नहीं पाता, तो उसे स्टेवृक्ष को सूचित करना होगा और उचित समाधान की व्यवस्था में सहयोग करना होगा।</p>
policyVendor7Title=ग्राहक जानकारी और गोपनीयता
policyVendor7Html=<p>विक्रेता ग्राहक जानकारी का उपयोग केवल बुकिंग, अतिथि संचार, चेक-इन, सुरक्षा, कानूनी अनुपालन और संबंधित सेवा वितरण से जुड़े वैध प्रयोजनों के लिए कर सकते हैं।</p><p>विक्रेताओं को चाहिए कि वे:</p><ul><li>अनधिकृत पहुँच या प्रकटीकरण से ग्राहक जानकारी की रक्षा करें।</li><li>पहुँच को केवल अधिकृत कर्मियों तक सीमित रखें।</li><li>वैध आधार के बिना अतिथि जानकारी का उपयोग असंबंधित विपणन के लिए न करें।</li><li>जानकारी केवल कानून द्वारा अनुमत या आवश्यक अवधि तक ही रखें।</li><li>प्लेटफ़ॉर्म के माध्यम से प्राप्त जानकारी से जुड़े संदिग्ध डेटा उल्लंघन की सूचना तुरंत स्टेवृक्ष को दें और लागू सूचना आवश्यकताओं का पालन करें।</li></ul><p>विक्रेताओं को लागू गोपनीयता और डेटा संरक्षण दायित्वों का पालन करना होगा।</p>
policyVendor8Title=संपत्ति सामग्री और बौद्धिक संपदा
policyVendor8Html=<p>विक्रेता पुष्टि करता है कि संपत्ति की तस्वीरें, विवरण, लोगो और अन्य लिस्टिंग सामग्री अपलोड करने तथा उसके उपयोग को अधिकृत करने के लिए उसके पास आवश्यक अधिकार और अनुमतियाँ हैं।</p><p>विक्रेता स्टेवृक्ष को लागू संबंध की अवधि के दौरान संबंधित लिस्टिंग और प्लेटफ़ॉर्म को संचालित, प्रचारित और विपणित करने के लिए अधिकृत लिस्टिंग सामग्री को प्रदर्शित, पुनरुत्पादित और उपयोग करने का गैर-अनन्य, रॉयल्टी-मुक्त लाइसेंस प्रदान करता है।</p><p>यह लाइसेंस विक्रेता की बौद्धिक संपदा का स्वामित्व हस्तांतरित नहीं करता।</p><p>अपनी लिस्टिंग से संबंधित किसी भी बौद्धिक संपदा शिकायत की सूचना विक्रेता को तुरंत स्टेवृक्ष को देनी होगी।</p>
policyVendor9Title=शिकायतें, सुरक्षा और जाँच
policyVendor9Html=<p>संपत्ति से जुड़े सेवा मुद्दों का समाधान करना और लागू सुरक्षा आवश्यकताओं का अनुपालन करना विक्रेता की जिम्मेदारी है।</p><p>कथित गलत निरूपण, बुकिंग विफलता, ग्राहक शिकायतों, धोखाधड़ी या सुरक्षा चिंताओं से जुड़ी उचित जाँचों में विक्रेता को सहयोग करना होगा।</p><p>स्टेवृक्ष समर्थक साक्ष्य मांग सकता है, किसी लिस्टिंग को प्रतिबंधित कर सकता है, नई बुकिंग रोक सकता है, या उचित रूप से आवश्यक होने पर लागू कानून और संविदात्मक दायित्वों के अधीन अन्य आनुपातिक कार्रवाई कर सकता है।</p>
policyVendor10Title=निलंबन और समाप्ति
policyVendor10Html=<p>कोई भी पक्ष लागू अनुबंध के अनुसार व्यावसायिक संबंध समाप्त कर सकता है।</p><p>स्टेवृक्ष ऐसी वैध चिंताओं के होने पर लिस्टिंग निलंबित या हटा सकता है जिनमें महत्वपूर्ण संविदात्मक उल्लंघन, गलत जानकारी, संदिग्ध धोखाधड़ी, कानूनी अनुपालन की कमी, सुरक्षा जोखिम या बार-बार अनसुलझी शिकायतें शामिल हैं।</p><p>जहाँ उपयुक्त हो, विक्रेता को सूचित किया जाएगा और उत्तर देने या मुद्दा ठीक करने का अवसर दिया जाएगा।</p><p>समाप्ति से मौजूदा बुकिंग स्वतः रद्द नहीं होती और भुगतान, वापसी, रिकॉर्ड-रखरखाव या अन्य ऐसे दायित्व समाप्त नहीं होते जो समाप्ति के बाद भी बने रहते हैं।</p>
policyVendor11Title=क्षतिपूर्ति और दायित्व
policyVendor11Html=<p>प्रत्येक पक्ष अपने स्वयं के कार्यों, चूकों तथा संविदात्मक और कानूनी दायित्वों के लिए उत्तरदायी है।</p><p>कानून द्वारा अनुमत सीमा तक, इस अनुबंध के विक्रेता द्वारा उल्लंघन, अवैध संचालन, भ्रामक लिस्टिंग जानकारी, तीसरे पक्ष के अधिकारों का उल्लंघन, या लापरवाह या गलत आचरण से उत्पन्न हानियों, दावों या व्ययों के लिए विक्रेता उत्तरदायी होगा।</p><p>कोई भी क्षतिपूर्ति दायित्व लागू कानून के अधीन है और ऐसे दायित्व को बाहर नहीं रखता जिसे कानूनी रूप से बाहर नहीं रखा जा सकता।</p>
policyVendor12Title=विवाद समाधान
policyVendor12Html=<p>पक्षकारों को पहले सद्भावपूर्ण चर्चा और स्टेवृक्ष की शिकायत प्रक्रिया के माध्यम से विवादों को हल करने का प्रयास करना चाहिए।</p><p>कोई भी मध्यस्थता या न्यायालय कार्यवाही लागू कानून और किसी भी वैध विवाद-समाधान अनुबंध के अधीन होगी।</p>
policyVendor13Title=अनुबंध में परिवर्तन
policyVendor13Html=<p>कमीशन और निपटान व्यवस्थाओं सहित महत्वपूर्ण व्यावसायिक शर्तों में परिवर्तन लागू अनुबंध और कानून द्वारा अपेक्षित तरीके से संप्रेषित और स्वीकार किए जाएँगे।</p><p>अनुबंध और लागू कानून द्वारा अनुमत होने पर अद्यतन प्लेटफ़ॉर्म नीतियाँ लागू हो सकती हैं।</p>
policyVendor14Title=विक्रेता की स्वीकृति
policyVendor14Html=<p>प्रकाशन के लिए संपत्ति प्रस्तुत करने से पहले विक्रेता को पुष्टि करनी चाहिए कि वह:</p><ul><li>संपत्ति को सूचीबद्ध करने और संचालित करने के लिए अधिकृत है।</li><li>सटीक जानकारी और सहायक दस्तावेज़ प्रदान किए हैं।</li><li>लागू व्यावसायिक शर्तों की समीक्षा की है।</li><li>बुकिंग, रद्दीकरण, वापसी, गोपनीयता और निपटान दायित्वों को समझता है।</li><li>इस विक्रेता अनुबंध और लागू कानून का पालन करने के लिए सहमत है।</li></ul><div class='contact-card'><h3>स्वीकृति</h3><p><strong>विक्रेता / व्यवसाय का नाम:</strong> [विक्रेता का नाम]<br><strong>अधिकृत प्रतिनिधि:</strong> [नाम]<br><strong>संपत्ति का नाम:</strong> [संपत्ति का नाम]<br><strong>स्वीकृति की तिथि:</strong> [दिनांक]<br><strong>इलेक्ट्रॉनिक स्वीकृति / हस्ताक्षर:</strong> [निर्धारित स्वीकृति विधि]</p></div>
policyVendor15Title=संपर्क
policyVendor15Html=<p>विक्रेता संबंधी प्रश्नों या सहायता के लिए संपर्क करें:</p><div class='contact-card'><h3>स्टेवृक्ष विक्रेता सहायता</h3><p><strong>ईमेल:</strong> <a href='mailto:admin@stayvriksha.in'>admin@stayvriksha.in</a></p><p><strong>पता:</strong> 111, कल्पवृक्ष करेकल लेआउट, रेलवे पुल के पास, कलबुर्गी, कर्नाटक – 585102</p></div>

